coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 1%

# Carryforward keeps the integration matrix's per-component uploads from
# blanking each other out — each job uploads only its own profile, so without
# this, only the last-uploaded component would have a non-zero coverage line.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: integration

comment:
  layout: "reach,diff,flags,files"
  require_changes: false

# Generated / non-hand-written code is excluded from the coverage statistic: it
# is produced by a generator, not authored by hand, so counting it only dilutes
# the number that reflects real, testable code.
ignore:
  - "**/zz_generated*.go"        # controller-gen deepcopy (zz_generated.deepcopy.go)
  - "**/*.gen.go"                # oapi-codegen System clients (internal/clients/*/generated)
  - "**/generated/**"            # generated client packages
  - "**/*_mock.go"
  - "**/mocks/**"
  - "test/**"
  - "axisml-system/*-operator/cmd/**"
