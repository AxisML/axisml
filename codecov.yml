coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 1%

# Carryforward keeps the envtest matrix's per-operator uploads from blanking
# each other out — each job uploads only its own operator's profile, so without
# this, only the last-uploaded operator would have a non-zero coverage line.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: envtest

comment:
  layout: "reach,diff,flags,files"
  require_changes: false

ignore:
  - "**/zz_generated_*.go"
  - "**/*_mock.go"
  - "**/mocks/**"
  - "test/**"
  - "components/operators/*/cmd/**"
