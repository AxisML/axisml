coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 1%

# Carryforward keeps the integration matrix's per-component uploads from
# blanking each other out — each job uploads only its own profile, so without
# this, only the last-uploaded component would have a non-zero coverage line.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: integration

comment:
  layout: "reach,diff,flags,files"
  require_changes: false

ignore:
  - "**/zz_generated_*.go"
  - "**/*_mock.go"
  - "**/mocks/**"
  - "test/**"
  - "components/operator/cmd/**"
