---
# CRD for the ElasticQuota type consumed by the AxisML self-built scheduler
# (axisml-scheduler). Group is the upstream scheduler-plugins
# "scheduling.x-k8s.io" (kubernetes-sigs/scheduler-plugins). The operators carry
# an in-repo, wire-compatible Go copy of this type under
# axisml-system/tenant-operator/api/scheduling/v1alpha1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticquotas.scheduling.x-k8s.io
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/scheduler-plugins/pull/52
spec:
  group: scheduling.x-k8s.io
  names:
    kind: ElasticQuota
    listKind: ElasticQuotaList
    plural: elasticquotas
    shortNames:
    - eq
    - eqs
    singular: elasticquota
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        description: ElasticQuota sets elastic quota restrictions per namespace.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: ElasticQuotaSpec defines Min and Max for Quota.
            type: object
            properties:
              min:
                description: Min is the desired guaranteed limits per resource.
                type: object
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
              max:
                description: Max is the desired upper bound per resource.
                type: object
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
          status:
            description: ElasticQuotaStatus reflects the observed usage.
            type: object
            properties:
              used:
                description: Used is the current observed total usage in the namespace.
                type: object
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
