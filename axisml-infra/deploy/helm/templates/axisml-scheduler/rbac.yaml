{{- if .Values.axismlScheduler.enabled }}
# --- Scheduler ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axisml-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
# The scheduler reuses the built-in kube-scheduler / volume-scheduler roles for
# core scheduling permissions, plus this role for the AxisML scheduling CRs and
# leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axisml-scheduler
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
rules:
  - apiGroups: ["scheduling.x-k8s.io"]
    resources: ["elasticquotas", "elasticquotas/status", "podgroups", "podgroups/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "persistentvolumeclaims", "persistentvolumes", "replicationcontrollers", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io", ""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # The scheduler framework (built on k8s 1.34 libraries) starts informers for
  # Dynamic Resource Allocation and storage scheduling; without these the caches
  # never sync and /readyz fails ("handlers are not fully synchronized"). The
  # bound system:kube-scheduler role does not grant resource.k8s.io on older
  # clusters, so grant it explicitly here.
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceslices", "resourceclaims", "resourceclaimtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaims/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes", "csidrivers", "csistoragecapacities", "storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
---
# kube-scheduler reads the extension-apiserver-authentication ConfigMap in
# kube-system to configure delegated authn; grant the standard reader role so
# the lookup succeeds instead of falling back to anonymous.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axisml-scheduler-extension-apiserver-authentication-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: axisml-scheduler
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axisml-scheduler
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axisml-scheduler
subjects:
  - kind: ServiceAccount
    name: axisml-scheduler
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axisml-scheduler-kube-scheduler
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: axisml-scheduler
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axisml-scheduler-volume-scheduler
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: axisml-scheduler
    namespace: {{ .Release.Namespace }}
---
# --- Controller (ElasticQuota.status.used aggregation) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axisml-scheduler-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: axisml-scheduler-controller
    app.kubernetes.io/part-of: axisml-infra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axisml-scheduler-controller
  labels:
    app.kubernetes.io/name: axisml-scheduler-controller
    app.kubernetes.io/part-of: axisml-infra
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.x-k8s.io"]
    resources: ["elasticquotas", "elasticquotas/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axisml-scheduler-controller
  labels:
    app.kubernetes.io/name: axisml-scheduler-controller
    app.kubernetes.io/part-of: axisml-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axisml-scheduler-controller
subjects:
  - kind: ServiceAccount
    name: axisml-scheduler-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
