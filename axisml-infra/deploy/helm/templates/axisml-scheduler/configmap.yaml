{{- if .Values.axismlScheduler.enabled }}
{{- $s := .Values.axismlScheduler }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: axisml-scheduler-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: axisml-scheduler
    app.kubernetes.io/part-of: axisml-infra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: {{ $s.leaderElection.enabled }}
      resourceName: axisml-scheduler
      resourceNamespace: {{ .Release.Namespace }}
    profiles:
      - schedulerName: axisml-scheduler
        plugins:
          queueSort:
            enabled:
              - name: Coscheduling
            disabled:
              - name: "*"
          preFilter:
            enabled:
              - name: Coscheduling
              - name: ElasticScheduling
          postFilter:
            enabled:
              - name: Coscheduling
          permit:
            enabled:
              - name: Coscheduling
          reserve:
            enabled:
              - name: Coscheduling
              - name: ElasticScheduling
          postBind:
            enabled:
              - name: Coscheduling
          score:
            enabled:
              - name: NodeResourcesFit
                weight: {{ $s.binpack.weight | default 5 }}
        pluginConfig:
          - name: Coscheduling
            args:
              permitWaitingTimeSeconds: {{ $s.coscheduling.permitWaitingTimeSeconds | default 10 }}
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                # MostAllocated => binpack: prefer filling already-used nodes.
                type: MostAllocated
                resources:
                  {{- toYaml $s.binpack.resources | nindent 18 }}
{{- end }}
