info:
  description: REST API for the artifact registry. Items are keyed by (namespace,
    kind, name, version). RFC7807 Problem responses on errors.
  title: AxisML Artifact Hub API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          description: Capability document.
      summary: Get deployment-form capabilities
      tags:
      - Capabilities
  /api/v1/namespaces/{namespace}/datasets:
    get:
      operationId: listDatasets
      parameters:
      - description: Tenant namespace (= compute tenants.name).
        in: path
        name: namespace
        required: true
        schema:
          type: string
      - description: Page size (1–200, default 50).
        in: query
        name: limit
        schema:
          format: int32
          type: integer
      - description: Opaque continuation token from a previous page.
        in: query
        name: continue
        schema:
          type: string
      - description: Optional status filter (pending, ready, failed).
        in: query
        name: status
        schema:
          type: string
      - description: K8s-style label selector filtered against the row's labels jsonb.
        in: query
        name: labelSelector
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
          description: Page.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Validation error.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Unauthorized.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Forbidden.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Conflict.
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Gone.
        "412":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Precondition failed.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Service unavailable.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactHubError'
          description: Unexpected error.
      summary: List every dataset (across all names) in a namespace
      tags:
      - Artifacts
