info:
  description: REST API for per-namespace Jobs, Services and traffic policies. Tenant/Quota
    and ResourcePool/Unit live in the cluster-manager CRDs; compute partitions on
    the bare namespace string (= tenant identifier) supplied by Platform. RFC7807
