      operationId: readyz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: dependency not yet ready
      summary: Readiness probe
      tags:
      - Health
servers:
- description: Same-origin
  url: /
tags:
- description: MLRun CRUD per namespace. ResourcePool/Unit referenced by name (read
    from K8s Informer cache).
  name: MLRuns
- description: MLService CRUD per namespace.
  name: MLServices
- description: 'MLTrafficPolicy CRUD per namespace: weighted / canary / blue-green
    traffic split over member online services.'
  name: TrafficPolicies
- description: Deployment-form capability document (runtime engine / quota enforcement).
  name: Capabilities
- description: Liveness and readiness probes.
  name: Health
