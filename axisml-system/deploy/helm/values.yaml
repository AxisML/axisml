# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# Seed resources (installed via Helm post-install hooks)
# =============================================================================
# These give fresh clusters a usable starting state without forcing operators
# to run the cluster-manager / compute-service REST bootstrap themselves. Each
# block can be disabled by flipping enabled=false (e.g. for an external
# bootstrap pipeline that owns the same objects).
seed:
  resourcePool:
    enabled: true
    # Pool name (cluster-scoped). compute-service's pool/unit expansion looks
    # up the (poolName, unitName) tuple at Job/Service create time.
    name: default
    units:
      - name: cpu-small
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
      - name: cpu-medium
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 8Gi

  tenant:
    enabled: true
    # Built-in platform tenant; hosts visibility=public artifacts.
    name: default
    # Stable UUID stamped on the seed Tenant CR as
    # metadata.labels[tenant.axisml.io/id] for external selectors. tenant-
    # operator's reconciler propagates this id onto the namespace + child
    # resources it provisions.
    id: 00000000-0000-0000-0000-000000000001
    # Shared K8s namespace used by the built-in tenant.
    namespace: axisml-tenant

# =============================================================================
# AxisML Compute Service
# =============================================================================
computeService:
  enabled: true
  replicaCount: 1

  image:
    # Published by .github/workflows/ci.yml on every push to main.
    registry: ghcr.io
    repository: axisml/axisml-compute-service
    tag: ""               # defaults to .Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080           # HTTP API

  # Listener ports are fixed in code; these only wire containerPort/Service/probes.
  metricsPort: 8081      # Prometheus /metrics
  probesPort: 8082       # /healthz + /readyz

  log:
    level: info          # debug | info | warn | error
    format: json         # json | console

  serviceMonitor:
    enabled: false       # opt-in once kube-prometheus-stack is deployed
    labels: {}
    interval: 30s

  networkPolicy:
    enabled: true
    platformNamespace: axisml-platform
    monitoringNamespace: axisml-infra

  bootstrap:
    enabled: true        # runs DB migrations via a post-install Job

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Artifact Hub
# =============================================================================
artifactHub:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-artifact-hub
    tag: ""              # Empty → defaults to .Chart.AppVersion via axisml.image
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080           # HTTP API

  # Listener ports are fixed in code; these only wire containerPort/Service/probes.
  metricsPort: 8081
  probesPort: 8082

  log:
    level: info
    format: json

  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

  networkPolicy:
    enabled: true
    platformNamespace: axisml-platform
    monitoringNamespace: axisml-infra

  storage:
    oci:
      # The infra zot chart sets fullnameOverride: zot, so the Service is "zot"
      # (not "<infra-release>-zot"). Address it by that name.
      endpoint: http://zot.axisml-infra:5000   # scheme is derived from this URL
      adminSecretRef:
        # Empty name → chart renders default secret <release>-artifact-hub-zot.
        # Override with an externally-managed Secret name to avoid storing
        # zot admin creds in values.yaml.
        name: ""
        usernameKey: username
        passwordKey: password
        # Inline creds — only used when adminSecretRef.name is empty so the
        # chart can render a default Secret. Override at install time.
        username: admin
        password: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Operator
# =============================================================================
# =============================================================================
# Cluster Manager
# =============================================================================
# Stateless thin shell that translates REST calls into Tenant CR CRUD on the
# K8s API server. No PG, no leader election (multi-replica is safe — all
# mutations go through the K8s API server's optimistic concurrency control).
clusterManager:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-cluster-manager
    tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  service:
    port: 8080
  probesPort: 8082
  metricsPort: 8081

  # Namespaces a Tenant CR may NOT point spec.namespace.name at. Mirrors the
  # tenant-operator denylist; cluster-manager pre-validates so bad CRs never
  # reach etcd.
  namespaceDenylist:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
    - axisml-system
    - axisml-infra

  # cluster-manager trusts the X-Axisml-User header for caller identity (it
  # is purely an audit hint — the gateway upstream is the real authn
  # boundary). Restrict ingress at the network layer so the header cannot
  # be spoofed by other in-cluster workloads.
  networkPolicy:
    enabled: true
    platformNamespace: axisml-platform
    monitoringNamespace: axisml-infra

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# =============================================================================
# Tenant Operator
# =============================================================================
# Reconciles the Tenant CR — provisions Namespace, ElasticQuota,
# per-tenant Secret/ConfigMap/SA/RBAC. Single reconciler, no dispatcher.
tenantOperator:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-tenant-operator
    tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  leaderElection:
    enabled: true
    id: axisml-tenant-operator.axisml.io

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Periodic re-reconcile interval for source Secret/ConfigMap drift.
  resyncPeriod: 10m
  # Target namespaces a Tenant CR may NOT point spec.namespace.name at.
  namespaceDenylist:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
    - axisml-system
    - axisml-infra

# =============================================================================
# Compute Operator
# =============================================================================
# Reconciles MLRun and MLService CRs. Dispatcher + handler model; routes by
# spec.backend.{name,engine}.
computeOperator:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-compute-operator
    tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  leaderElection:
    enabled: true
    id: axisml-compute-operator.axisml.io

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Per-CRD controller toggles. Each maps to a `--enable-*` flag on the binary.
  controllers:
    mlrun:
      enabled: true
    mlservice:
      enabled: true
    mltrafficpolicy:
      enabled: true

# =============================================================================
# Metadata Database (PostgreSQL)
# =============================================================================
# The PostgreSQL engine is owned by the axisml-infra chart (bitnami sub-chart,
# Service `axisml-database` in the `infraNamespace`). The system layer treats it
# as a fixed in-cluster dependency: with `database.enabled=true`, compute-service
# and artifact-hub connect to `<fullnameOverride>.<infraNamespace>:<port>` and
# render their own connection Secret from `auth.password`. That password MUST
# match `database.auth.password` in the axisml-infra chart. Set
# `database.enabled=false` and configure `externalDatabase` to use a managed DB.
database:
  enabled: true
  # Service name of the PostgreSQL instance in the infra namespace.
  fullnameOverride: axisml-database
  port: 5432
  sslMode: disable
  auth:
    database: axisml
    username: axisml
    # Shared with axisml-infra's `database.auth.password`; consumed by the
    # per-service connection Secret rendered in this namespace.
    password: axisml

# -- Namespace hosting the axisml-infra chart (PostgreSQL, object storage, etc.).
# Used to build the cross-namespace database DNS name.
infraNamespace: axisml-infra

# Metrics backend for the per-workload (compute-service) and per-pool
# (cluster-manager) metrics endpoints. Points at the infra kube-prometheus-stack.
# Set prometheusUrl to "" to disable those endpoints (they then report 502/503).
# GPU (DCGM) metrics and per-pool node scoping rely on the infra chart's DCGM
# ServiceMonitor + kube-state-metrics node-label allowlist, both enabled there by
# default; disabling them in infra makes those queries return an empty series.
metrics:
  prometheusUrl: http://prometheus-prometheus.axisml-infra.svc.cluster.local:9090

# -- External database (used when database.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: axisml
  username: axisml
  existingSecret: ""
