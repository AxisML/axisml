{{- if .Values.tenantOperator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-tenant-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "tenant-operator") | nindent 4 }}
rules:
  # Operational eventing — needed for kubectl describe.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Tenant CR + status.
  - apiGroups: ["axisml.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["axisml.io"]
    resources: ["tenants/status"]
    verbs: ["get", "update", "patch"]
  # Required because subreconcilers call controllerutil.SetControllerReference,
  # which sets blockOwnerDeletion=true. With Kubernetes' owner-reference admission
  # plugin enabled, creating those children needs update on tenants/finalizers.
  - apiGroups: ["axisml.io"]
    resources: ["tenants/finalizers"]
    verbs: ["update"]

  # Namespace lifecycle: explicitly NO delete (operator design).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "patch"]

  # ElasticQuota (scheduler-plugins API group is scheduling.x-k8s.io).
  - apiGroups: ["scheduling.x-k8s.io"]
    resources: ["elasticquotas"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Per-tenant init resources.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Predefined data volumes: ensured as managed PVCs in the tenant namespace.
  # Explicitly NO delete — the operator never reclaims a data volume, so a spec
  # change or tenant teardown can never destroy tenant data.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # The apiserver's RBAC escalation check rejects creating a Role whose rules
  # the operator doesn't itself hold, and rejects RoleBindings to a Role/
  # ClusterRole the operator can't bind. Tenants supply arbitrary rules and
  # may reference platform ClusterRoles, so grant the targeted verbs here.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
{{- end }}
