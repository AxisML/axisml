{{- if .Values.clusterManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-cluster-manager
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "cluster-manager") | nindent 4 }}
rules:
  # ResourcePool CR — full CRUD: cluster-manager is the REST writer.
  - apiGroups: ["axisml.io"]
    resources: ["resourcepools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Tenant CR — full CRUD: cluster-manager is the REST writer; tenant-operator
  # reconciles it and writes status (which cluster-manager reads on GET).
  - apiGroups: ["axisml.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PersistentVolumeClaims (cross-namespace): cluster-manager's Volume REST
  # materialises / expands / reclaims the durable data volumes compute
  # references. update/patch back the expand-volume path; compute holds none.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

  # Pods (cross-namespace, read-only): mount-occupancy reverse lookup for the
  # data-volume detail view and delete-time protection.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # StorageClasses (cluster-scoped, read-only): the new-volume picker.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]

  # Events: emit audit events on REST mutations.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- end }}
