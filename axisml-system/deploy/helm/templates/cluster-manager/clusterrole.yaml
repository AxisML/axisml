{{- if .Values.clusterManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-cluster-manager
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "cluster-manager") | nindent 4 }}
rules:
  # ResourcePool CR — full CRUD: cluster-manager is the REST writer.
  - apiGroups: ["axisml.io"]
    resources: ["resourcepools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Tenant CR — full CRUD: cluster-manager is the REST writer; tenant-operator
  # reconciles it and writes status (which cluster-manager reads on GET).
  - apiGroups: ["axisml.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PersistentVolumeClaims (cross-namespace): cluster-manager's Volume REST
  # materialises / reclaims the durable volumes compute references (e.g. the
  # volume backing a kind=workspace MLService). compute no longer holds this.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]

  # Events: emit audit events on REST mutations.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- end }}
