{{- if .Values.clusterManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "axisml.fullname" . }}-cluster-manager
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "cluster-manager") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "axisml.fullname" . }}-cluster-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "axisml.fullname" . }}-cluster-manager
    namespace: {{ .Release.Namespace }}
{{- end }}
