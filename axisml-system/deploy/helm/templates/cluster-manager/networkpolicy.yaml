{{- if and .Values.clusterManager.enabled .Values.clusterManager.networkPolicy.enabled }}
{{- $cm := .Values.clusterManager }}
# cluster-manager trusts X-Axisml-User. Restrict the API port to Platform;
# metrics remain scrapeable from Infra and probes remain reachable by kubelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axisml.fullname" . }}-cluster-manager
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "cluster-manager") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "cluster-manager") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $cm.networkPolicy.platformNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ $cm.service.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $cm.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ $cm.metricsPort }}
    - ports:
        - protocol: TCP
          port: {{ $cm.probesPort }}
{{- end }}
