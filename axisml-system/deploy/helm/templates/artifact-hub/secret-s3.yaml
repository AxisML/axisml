{{- if and .Values.artifactHub.enabled .Values.artifactHub.storage.s3.endpoint (not .Values.artifactHub.storage.s3.credentialsSecretRef.name) }}
{{/*
RustFS/S3 secret key for the dataset backend. Only rendered when an S3 endpoint
is configured and credentialsSecretRef.name is empty (so the chart provides a
default); otherwise the Deployment references an externally-managed Secret with
the same key shape.

secretKey has no default — `required` fails the install with a clear error if
the operator enables S3 without supplying a key. To skip, leave
artifactHub.storage.s3.endpoint empty (datasets record the client digest
unverified) or point credentialsSecretRef.name at an externally-managed Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axisml.fullname" . }}-artifact-hub-s3
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "artifact-hub") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.artifactHub.storage.s3.credentialsSecretRef.secretKeyKey }}: {{ required "artifactHub.storage.s3.credentialsSecretRef.secretKey is required when s3.endpoint is set (or set credentialsSecretRef.name to point at an externally-managed Secret)" .Values.artifactHub.storage.s3.credentialsSecretRef.secretKey | quote }}
{{- end }}
