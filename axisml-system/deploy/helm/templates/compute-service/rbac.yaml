{{- if .Values.computeService.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-compute-service
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-service") | nindent 4 }}
rules:
  # AxisML CRDs Compute writes to (MLRun/MLService/MLTrafficPolicy, all
  # namespace-scoped).
  - apiGroups: ["axisml.io"]
    resources: ["mlruns", "mlservices", "mltrafficpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["axisml.io"]
    resources: ["mlruns/status", "mlservices/status", "mltrafficpolicies/status"]
    verbs: ["get", "list", "watch"]
  # Tenant remains owned by cluster-manager. Compute only reads it to map the
  # logical tenant key to Tenant.spec.namespace.name before writing workloads.
  - apiGroups: ["axisml.io"]
    resources: ["tenants"]
    verbs: ["get"]
  # ResourcePool (owned by cluster-manager): Compute reads it via an informer to
  # resolve pool/unit -> nodeSelector/tolerations/resources when materializing
  # Job/Service workloads.
  - apiGroups: ["axisml.io"]
    resources: ["resourcepools"]
    verbs: ["get", "list", "watch"]
  # Pods + logs + events: read-only, used by the kubeproxy log/pods/events endpoints.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # Queue admission reads allocatable capacity and scheduling constraints.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # The events kubeproxy endpoint reads the events.k8s.io/v1 Event type (not just
  # core/v1 events), so the informer needs list/watch on that group too.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # PersistentVolumeClaims: NOT granted. Workspace volume materialisation is
  # delegated to cluster-manager's Volume REST (compute only names and mounts
  # the volume; cluster-manager owns the PVC create/delete + this RBAC).
  # Leader election lease (controller-runtime).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Operational eventing.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "axisml.fullname" . }}-compute-service
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-service") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "axisml.fullname" . }}-compute-service
subjects:
  - kind: ServiceAccount
    name: {{ include "axisml.fullname" . }}-compute-service
    namespace: {{ .Release.Namespace }}
{{- end }}
