{{- if .Values.computeService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axisml.fullname" . }}-compute-service
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-service") | nindent 4 }}
data:
  config.yaml: |
    database:
      host: {{ include "axisml.databaseHost" . }}
      port: {{ include "axisml.databasePort" . }}
      name: {{ .Values.database.auth.database }}
      user: {{ .Values.database.auth.username }}
      sslmode: {{ .Values.database.sslMode | default "disable" }}
    log:
      level: {{ .Values.computeService.log.level | default "info" }}
      format: {{ .Values.computeService.log.format | default "json" }}
{{- end }}
