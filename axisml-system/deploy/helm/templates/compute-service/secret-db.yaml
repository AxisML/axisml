{{- if and .Values.computeService.enabled .Values.database.enabled }}
{{/*
The bitnami/postgresql sub-chart writes its admin password into a Secret named
"{{ .Values.database.fullnameOverride }}". Compute reads its own copy via a
small projection Secret to avoid hard-coding the bitnami secret key shape into
every Compute Pod template.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axisml.fullname" . }}-compute-service-db
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-service") | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.auth.password | quote }}
{{- end }}
