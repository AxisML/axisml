[project]
name = "axisml-tests"
version = "0.0.0"
description = "AxisML black-box test suite: API tests (per component) + UI e2e"
requires-python = ">=3.11"
dependencies = [
    # HTTP probes + generated OpenAPI clients (openapi-python-client default stack)
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.9",
    # bcrypt: env-setup resets the admin password in the platform DB to a known,
    # deterministic value (Go's bcrypt verifies Python's $2b$ hashes).
    "bcrypt>=4.1",
    # Test runner + Playwright UI driver
    "pytest>=8.2",
    "pytest-playwright>=0.5",
]

[project.scripts]
test-setup = "setup.cli:setup_main"
test-teardown = "setup.cli:teardown_main"

[dependency-groups]
# Tooling: client generation from the OpenAPI specs (uv run openapi-python-client)
dev = [
    "openapi-python-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the importable, hand-written + generated source packages ship in the wheel.
# Test dirs (apitests/, e2e/) are discovered by pytest, never installed.
packages = ["lib", "setup", "clients"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -ra"
pythonpath = ["."]
testpaths = ["api", "e2e"]
# Tests are SHARED by default: an unmarked test runs under whichever --mode is
# selected. Mark a test *_only ONLY when a whole layer/capability it needs is
# absent from the other form (platform layer, UI, a registry, ...). For a shared
# test with form-specific sub-behaviour, gate inline via harness.skip_unless(cap)
# instead of marking the whole test.
markers = [
    "standard_only: requires the Standard form (Kubernetes) — skipped under --mode lite",
    "lite_only: requires the Lite form (single-process axisml-core) — skipped under --mode standard",
    "cleanup: maintenance helpers (reap leftover e2e-* tenants), not part of a normal run",
    "slow: long-running scenarios (real scheduling / image pulls / kubelet startup)",
]
