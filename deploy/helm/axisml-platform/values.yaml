# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# Downstream system-layer services
# =============================================================================
# Platform is the only externally-reachable layer; it orchestrates the
# system-layer domain services over cluster-internal DNS. Those services live
# in their own namespace (default `axisml-system`, release `axisml`), so the
# URLs are fully-qualified `<service>.<namespace>` rather than bare names.
system:
  namespace: axisml-system
  clusterManager:
    name: axisml-cluster-manager
    port: 8080
  computeService:
    name: axisml-compute-service
    port: 8080
  artifactHub:
    name: axisml-artifact-hub
    port: 8080

# =============================================================================
# Shared PostgreSQL (Infra layer, cross-namespace). Platform reads the same DB
# the System services use; the password must match the Infra chart's value.
# =============================================================================
database:
  host: axisml-database.axisml-infra
  port: 5432
  name: axisml
  user: axisml
  sslMode: disable
  auth:
    password: axisml

# =============================================================================
# Shared Redis (Infra layer, cross-namespace). Optional accelerator for the
# auth hot path (session validity + identity/RBAC); the backend degrades to
# direct PostgreSQL reads when it cannot reach Redis. The password must match
# the Infra chart's `cache.auth.password`. Set `enabled: false` to run with no
# cache at all (REDIS_ADDR stays unset).
# =============================================================================
cache:
  enabled: true
  host: axisml-redis-master.axisml-infra
  port: 6379
  db: 0
  auth:
    password: axisml

# =============================================================================
# AxisML Platform
# =============================================================================
platform:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-platform-backend
    # Defaults to the chart's appVersion when empty (the top-level Makefile
    # injects the system appVersion via --set for tag parity).
    tag: ""
    pullPolicy: IfNotPresent

  # Dedicated probes port (separate from the API port).
  probesPort: 8082

  bootstrap:
    tenant: default
    tenantNamespace: axisml-tenant
    # Optionally source the initial system-admin password from a Secret.
    # passwordSecret: { name: axisml-platform-bootstrap, key: password }
    passwordSecret: {}

  service:
    type: ClusterIP
    port: 8080

  httpRoute:
    enabled: false
    gatewayName: axisml-gateway
    gatewayNamespace: axisml-infra
    sectionName: http
    host: axisml.local
    path: /

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}
