{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axisml.fullname" . }}-database
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.database.port }}
      targetPort: tcp
      protocol: TCP
      name: tcp
  selector:
    {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "database") | nindent 4 }}
{{- end }}
