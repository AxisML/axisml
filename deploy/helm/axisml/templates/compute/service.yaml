{{- if .Values.compute.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axisml.fullname" . }}-compute
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute") | nindent 4 }}
spec:
  type: {{ .Values.compute.service.type }}
  ports:
    - port: {{ .Values.compute.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "compute") | nindent 4 }}
{{- end }}
