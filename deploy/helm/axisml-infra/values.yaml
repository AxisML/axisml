# -- Global settings shared across sub-charts
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  # Bitnami sub-charts (redis) refuse to deploy the `bitnamilegacy/*` mirror
  # images we pin (see cache.image) unless image verification is waived.
  security:
    allowInsecureImages: true

# Naming convention: sub-charts are scoped by the `axisml-infra` namespace, so
# fullnameOverride drops the redundant `axisml-infra-` prefix. Cross-namespace
# callers reach a sub-chart via `<svc>.axisml-infra.svc.cluster.local` (e.g.
# `zot.axisml-infra:5000`, `rustfs-svc.axisml-infra:9000`).

# =============================================================================
# Envoy Gateway
# =============================================================================
# Sub-chart: oci://docker.io/envoyproxy/gateway-helm (aliased as envoy-gateway)
# gateway-helm hardcodes `metadata.name` on its Deployment templates instead of
# using its own fullname helper, so `fullnameOverride` is silently ignored — the
# rendered names stay as `envoy-gateway`.
envoy-gateway:
  enabled: true

# =============================================================================
# axisml-gateway (shared Gateway-API Gateway)
# =============================================================================
# A single Gateway in the axisml-infra namespace fronts every MLService
# HTTPRoute (templates/gateway.yaml). The mlservice-operator hard-codes
# ParentRef = axisml-infra/axisml-gateway, so disabling envoy-gateway also
# disables this Gateway and route-enabled MLServices will stay NotAccepted.
gateway:
  className: eg
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  httpPort: 80

# =============================================================================
# RustFS (object storage)
# =============================================================================
# Sub-chart: https://charts.rustfs.com/rustfs
# Cluster DNS: rustfs-svc.axisml-infra.svc.cluster.local:9000
rustfs:
  enabled: true
  fullnameOverride: rustfs
  # Single-node-friendly defaults. Flip to distributed for multi-node prod.
  replicaCount: 1
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  storageclass:
    name: standard
    dataStorageSize: 10Gi
    logStorageSize: 1Gi

# =============================================================================
# zot (OCI registry)
# =============================================================================
# Sub-chart: https://zotregistry.dev/helm-charts/zot
# OCI Distribution v2 endpoint for model / image artifacts. Cluster DNS:
#   zot.axisml-infra.svc.cluster.local:5000
# Defaults: standalone (1 replica), filesystem backend at /var/lib/registry,
# htpasswd auth with built-in `admin:admin` user (rotate via `secretFiles.htpasswd`
# or pre-create a Secret and disable mountSecret in production).
zot:
  enabled: true
  fullnameOverride: zot
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5000
  persistence: true
  pvc:
    create: true
    accessModes: ["ReadWriteOnce"]
    storage: 10Gi
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": { "rootDirectory": "/var/lib/registry", "dedupe": true, "gc": true },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "auth": { "htpasswd": { "path": "/secret/htpasswd" } },
          "accessControl": {
            "repositories": {
              "**": {
                "anonymousPolicy": ["read"],
                "defaultPolicy": ["read", "create", "update", "delete"]
              }
            },
            "adminPolicy": {
              "users": ["admin"],
              "actions": ["read", "create", "update", "delete"]
            }
          }
        },
        "log": { "level": "info" }
      }
  mountSecret: true

# =============================================================================
# NVIDIA GPU Operator
# =============================================================================
# Sub-chart: https://helm.ngc.nvidia.com/nvidia/gpu-operator
# gpu-operator hardcodes `metadata.name` on its Deployment templates, so
# `fullnameOverride` is silently ignored — the rendered name stays `gpu-operator`.
gpu-operator:
  enabled: true
  node-feature-discovery:
    fullnameOverride: nfd

# =============================================================================
# Koordinator (scheduler + ElasticQuota)
# =============================================================================
# Sub-chart: https://koordinator-sh.github.io/charts/koordinator
# Koordinator provides koord-scheduler + koord-manager. AxisML uses:
#   - PodGroup (scheduling.sigs.k8s.io/v1alpha1) for gang scheduling
#   - ElasticQuota (scheduling.sigs.k8s.io/v1alpha1) for multi-tenant quota,
#     keyed by Pod label `quota.scheduling.koordinator.sh/name`
# All AxisML workload Pods (jobs + services, including KServe-derived) must set
# `schedulerName: koord-scheduler` to be picked up by Koordinator and to consume
# their ElasticQuota.
#
# KServe version requirement: the (kserve, *) MLService path relies on KServe
# propagating `InferenceService.spec.predictor.schedulerName` and
# `spec.predictor.labels` to derived Pods. KServe v1beta1 inlines corev1.PodSpec
# and ComponentExtensionSpec into PredictorSpec, so both fields live directly
# under `spec.predictor`. Pin a KServe release that supports this propagation;
# the latest stable KServe is recommended.
koordinator:
  enabled: true
  # Force all Koordinator components (koord-manager, koord-scheduler,
  # koord-descheduler, koordlet, ConfigMaps) into the `axisml-infra` namespace
  # alongside the rest of the infra sub-charts. The chart defaults to its own
  # `koordinator-system` namespace, which would split AxisML infra across two
  # namespaces.
  installation:
    namespace: axisml-infra
  # Single-replica overrides (chart defaults to 2 each for leader-election HA).
  # AxisML targets single-node / dev clusters where HA standbys add no value.
  manager:
    replicas: 1
  scheduler:
    replicas: 1
  descheduler:
    replicas: 1

# =============================================================================
# kube-prometheus-stack (monitoring)
# =============================================================================
# Sub-chart: https://prometheus-community.github.io/helm-charts/kube-prometheus-stack
kube-prometheus-stack:
  enabled: true
  # The chart's fullname helper truncates at 26 chars (templates append suffixes
  # up to 37 chars long), so keep the override ≤ 26 chars. The Prometheus Operator
  # prefixes its StatefulSet names with `prometheus-` / `alertmanager-`, so the
  # Prometheus pod still ends up as `prometheus-prometheus-0` — that stutter is
  # upstream behavior we accept.
  fullnameOverride: prometheus
  # Drop the redundant "-alertmanager"/"-prometheus" suffixes the chart adds
  # to CR names.
  cleanPrometheusOperatorObjectNames: true
  grafana:
    fullnameOverride: grafana
  kube-state-metrics:
    fullnameOverride: kube-state-metrics
  prometheus-node-exporter:
    fullnameOverride: node-exporter

# =============================================================================
# Metadata Database (PostgreSQL)
# =============================================================================
# Sub-chart: oci://registry-1.docker.io/bitnamicharts/postgresql (aliased as database)
# All values under this key are passed through to the bitnami/postgresql sub-chart.
# The system-layer services (compute-service, artifact-hub) reach this instance
# cross-namespace at `axisml-database.axisml-infra.svc.cluster.local:5432`; the
# `auth.password` set here MUST match `database.auth.password` in the axisml-system
# chart, which renders its own connection Secret from that shared value. Disable
# this and point the system chart's `externalDatabase` block at a managed instance
# to use an external database.
database:
  enabled: true
  fullnameOverride: axisml-database
  # Bitnami removed their free `bitnami/*` images from Docker Hub in 2025;
  # pin the sub-chart image to the `bitnamilegacy` mirror instead.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r1
  auth:
    database: axisml
    username: axisml
    password: axisml
    # existingSecret: ""
  primary:
    persistence:
      size: 10Gi
      # storageClass: ""

# =============================================================================
# Cache (Redis)
# =============================================================================
# Sub-chart: oci://registry-1.docker.io/bitnamicharts/redis (aliased as cache)
# All values under this key are passed through to the bitnami/redis sub-chart.
# The platform-backend reaches this instance cross-namespace at
# `axisml-redis-master.axisml-infra.svc.cluster.local:6379`; the `auth.password`
# set here MUST match `cache.auth.password` in the axisml-platform chart, which
# renders its own connection Secret from that shared value. Redis is an optional
# accelerator — the platform-backend degrades to direct PostgreSQL reads when it
# cannot reach Redis — so disabling this only removes the auth-path cache.
#
# Standalone (single master, no sentinel/replica): the cache holds only
# regenerable session/identity entries, so HA replication is unnecessary.
cache:
  enabled: true
  fullnameOverride: axisml-redis
  architecture: standalone
  # Bitnami removed their free `bitnami/*` images from Docker Hub in 2025;
  # pin the sub-chart image to the `bitnamilegacy` mirror instead.
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.3-debian-12-r0
  auth:
    enabled: true
    password: axisml
    # existingSecret: ""
  master:
    persistence:
      size: 2Gi
      # storageClass: ""
