apiVersion: v2
name: axisml-infra
description: AxisML infrastructure - gateway, object storage, GPU operator, batch scheduler, monitoring
type: application
version: 0.1.0
appVersion: "0.1.0"

keywords:
  - machine-learning
  - kubernetes
  - infrastructure

maintainers:
  - name: AxisML Team

# Note: gateway-helm and gpu-operator hardcode `metadata.name` on their Deployment
# templates instead of using their own fullname helpers, so `fullnameOverride` is
# silently ignored upstream. Their resource names stay as `envoy-gateway` and
# `gpu-operator` without the `axisml-infra-` prefix — fixing this would require
# patching or forking, which we deliberately avoid. Revisit if/when those charts
# honor fullnameOverride.
dependencies:
  - name: gateway-helm
    alias: envoy-gateway
    version: "1.3.0"
    repository: "oci://docker.io/envoyproxy"
    condition: envoy-gateway.enabled

  - name: rustfs
    version: "0.0.96"
    repository: "https://charts.rustfs.com"
    condition: rustfs.enabled

  - name: gpu-operator
    version: "v24.9.0"
    repository: "https://helm.ngc.nvidia.com/nvidia"
    condition: gpu-operator.enabled

  - name: volcano
    version: "1.10.0"
    repository: "https://volcano-sh.github.io/helm-charts"
    condition: volcano.enabled

  - name: kube-prometheus-stack
    version: "65.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled
