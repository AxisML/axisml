{{- if and .Values.computeOperator.enabled .Values.computeOperator.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "axisml.fullname" . }}-compute-operator-leaderelection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-operator") | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
