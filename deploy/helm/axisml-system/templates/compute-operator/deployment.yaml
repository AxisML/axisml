{{- if .Values.computeOperator.enabled }}
{{- $op := .Values.computeOperator }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axisml.fullname" . }}-compute-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-operator") | nindent 4 }}
spec:
  replicas: {{ $op.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "compute-operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axisml.componentLabels" (dict "context" . "component" "compute-operator") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "axisml.fullname" . }}-compute-operator
      containers:
        - name: compute-operator
          image: {{ include "axisml.image" (dict "imageRoot" $op.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ $op.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8081
            - --health-probe-bind-address=:8082
            {{- if $op.leaderElection.enabled }}
            - --leader-elect=true
            - --leader-election-id={{ $op.leaderElection.id }}
            {{- else }}
            - --leader-elect=false
            {{- end }}
            {{- if not $op.controllers.mljob.enabled }}
            - --enable-mljob=false
            {{- end }}
            {{- if not $op.controllers.mlservice.enabled }}
            - --enable-mlservice=false
            {{- end }}
            {{- if not $op.controllers.mltrafficpolicy.enabled }}
            - --enable-mltrafficpolicy=false
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: probe
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $op.resources | nindent 12 }}
{{- end }}
