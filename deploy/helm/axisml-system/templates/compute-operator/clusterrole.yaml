{{- if .Values.computeOperator.enabled }}
{{- $op := .Values.computeOperator }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-compute-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute-operator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  {{- if $op.controllers.mljob.enabled }}
  # ==========================================================================
  # MLJob controller
  # ==========================================================================
  - apiGroups: ["axisml.io"]
    resources: ["mljobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["axisml.io"]
    resources: ["mljobs/status"]
    verbs: ["get", "patch", "update"]
  # (native, job) handler — Job CRUD; Pods are owned by the Job and
  # are reached via the union pods rule below.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # (native, podgroup) handler — PodGroup CR.
  - apiGroups: ["scheduling.sigs.k8s.io"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}

  {{- if $op.controllers.mlservice.enabled }}
  # ==========================================================================
  # MLService controller
  # ==========================================================================
  - apiGroups: ["axisml.io"]
    resources: ["mlservices", "mlservices/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}

  {{- /*
    Pods: union across MLJob (native-podgroup renders bare Pods) and
    MLService (native-deployment indirectly creates Pods via Deployment).
  */ -}}
  {{- if or $op.controllers.mljob.enabled $op.controllers.mlservice.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
{{- end }}
