{{- if and .Values.operators.enabled .Values.operators.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "axisml.fullname" . }}-operator-leaderelection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 4 }}
rules:
  # Leader election lease — namespaced; lives only in the operator's
  # deployment namespace, granted via Role + RoleBinding rather than
  # a ClusterRole.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
