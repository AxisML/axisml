{{- if and .Values.operators.enabled .Values.operators.tenantOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axisml.fullname" . }}-tenant-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "tenant-operator") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "tenant-operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axisml.componentLabels" (dict "context" . "component" "tenant-operator") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "axisml.fullname" . }}-tenant-operator
      containers:
        - name: tenant-operator
          image: {{ include "axisml.image" (dict "imageRoot" .Values.operators.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.operators.image.pullPolicy }}
          args:
            - tenant-operator
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if .Values.operators.tenantOperator.leaderElection }}
            - --leader-elect=true
            {{- end }}
          env:
            - name: RESYNC_PERIOD
              value: {{ .Values.operators.tenantOperator.resyncPeriod | quote }}
            - name: NAMESPACE_DENYLIST
              value: {{ join "," .Values.operators.tenantOperator.namespaceDenylist | quote }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probe
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operators.tenantOperator.resources | nindent 12 }}
{{- end }}
