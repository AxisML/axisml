{{- if and .Values.operators.enabled .Values.operators.tenantOperator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-tenant-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "tenant-operator") | nindent 4 }}
rules:
  - apiGroups: ["axisml.io"]
    resources: ["tenants", "tenants/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- end }}
