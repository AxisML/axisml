{{- if and .Values.operators.enabled .Values.operators.mljobOperator.enabled }}
{{- $op := .Values.operators.mljobOperator }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axisml.fullname" . }}-mljob-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "mljob-operator") | nindent 4 }}
rules:
  # MLJob CR + status subresource (always required)
  - apiGroups: ["axisml.io"]
    resources: ["mljobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["axisml.io"]
    resources: ["mljobs/status"]
    verbs: ["get", "patch", "update"]
  # Events for kubectl describe (always required)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if $op.handlers.nativeJob.enabled }}
  # (native, job) handler — Job CRUD; Pods are owned by the Job and
  # are reached via the union pods rule below.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if $op.handlers.nativePodGroup.enabled }}
  # (native, podgroup) handler — PodGroup CR.
  - apiGroups: ["scheduling.sigs.k8s.io"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if or $op.handlers.nativeJob.enabled $op.handlers.nativePodGroup.enabled }}
  # Pods: union of verbs needed by enabled handlers.
  # nativeJob:      get/list/watch/delete (Pods are reconciled by Job).
  # nativePodGroup: + create/update/patch (handler renders bare Pods).
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - get
      - list
      - watch
      - delete
      {{- if $op.handlers.nativePodGroup.enabled }}
      - create
      - update
      - patch
      {{- end }}
  {{- end }}
{{- end }}
