{{- if .Values.artifacts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axisml.fullname" . }}-artifacts
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "artifacts") | nindent 4 }}
data:
  DATABASE_HOST: {{ include "axisml.databaseHost" . | quote }}
  DATABASE_PORT: {{ include "axisml.databasePort" . | quote }}
  DATABASE_NAME: {{ .Values.database.auth.database | quote }}
  DATABASE_USER: {{ .Values.database.auth.username | quote }}
  API_BIND_ADDRESS: {{ printf ":%d" (int .Values.artifacts.service.port) | quote }}
  PROBES_BIND_ADDRESS: {{ printf ":%d" (int .Values.artifacts.probesPort) | quote }}
  METRICS_BIND_ADDRESS: {{ printf ":%d" (int .Values.artifacts.metricsPort) | quote }}
  LEADER_ELECT: {{ .Values.artifacts.leaderElection.enabled | quote }}
  LEADER_ELECTION_ID: {{ .Values.artifacts.leaderElection.id | quote }}
  LEADER_NAMESPACE: {{ .Release.Namespace | quote }}
  GC_INTERVAL: {{ .Values.artifacts.gcInterval | quote }}
  UPLOADING_TTL: {{ .Values.artifacts.uploadingTTL | quote }}
  UPLOAD_TOKEN_TTL: {{ .Values.artifacts.uploadTokenTTL | quote }}
  OCI_ENDPOINT: {{ .Values.artifacts.storage.oci.endpoint | quote }}
  OCI_SCHEME: {{ .Values.artifacts.storage.oci.scheme | quote }}
  OCI_SCOPE_PREFIX: {{ .Values.artifacts.storage.oci.scopePrefix | quote }}
  LOG_DEVELOPMENT: {{ .Values.artifacts.logDevelopment | quote }}
  {{- range $key, $value := .Values.artifacts.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
