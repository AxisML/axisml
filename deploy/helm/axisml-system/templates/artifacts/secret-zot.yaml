{{- if and .Values.artifacts.enabled (not .Values.artifacts.storage.oci.adminSecretRef.name) }}
{{/*
zot admin credentials. Only rendered when adminSecretRef.name is empty so
the chart provides a default; otherwise the Deployment references an
externally-managed Secret with the same key shape.

Password has no default — `required` fails the install with a clear error
if the operator forgets to supply one. To skip this (demo without zot),
either set artifacts.enabled=false or point adminSecretRef.name at an
externally-managed Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axisml.fullname" . }}-artifacts-zot
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "artifacts") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.artifacts.storage.oci.adminSecretRef.username | default "admin" | quote }}
  password: {{ required "artifacts.storage.oci.adminSecretRef.password is required (or set adminSecretRef.name to point at an externally-managed Secret)" .Values.artifacts.storage.oci.adminSecretRef.password | quote }}
{{- end }}
