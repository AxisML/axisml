{{- if and .Values.artifacts.enabled (not .Values.artifacts.storage.oci.adminSecretRef.name) }}
{{/*
zot admin credentials. Only rendered when adminSecretRef.name is empty so
the chart provides a default; otherwise the Deployment references an
externally-managed Secret with the same key shape.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axisml.fullname" . }}-artifacts-zot
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "artifacts") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.artifacts.storage.oci.adminSecretRef.username | default "admin" | quote }}
  password: {{ .Values.artifacts.storage.oci.adminSecretRef.password | quote }}
{{- end }}
