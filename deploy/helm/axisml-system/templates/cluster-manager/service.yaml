{{- if .Values.clusterManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axisml.fullname" . }}-cluster-manager
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "cluster-manager") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.clusterManager.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.clusterManager.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "cluster-manager") | nindent 4 }}
{{- end }}
