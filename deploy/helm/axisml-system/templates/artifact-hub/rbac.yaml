{{- if .Values.artifactHub.enabled }}
{{/*
Artifacts watches no CRDs but needs to manage its leader-election Lease in
the release namespace. The role is intentionally minimal.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "axisml.fullname" . }}-artifact-hub-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "artifact-hub") | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "axisml.fullname" . }}-artifact-hub-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "artifact-hub") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "axisml.fullname" . }}-artifact-hub-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "axisml.fullname" . }}-artifact-hub
    namespace: {{ .Release.Namespace }}
{{- end }}
