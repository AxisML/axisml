{{- if .Values.compute.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axisml.fullname" . }}-compute
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "compute") | nindent 4 }}
spec:
  replicas: {{ .Values.compute.replicaCount }}
  selector:
    matchLabels:
      {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "compute") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axisml.componentLabels" (dict "context" . "component" "compute") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "axisml.fullname" . }}-compute
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: compute
          image: {{ include "axisml.image" (dict "imageRoot" .Values.compute.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.compute.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.compute.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.compute.metricsPort }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.compute.probesPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "axisml.fullname" . }}-compute
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axisml.fullname" . }}-compute-db
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.compute.resources | nindent 12 }}
{{- end }}
