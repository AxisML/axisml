{{- if .Values.seed.tenant.enabled }}
{{- if not .Values.seed.resourcePool.enabled }}
{{- fail "seed.tenant.enabled=true requires seed.resourcePool.enabled=true (the seed Tenant references the seed pool in spec.quotas[0].pool)" }}
{{- end }}
# Seed Tenant: the platform-built-in tenant referenced by docs/system_design/
# overview.md §9 ("全局可见制品"). Carries the namespace `axisml-system` and
# is the home for `visibility=public` artifacts. Installed via Helm hooks so
# it's picked up only on first install.
apiVersion: axisml.io/v1alpha1
kind: Tenant
metadata:
  name: {{ .Values.seed.tenant.name | quote }}
  annotations:
    axisml.io/description: "Built-in platform tenant for public artifacts"
    helm.sh/hook: post-install
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "seed") | nindent 4 }}
    axisml.io/tenant-id: {{ .Values.seed.tenant.id | quote }}
spec:
  namespace:
    name: {{ .Values.seed.tenant.namespace | quote }}
  quotas:
    - pool: {{ .Values.seed.resourcePool.name | quote }}
      name: default
      min:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "8"
        memory: 16Gi
{{- end }}
