{{- if and .Values.platform.enabled .Values.platform.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "axisml.fullname" . }}-platform
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "platform") | nindent 4 }}
  {{- with .Values.platform.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.platform.ingress.className }}
  ingressClassName: {{ .Values.platform.ingress.className }}
  {{- end }}
  {{- if .Values.platform.ingress.tls }}
  tls:
    {{- toYaml .Values.platform.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.platform.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "axisml.fullname" . }}-platform
                port:
                  name: http
{{- end }}
