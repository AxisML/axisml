{{- /*
  Pre-upgrade Helm hook: clean up the three legacy leader-election Leases
  left behind by the split tenant-operator / mljob-operator / mlservice-operator
  Deployments. The merged axisml-operator uses a single Lease
  (operator.leaderElection.id, default `axisml-operator.axisml.io`); the old
  Leases are inert but linger in the release namespace forever otherwise.

  Idempotent: `delete --ignore-not-found` is a no-op once the Leases are gone,
  so the hook stays safe across repeated upgrades and clean installs alike.
*/ -}}
{{- if and .Values.operator.enabled .Values.operator.leaderElection.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axisml.fullname" . }}-operator-migrate-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "axisml.fullname" . }}-operator-migrate-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "axisml.fullname" . }}-operator-migrate-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "axisml.fullname" . }}-operator-migrate-leases
subjects:
  - kind: ServiceAccount
    name: {{ include "axisml.fullname" . }}-operator-migrate-leases
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "axisml.fullname" . }}-operator-migrate-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "axisml.fullname" . }}-operator-migrate-leases
      containers:
        - name: kubectl
          image: bitnamilegacy/kubectl:1.31
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for lease in tenant-operator.axisml.io mljob-operator.axisml.io mlservice-operator.axisml.io; do
                kubectl -n {{ .Release.Namespace }} delete lease "$lease" --ignore-not-found
              done
{{- end }}
