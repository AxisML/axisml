{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "axisml.fullname" . }}-operator
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "axisml.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "axisml.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
