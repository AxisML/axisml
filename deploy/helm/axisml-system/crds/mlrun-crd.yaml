apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mlruns.axisml.io
spec:
  group: axisml.io
  names:
    kind: MLRun
    listKind: MLRunList
    plural: mlruns
    singular: mlrun
    shortNames:
      - mlr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Backend
          type: string
          jsonPath: .spec.backend.name
        - name: Engine
          type: string
          jsonPath: .spec.backend.engine
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
