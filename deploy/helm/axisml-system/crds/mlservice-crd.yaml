apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mlservices.axisml.io
spec:
  group: axisml.io
  names:
    kind: MLService
    listKind: MLServiceList
    plural: mlservices
    singular: mlservice
    shortNames:
      - mls
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        # NOTE: a /scale subresource is intentionally omitted. Kubernetes
        # validates `specReplicasPath` as a JSONPath under .spec without array
        # notation, so `.spec.roles[*].replicas` is rejected at install time.
        # Reintroduce when the spec exposes a top-level replicas mirror.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
