apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.axisml.io
spec:
  group: axisml.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
    shortNames:
      - tnt
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                namespace:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    name:
                      type: string
                      # spec.namespace.name is immutable: changing it would orphan
                      # init resources and RBAC owned in the original namespace
                      # since the GC helpers only see the current target.
                      x-kubernetes-validations:
                        - rule: "self == oldSelf"
                          message: "spec.namespace.name is immutable"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
