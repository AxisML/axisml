# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# AxisML Platform
# =============================================================================
platform:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: nginx
    host: axisml.local
    tls: []
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Compute
# =============================================================================
compute:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    repository: axisml/compute
    tag: ""               # defaults to .Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8081           # HTTP API

  metricsPort: 8080      # Prometheus /metrics
  probesPort: 8082       # /healthz + /readyz

  leaderElection:
    enabled: true        # Reconciler/Informer behind controller-runtime lease

  reconcileInterval: 2s
  logDevelopment: false

  serviceMonitor:
    enabled: false       # opt-in once kube-prometheus-stack is deployed
    labels: {}
    interval: 30s

  bootstrap:
    enabled: true
    defaultTenant: default
    # K8s 内置 `default` namespace 在 tenant-operator denylist 里，default
    # 租户落到独立的 `axisml-default` namespace，与 `axisml-system` /
    # `axisml-infra` 命名风格一致。
    defaultTenantNamespace: axisml-default
    defaultPool: default
    defaultQuotaMax:
      cpu: "8"
      memory: 16Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Artifacts
# =============================================================================
artifacts:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8082

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Operators
# =============================================================================
operators:
  # -- Master toggle for all operators
  enabled: true

  mljobOperator:
    enabled: true
    image:
      registry: ""
      repository: axisml/mljob-operator
      tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
      pullPolicy: IfNotPresent
    leaderElection:
      enabled: true
    handlers:
      nativeJob:
        enabled: true
      nativePodGroup:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  mlserviceOperator:
    enabled: true
    image:
      registry: ""
      repository: axisml/mlservice-operator
      tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  tenantOperator:
    enabled: true
    image:
      registry: ""
      repository: axisml/tenant-operator
      # tag defaults to .Chart.AppVersion via the axisml.image helper.
      tag: ""
      pullPolicy: IfNotPresent
    # Periodic re-reconcile interval for source Secret/ConfigMap drift
    # (design §5). Operators run a single replica; leader election is off
    # by default and only useful when scaling to >1 replicas.
    resyncPeriod: 10m
    leaderElection: false
    # Target namespaces a Tenant CR may NOT point spec.namespace.name at
    # (design §6.1 risk note + §10).
    namespaceDenylist:
      - kube-system
      - kube-public
      - kube-node-lease
      - default
      - axisml-system
      - axisml-infra
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# =============================================================================
# Metadata Database (PostgreSQL)
# =============================================================================
# Sub-chart: oci://registry-1.docker.io/bitnamicharts/postgresql (aliased as database)
# All values under this key are passed through to the bitnami/postgresql sub-chart.
# Disable this and configure `externalDatabase` below to use an external instance.
database:
  enabled: true
  fullnameOverride: axisml-database
  # Bitnami removed their free `bitnami/*` images from Docker Hub in 2025;
  # pin the sub-chart image to the `bitnamilegacy` mirror instead.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r1
  auth:
    database: axisml
    username: axisml
    password: axisml
    # existingSecret: ""
  primary:
    persistence:
      size: 10Gi
      # storageClass: ""

# -- External database (used when database.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: axisml
  username: axisml
  existingSecret: ""
