# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# AxisML Platform
# =============================================================================
platform:
  enabled: true
  replicaCount: 1

  image:
    # Platform service is not yet implemented; use nginx as a placeholder.
    registry: docker.io
    repository: library/nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: nginx
    host: axisml.local
    tls: []
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Compute
# =============================================================================
compute:
  enabled: true
  replicaCount: 1

  image:
    # Published by .github/workflows/ci.yml on every push to main.
    registry: ghcr.io
    repository: axisml/axisml-compute
    tag: ""               # defaults to .Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8081           # HTTP API

  metricsPort: 8080      # Prometheus /metrics
  probesPort: 8082       # /healthz + /readyz

  leaderElection:
    enabled: true        # Reconciler/Informer behind controller-runtime lease

  reconcileInterval: 2s
  logDevelopment: false

  serviceMonitor:
    enabled: false       # opt-in once kube-prometheus-stack is deployed
    labels: {}
    interval: 30s

  bootstrap:
    enabled: true
    defaultTenant: default
    # K8s 内置 `default` namespace 在 tenant-operator denylist 里，default
    # 租户落到独立的 `axisml-default` namespace，与 `axisml-system` /
    # `axisml-infra` 命名风格一致。
    defaultTenantNamespace: axisml-default
    defaultPool: default
    defaultQuotaMax:
      cpu: "8"
      memory: 16Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Artifacts
# =============================================================================
artifacts:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-artifacts
    tag: ""              # Empty → defaults to .Chart.AppVersion via axisml.image
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8082           # HTTP API (per docs/system_design/artifacts.md §2.2)

  metricsPort: 8080
  probesPort: 8083       # Distinct from compute's 8082 to avoid collision in any
                         # shared local dev port-forward layouts.

  leaderElection:
    enabled: true
    id: axisml-artifacts.axisml.io

  gcInterval: 5m
  uploadingTTL: 24h
  uploadTokenTTL: 1h     # MVP: passthrough hint only — credentials are admin
                         # htpasswd, not scope-limited (see component README).
  logDevelopment: false

  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

  storage:
    oci:
      endpoint: http://axisml-infra-zot.axisml-infra:5000
      scheme: http       # http | https
      adminSecretRef:
        # Empty name → chart renders default secret <release>-artifacts-zot.
        # Override with an externally-managed Secret name to avoid storing
        # zot admin creds in values.yaml.
        name: ""
        usernameKey: username
        passwordKey: password
        # Inline creds — only used when adminSecretRef.name is empty so the
        # chart can render a default Secret. Override at install time.
        username: admin
        password: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Operator
# =============================================================================
# =============================================================================
# Tenant Operator
# =============================================================================
# Reconciles the Tenant CR — provisions Namespace, Koordinator ElasticQuota,
# per-tenant Secret/ConfigMap/SA/RBAC. Single reconciler, no dispatcher.
tenantOperator:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-tenant-operator
    tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  leaderElection:
    enabled: true
    id: axisml-tenant-operator.axisml.io

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Periodic re-reconcile interval for source Secret/ConfigMap drift.
  resyncPeriod: 10m
  # Target namespaces a Tenant CR may NOT point spec.namespace.name at.
  namespaceDenylist:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
    - axisml-system
    - axisml-infra

# =============================================================================
# Compute Operator
# =============================================================================
# Reconciles MLJob and MLService CRs. Dispatcher + handler model; routes by
# spec.backend.{name,engine}.
computeOperator:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-compute-operator
    tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  leaderElection:
    enabled: true
    id: axisml-compute-operator.axisml.io

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Per-CRD controller toggles. Each maps to a `--enable-*` flag on the binary.
  controllers:
    mljob:
      enabled: true
    mlservice:
      enabled: true

# =============================================================================
# Metadata Database (PostgreSQL)
# =============================================================================
# Sub-chart: oci://registry-1.docker.io/bitnamicharts/postgresql (aliased as database)
# All values under this key are passed through to the bitnami/postgresql sub-chart.
# Disable this and configure `externalDatabase` below to use an external instance.
database:
  enabled: true
  fullnameOverride: axisml-database
  # Bitnami removed their free `bitnami/*` images from Docker Hub in 2025;
  # pin the sub-chart image to the `bitnamilegacy` mirror instead.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r1
  auth:
    database: axisml
    username: axisml
    password: axisml
    # existingSecret: ""
  primary:
    persistence:
      size: 10Gi
      # storageClass: ""

# -- External database (used when database.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: axisml
  username: axisml
  existingSecret: ""
