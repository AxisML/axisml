# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# AxisML Platform
# =============================================================================
platform:
  enabled: true
  replicaCount: 1

  image:
    # Platform service is not yet implemented; use nginx as a placeholder.
    registry: docker.io
    repository: library/nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: nginx
    host: axisml.local
    tls: []
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Compute
# =============================================================================
compute:
  enabled: true
  replicaCount: 1

  image:
    # Published by .github/workflows/ci.yml on every push to main.
    registry: ghcr.io
    repository: axisml/axisml-compute
    tag: ""               # defaults to .Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8081           # HTTP API

  metricsPort: 8080      # Prometheus /metrics
  probesPort: 8082       # /healthz + /readyz

  leaderElection:
    enabled: true        # Reconciler/Informer behind controller-runtime lease

  reconcileInterval: 2s
  logDevelopment: false

  serviceMonitor:
    enabled: false       # opt-in once kube-prometheus-stack is deployed
    labels: {}
    interval: 30s

  bootstrap:
    enabled: true
    defaultTenant: default
    # K8s 内置 `default` namespace 在 tenant-operator denylist 里，default
    # 租户落到独立的 `axisml-default` namespace，与 `axisml-system` /
    # `axisml-infra` 命名风格一致。
    defaultTenantNamespace: axisml-default
    defaultPool: default
    defaultQuotaMax:
      cpu: "8"
      memory: 16Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Artifacts
# =============================================================================
artifacts:
  enabled: true
  replicaCount: 1

  image:
    # Artifacts service is not yet implemented; use nginx as a placeholder.
    registry: docker.io
    repository: library/nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8082

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Operator
# =============================================================================
operator:
  # -- Master toggle for the merged axisml-operator.
  enabled: true

  # -- Replica count for the operator Deployment. Leader election (below)
  # ensures only one replica reconciles at a time, so N>1 is purely an HA
  # / faster-failover knob.
  replicaCount: 1

  # -- Image for the merged axisml-operator binary.
  image:
    registry: ghcr.io
    repository: axisml/axisml-operator
    tag: ""               # defaults to Chart.AppVersion via the axisml.image helper
    pullPolicy: IfNotPresent

  # -- Leader election for the single Deployment. The Lease lives in the
  # release namespace and is shared across all enabled controllers.
  leaderElection:
    enabled: true
    id: axisml-operator.axisml.io

  # -- Resource requests/limits sized for the union of the three controllers.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Per-CRD controller toggles. Each maps to a `--enable-*` flag on the
  # binary. Disabling all three reduces the operator to a no-op manager.
  controllers:
    tenant:
      enabled: true
      # Periodic re-reconcile interval for source Secret/ConfigMap drift.
      resyncPeriod: 10m
      # Target namespaces a Tenant CR may NOT point spec.namespace.name at.
      namespaceDenylist:
        - kube-system
        - kube-public
        - kube-node-lease
        - default
        - axisml-system
        - axisml-infra

    mljob:
      enabled: true
      handlers:
        nativeJob:
          enabled: true
        nativePodGroup:
          enabled: true

    mlservice:
      enabled: true

# =============================================================================
# Metadata Database (PostgreSQL)
# =============================================================================
# Sub-chart: oci://registry-1.docker.io/bitnamicharts/postgresql (aliased as database)
# All values under this key are passed through to the bitnami/postgresql sub-chart.
# Disable this and configure `externalDatabase` below to use an external instance.
database:
  enabled: true
  fullnameOverride: axisml-database
  # Bitnami removed their free `bitnami/*` images from Docker Hub in 2025;
  # pin the sub-chart image to the `bitnamilegacy` mirror instead.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r1
  auth:
    database: axisml
    username: axisml
    password: axisml
    # existingSecret: ""
  primary:
    persistence:
      size: 10Gi
      # storageClass: ""

# -- External database (used when database.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: axisml
  username: axisml
  existingSecret: ""
