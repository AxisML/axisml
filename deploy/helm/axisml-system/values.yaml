# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# AxisML Platform
# =============================================================================
platform:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: nginx
    host: axisml.local
    tls: []
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Compute
# =============================================================================
compute:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8081

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Artifacts
# =============================================================================
artifacts:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8082

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}

# =============================================================================
# AxisML Operators
# =============================================================================
operators:
  # -- Master toggle for all operators
  enabled: true

  mljobOperator:
    enabled: true
    image:
      registry: ""
      repository: nginx
      tag: "1.27"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  mlserviceOperator:
    enabled: true
    image:
      registry: ""
      repository: nginx
      tag: "1.27"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  tenantOperator:
    enabled: true
    image:
      registry: ""
      repository: nginx
      tag: "1.27"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# =============================================================================
# Metadata Database (PostgreSQL)
# =============================================================================
# Sub-chart: oci://registry-1.docker.io/bitnamicharts/postgresql (aliased as database)
# All values under this key are passed through to the bitnami/postgresql sub-chart.
# Disable this and configure `externalDatabase` below to use an external instance.
database:
  enabled: true
  fullnameOverride: axisml-database
  # Bitnami removed their free `bitnami/*` images from Docker Hub in 2025;
  # pin the sub-chart image to the `bitnamilegacy` mirror instead.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r1
  auth:
    database: axisml
    username: axisml
    password: axisml
    # existingSecret: ""
  primary:
    persistence:
      size: 10Gi
      # storageClass: ""

# -- External database (used when database.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: axisml
  username: axisml
  existingSecret: ""
