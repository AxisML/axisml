name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new commit lands.
# `main` pushes are excluded (each commit on main should produce a green run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs are organised by *type*, not by component. Each Go-related job sets up
# its toolchain once and then fans out across every Go module / component
# internally, which removes the per-shard checkout / setup-go / tool-install
# overhead that dominated the previous component matrix.
#
#   lint         — golangci-lint over every Go module
#   test         — unit tests + coverage across every component
#   integration  — L1 envtest / testcontainers across every component
#   helm-lint    — Helm chart validation
#   image        — per-component image build (genuinely parallel work, kept as a matrix; main-only)

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cached
      - name: Cache golangci-lint binary
        # `go install` would otherwise recompile the binary on every run.
        # Measured ~75s on this repo (Go module cache hit but compile still
        # runs), so caching the resulting binary saves a meaningful chunk of
        # the lint job. Key includes runner OS, Go major, and the pinned lint
        # version so a version bump triggers a fresh build.
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-bin-${{ runner.os }}-go1.26-v2.12.1
      - name: Install golangci-lint
        # `go install` is reliable across versions; the upstream install.sh
        # from `master` has had checksum-table regressions for tagged releases.
        # Becomes a no-op on cache hit.
        run: |
          if [ ! -x "$(go env GOPATH)/bin/golangci-lint" ]; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache golangci-lint analysis
        # Not a download cache, but the dominant cost on this repo: lint
        # walks 12 Go modules sequentially, and without per-file analysis
        # results the full job is ~12 min. With this cache restored
        # incremental runs are several times faster.
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ hashFiles('.golangci.yml', '**/go.sum') }}
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-
      - name: Run golangci-lint across every Go module
        # Walks every module containing a go.mod (matches Makefile's GO_MODULES),
        # so newly added modules are picked up without touching CI. We don't
        # short-circuit on the first failure — collect a non-zero status and
        # report at the end so all modules get a chance to surface issues.
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r module; do
            echo "::group::lint $module"
            if ! (cd "$module" && golangci-lint run --build-tags=integration); then
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path '*/bin/*' -exec dirname {} \; | sort)
          exit $status

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cached
      - name: Run unit tests with coverage across all components
        run: make coverage-unit
      # Per-component uploads keep Codecov's flag dimension intact so coverage
      # trends stay legible. Each step is independent (`fail_ci_if_error: false`
      # mirrors the previous behaviour).
      - name: Upload tenant-operator coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/tenant-operator/coverage/coverage.out
          flags: test,tenant-operator
          fail_ci_if_error: false
      - name: Upload compute-operator coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/compute-operator/coverage/coverage.out
          flags: test,compute-operator
          fail_ci_if_error: false
      - name: Upload cluster-manager coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/cluster-manager/coverage/coverage.out
          flags: test,cluster-manager
          fail_ci_if_error: false
      - name: Upload compute coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/compute/coverage/coverage.out
          flags: test,compute
          fail_ci_if_error: false
      - name: Upload artifacts coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/artifacts/coverage/coverage.out
          flags: test,artifacts
          fail_ci_if_error: false

  integration:
    name: integration
    # L1 integration is heavy (envtest + testcontainers); only run on main
    # pushes and manual dispatches. PRs rely on lint + unit tests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cached
      - name: Cache shared setup-envtest binary + kubebuilder assets
        uses: actions/cache@v4
        with:
          path: |
            test/setup-envtest
            ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-k8s-1.31.0
      - name: Install setup-envtest binary if missing
        run: make setup-envtest
      - name: Run L1 integration tests with coverage across all components
        run: make coverage-integration
      - name: Upload tenant-operator integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/tenant-operator/coverage/integration-coverage.out
          flags: integration,tenant-operator
          fail_ci_if_error: false
      - name: Upload compute-operator integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/compute-operator/coverage/integration-coverage.out
          flags: integration,compute-operator
          fail_ci_if_error: false
      - name: Upload cluster-manager integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/cluster-manager/coverage/integration-coverage.out
          flags: integration,cluster-manager
          fail_ci_if_error: false
      - name: Upload compute integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/compute/coverage/integration-coverage.out
          flags: integration,compute
          fail_ci_if_error: false
      - name: Upload artifacts integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./components/artifacts/coverage/integration-coverage.out
          flags: integration,artifacts
          fail_ci_if_error: false

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint Helm charts
        # No `helm dependency update` — fetching every subchart from upstream
        # registries on every PR is slow and flaky. `helm lint` warns about
        # missing dependencies but still validates Chart.yaml + templates.
        run: make helm-lint

  doc-test:
    name: doc-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cached
      - name: Verify generated OpenAPI specs are in sync with Go types
        # Regenerates docs/openapi/{compute,artifacts,cluster-manager}.yaml
        # from each service's request/response structs and fails the job if
        # any committed spec drifted. Run `make doc-gen` locally and commit
        # the result to fix.
        run: make doc-test

  image:
    name: image (${{ matrix.component.name }})
    # Only build and push on tag pushes (release cuts). PRs and main pushes
    # run lint/test but don't publish images. Gate behind every other check
    # so a red tag doesn't ship.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, integration, helm-lint, doc-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          # All Dockerfiles build from the repo root for consistency.
          - { name: tenant-operator,  image: axisml-tenant-operator,  context: ., dockerfile: components/tenant-operator/Dockerfile }
          - { name: compute-operator, image: axisml-compute-operator, context: ., dockerfile: components/compute-operator/Dockerfile }
          - { name: cluster-manager,  image: axisml-cluster-manager,  context: ., dockerfile: components/cluster-manager/Dockerfile }
          - { name: compute,          image: axisml-compute,          context: ., dockerfile: components/compute/Dockerfile }
          - { name: artifacts,        image: axisml-artifacts,        context: ., dockerfile: components/artifacts/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image reference itself, so an
          # owner like `AxisML` becomes `axisml` (GHCR requires lowercase).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.image }}
          # Git tag drives every published tag. `vX.Y.Z` produces images
          # tagged X.Y.Z (matches Helm chart appVersion convention), X.Y,
          # latest, and a short-sha tag for traceability.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          # Multi-arch images so the same tag works on amd64 and arm64 nodes
          # (Apple Silicon dev clusters, Graviton, etc.). The Dockerfiles
          # cross-compile from $BUILDPLATFORM to keep this fast.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scope so concurrent matrix jobs don't evict
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
