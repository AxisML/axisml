name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new commit lands.
# `main` pushes are excluded (each commit on main should produce a green run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs are organised as a type × component grid:
#
#                 tenant-operator  compute-operator  cluster-manager  compute  artifacts  test
#   lint            ✓                 ✓                ✓                ✓        ✓          ✓
#   test            ✓                 ✓                ✓                ✓        ✓          —
#   integration     ✓                 ✓                —                ✓        —          —
#   image           ✓                 ✓                ✓                ✓        ✓          —   (main-only)
#
# The `test` lint bucket covers the shared test/testutil + test/e2e modules,
# which don't have their own test/integration layers. Each component lint job
# lints both its production module and its test/integration sub-module in one
# go; artifacts has no test/integration sub-module (its testcontainer-backed
# integration tests live in the same module under `./internal/integration` and
# run separately, not in CI).
#
# `helm-lint` sits outside the grid — it validates Helm charts under
# deploy/helm/, which aren't tied to a Go component.

jobs:
  lint:
    name: lint (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: tenant-operator
            modules: |
              components/tenant-operator
              components/tenant-operator/test/integration
          - name: compute-operator
            modules: |
              components/compute-operator
              components/compute-operator/test/integration
          - name: cluster-manager
            modules: |
              components/cluster-manager
              components/cluster-manager/test/integration
          - name: compute
            modules: |
              components/compute
              components/compute/test/integration
          - name: artifacts
            modules: |
              components/artifacts
          - name: test
            modules: |
              test/testutil
              test/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          # Repo has no root go.sum (monorepo with multiple Go modules).
          # Globbing every module's go.sum makes the cache key stable and
          # shares ~/go/pkg/mod + ~/.cache/go-build across runs.
          cache-dependency-path: '**/go.sum'
      - name: Install golangci-lint
        # `go install` is reliable across versions; the upstream install.sh
        # from `master` has had checksum-table regressions for tagged releases.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run golangci-lint
        run: |
          set -e
          while IFS= read -r module; do
            [ -z "$module" ] && continue
            echo "::group::lint $module"
            (cd "$module" && golangci-lint run --build-tags=integration,e2e)
            echo "::endgroup::"
          done <<'EOF'
          ${{ matrix.component.modules }}
          EOF

  test:
    name: test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [tenant-operator, compute-operator, cluster-manager, compute, artifacts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Run unit tests with coverage
        run: make ${{ matrix.component }}-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./components/${{ matrix.component }}/coverage/coverage.out
          flags: test,${{ matrix.component }}
          fail_ci_if_error: false

  integration:
    name: integration (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [tenant-operator, compute-operator, cluster-manager, compute]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Cache shared setup-envtest binary + kubebuilder assets
        uses: actions/cache@v4
        with:
          path: |
            test/setup-envtest
            ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-k8s-1.31.0
      - name: Install setup-envtest binary if missing
        run: make setup-envtest
      - name: Run L1 integration tests with coverage
        run: make ${{ matrix.component }}-integration-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./components/${{ matrix.component }}/coverage/integration-coverage.out
          flags: integration,${{ matrix.component }}
          fail_ci_if_error: false

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint Helm charts
        # No `helm dependency update` — fetching every subchart from upstream
        # registries on every PR is slow and flaky. `helm lint` warns about
        # missing dependencies but still validates Chart.yaml + templates.
        run: make helm-lint

  image:
    name: image (${{ matrix.component.name }})
    # Only build and push on main pushes — PRs run lint/test but don't publish
    # images. Gate behind every other check so a red main doesn't ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, integration, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          # All Dockerfiles build from the repo root for consistency.
          - { name: tenant-operator,  image: axisml/axisml-tenant-operator,  context: ., dockerfile: components/tenant-operator/Dockerfile }
          - { name: compute-operator, image: axisml/axisml-compute-operator, context: ., dockerfile: components/compute-operator/Dockerfile }
          - { name: cluster-manager,  image: axisml/axisml-cluster-manager,  context: ., dockerfile: components/cluster-manager/Dockerfile }
          - { name: compute,          image: axisml/axisml-compute,          context: ., dockerfile: components/compute/Dockerfile }
          - { name: artifacts,        image: axisml/axisml-artifacts,        context: ., dockerfile: components/artifacts/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read chart appVersion
        id: chart
        # The Helm chart's default image.tag is .Chart.AppVersion, so CI must
        # publish that tag for `helm install` to work out of the box.
        run: |
          version=$(awk '/^appVersion:/{gsub(/"/,"",$2);print $2}' deploy/helm/axisml-system/Chart.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image reference itself, so an
          # owner like `AxisML` becomes `axisml` (GHCR requires lowercase).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value=${{ steps.chart.outputs.version }}
            type=sha,format=short
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          # Multi-arch images so the same tag works on amd64 and arm64 nodes
          # (Apple Silicon dev clusters, Graviton, etc.). The Dockerfiles
          # cross-compile from $BUILDPLATFORM to keep this fast.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scope so concurrent matrix jobs don't evict
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
