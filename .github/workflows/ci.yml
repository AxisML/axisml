name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new commit lands.
# `main` pushes are excluded (each commit on main should produce a green run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - components/operators/tenant-operator
          - components/operators/mljob-operator
          - components/operators/mlservice-operator
          - components/operators/tenant-operator/test/envtest
          - components/operators/mljob-operator/test/envtest
          - components/operators/mlservice-operator/test/envtest
          - components/compute
          - components/compute/test/envtest
          - test/testutil
          - test/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: ${{ matrix.module }}
          args: --build-tags=envtest,e2e

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          # Repo has no root go.sum (monorepo with 8 separate Go modules).
          # Without this glob, setup-go's default `go.sum` lookup fails and
          # caching degenerates — module downloads and build cache cold-start
          # every run. Globbing every module's go.sum makes the cache key
          # stable and shares ~/go/pkg/mod + ~/.cache/go-build across runs.
          cache-dependency-path: '**/go.sum'
      - name: Run unit tests with coverage
        run: make coverage-unit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # Glob picks up every operator's profile, so adding a new component
          # to the top-level COMPONENTS list doesn't require editing CI too.
          files: ./components/operators/*/coverage/coverage.out,./components/compute/coverage/coverage.out
          flags: unit
          fail_ci_if_error: false

  openapi:
    name: openapi spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: components/compute/go.mod
          cache: true
          cache-dependency-path: components/compute/go.sum
      - name: Verify components/compute/docs/openapi.yaml is up to date
        working-directory: components/compute
        run: make openapi-check

  envtest:
    name: L1 envtest (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: tenant-operator,    coverage: ./components/operators/tenant-operator/coverage/envtest-coverage.out }
          - { name: mljob-operator,     coverage: ./components/operators/mljob-operator/coverage/envtest-coverage.out }
          - { name: mlservice-operator, coverage: ./components/operators/mlservice-operator/coverage/envtest-coverage.out }
          - { name: compute,            coverage: ./components/compute/coverage/envtest-coverage.out }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          # See `unit` job: glob every module's go.sum because there is no
          # root go.sum to drive setup-go's default cache key.
          cache-dependency-path: '**/go.sum'
      - name: Cache shared setup-envtest binary + kubebuilder assets
        uses: actions/cache@v4
        with:
          path: |
            test/setup-envtest
            ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-k8s-1.31.0
      - name: Install setup-envtest binary if missing
        run: make setup-envtest
      - name: Run L1 envtest with coverage for ${{ matrix.component.name }}
        run: make ${{ matrix.component.name }}-envtest-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.component.coverage }}
          flags: envtest,${{ matrix.component.name }}
          fail_ci_if_error: false

  image:
    name: image (${{ matrix.component.name }})
    # Only build and push on main pushes — PRs run lint/test but don't publish
    # images. Gate behind every other check so a red main doesn't ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, openapi, envtest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          # `compute` builds from the repo root because its Dockerfile pulls in
          # sibling operator modules via local `replace` directives. The other
          # three are self-contained.
          - { name: tenant-operator,    image: axisml/tenant-operator,    context: components/operators/tenant-operator,    dockerfile: components/operators/tenant-operator/Dockerfile }
          - { name: mljob-operator,     image: axisml/mljob-operator,     context: components/operators/mljob-operator,     dockerfile: components/operators/mljob-operator/Dockerfile }
          - { name: mlservice-operator, image: axisml/mlservice-operator, context: components/operators/mlservice-operator, dockerfile: components/operators/mlservice-operator/Dockerfile }
          - { name: compute,            image: axisml/axisml-compute,     context: .,                                       dockerfile: components/compute/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read chart appVersion
        id: chart
        # The Helm chart's default image.tag is .Chart.AppVersion, so CI must
        # publish that tag for `helm install` to work out of the box.
        run: |
          version=$(awk '/^appVersion:/{gsub(/"/,"",$2);print $2}' deploy/helm/axisml-system/Chart.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image reference itself, so an
          # owner like `AxisML` becomes `axisml` (GHCR requires lowercase).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value=${{ steps.chart.outputs.version }}
            type=sha,format=short
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scope so concurrent matrix jobs don't evict
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
