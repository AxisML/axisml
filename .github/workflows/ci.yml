name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new commit lands.
# `main` pushes are excluded (each commit on main should produce a green run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs are organised as a type × component grid:
#
#                 operator   compute   test
#   lint            ✓          ✓        ✓
#   test            ✓          ✓        —
#   envtest         ✓          ✓        —
#   openapi         —          ✓        —
#   image           ✓          ✓        —   (main-only)
#
# The `test` lint bucket covers the shared test/testutil + test/e2e modules,
# which don't have their own test/envtest layers. Each component lint job
# lints both its production module and its test/envtest sub-module in one go.

jobs:
  lint:
    name: lint (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: operator
            modules: |
              components/operator
              components/operator/test/envtest
          - name: compute
            modules: |
              components/compute
              components/compute/test/envtest
          - name: test
            modules: |
              test/testutil
              test/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          # Repo has no root go.sum (monorepo with multiple Go modules).
          # Globbing every module's go.sum makes the cache key stable and
          # shares ~/go/pkg/mod + ~/.cache/go-build across runs.
          cache-dependency-path: '**/go.sum'
      - name: Install golangci-lint
        # `go install` is reliable across versions; the upstream install.sh
        # from `master` has had checksum-table regressions for tagged releases.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run golangci-lint
        run: |
          set -e
          while IFS= read -r module; do
            [ -z "$module" ] && continue
            echo "::group::lint $module"
            (cd "$module" && golangci-lint run --build-tags=envtest,e2e)
            echo "::endgroup::"
          done <<'EOF'
          ${{ matrix.component.modules }}
          EOF

  test:
    name: test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [operator, compute]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Run unit tests with coverage
        run: make ${{ matrix.component }}-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./components/${{ matrix.component }}/coverage/coverage.out
          flags: test,${{ matrix.component }}
          fail_ci_if_error: false

  envtest:
    name: envtest (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [operator, compute]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Cache shared setup-envtest binary + kubebuilder assets
        uses: actions/cache@v4
        with:
          path: |
            test/setup-envtest
            ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-k8s-1.31.0
      - name: Install setup-envtest binary if missing
        run: make setup-envtest
      - name: Run L1 envtest with coverage
        run: make ${{ matrix.component }}-envtest-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./components/${{ matrix.component }}/coverage/envtest-coverage.out
          flags: envtest,${{ matrix.component }}
          fail_ci_if_error: false

  openapi:
    name: openapi (compute)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: components/compute/go.mod
          cache: true
          cache-dependency-path: components/compute/go.sum
      - name: Verify components/compute/docs/openapi.yaml is up to date
        working-directory: components/compute
        run: make openapi-check

  image:
    name: image (${{ matrix.component.name }})
    # Only build and push on main pushes — PRs run lint/test but don't publish
    # images. Gate behind every other check so a red main doesn't ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, envtest, openapi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          # The merged operator and compute both build from the repo root —
          # their Dockerfiles reach into sibling modules.
          - { name: operator, image: axisml/axisml-operator, context: ., dockerfile: components/operator/Dockerfile }
          - { name: compute,  image: axisml/axisml-compute,  context: ., dockerfile: components/compute/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read chart appVersion
        id: chart
        # The Helm chart's default image.tag is .Chart.AppVersion, so CI must
        # publish that tag for `helm install` to work out of the box.
        run: |
          version=$(awk '/^appVersion:/{gsub(/"/,"",$2);print $2}' deploy/helm/axisml-system/Chart.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image reference itself, so an
          # owner like `AxisML` becomes `axisml` (GHCR requires lowercase).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value=${{ steps.chart.outputs.version }}
            type=sha,format=short
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scope so concurrent matrix jobs don't evict
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
