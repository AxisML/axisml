{{- if and .Values.platform.enabled (not .Values.platform.bootstrap.passwordSecret) }}
{{/*
Initial system-admin password for the backend's bootstrap seeding, injected as
AXISML_BOOTSTRAP_PASSWORD. Rendered only when the operator hasn't pointed
`bootstrap.passwordSecret` at an externally-managed Secret. Reused via `lookup`
so `helm upgrade` does NOT rotate it (the seeded admin password stays stable),
falling back to `bootstrap.password` on first install.
*/}}
{{- $secretName := printf "%s-bootstrap" (include "axisml.fullname" .) }}
{{- $pw := .Values.platform.bootstrap.password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $pw = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "platform") | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pw | quote }}
{{- end }}
