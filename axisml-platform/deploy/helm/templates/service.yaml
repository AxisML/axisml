{{- if .Values.platform.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axisml.fullname" . }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "platform") | nindent 4 }}
spec:
  type: {{ .Values.platform.service.type }}
  ports:
    - port: {{ .Values.platform.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.platform.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "platform") | nindent 4 }}
{{- end }}
