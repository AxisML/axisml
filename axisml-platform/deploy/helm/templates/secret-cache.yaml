{{- if and .Values.platform.enabled .Values.cache.enabled }}
{{/*
Platform renders its own copy of the shared Redis password (Secrets are
namespace-scoped, so it can't reference the infra chart's secret directly).
cache.auth.password must match the value the Infra chart installs.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axisml.fullname" . }}-backend-cache
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.cache.auth.password | quote }}
{{- end }}
