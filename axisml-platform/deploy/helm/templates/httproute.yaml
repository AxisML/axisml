{{- if and .Values.platform.enabled .Values.platform.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "axisml.fullname" . }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "platform") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.platform.httpRoute.gatewayName | quote }}
      namespace: {{ .Values.platform.httpRoute.gatewayNamespace | quote }}
      sectionName: {{ .Values.platform.httpRoute.sectionName | quote }}
  {{- if .Values.platform.httpRoute.host }}
  hostnames:
    - {{ .Values.platform.httpRoute.host | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.platform.httpRoute.path | quote }}
      backendRefs:
        - name: {{ include "axisml.fullname" . }}
          port: {{ .Values.platform.service.port }}
{{- end }}
