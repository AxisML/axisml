{{- if .Values.platform.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axisml.fullname" . }}-backend
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
data:
  config.yaml: |
    database:
      host: {{ .Values.database.host }}
      port: {{ .Values.database.port }}
      name: {{ .Values.database.name }}
      user: {{ .Values.database.user }}
      sslmode: {{ .Values.database.sslMode | default "disable" }}
    log:
      level: {{ .Values.platform.log.level | default "info" }}
      format: {{ .Values.platform.log.format | default "json" }}
    system:
      cluster_manager: http://{{ .Values.system.clusterManager.name }}.{{ .Values.system.namespace }}:{{ .Values.system.clusterManager.port }}
      compute_service: http://{{ .Values.system.computeService.name }}.{{ .Values.system.namespace }}:{{ .Values.system.computeService.port }}
      artifact_hub: http://{{ .Values.system.artifactHub.name }}.{{ .Values.system.namespace }}:{{ .Values.system.artifactHub.port }}
    cache:
      addr: "{{ if .Values.cache.enabled }}{{ .Values.cache.host }}:{{ .Values.cache.port }}{{ end }}"
      db: {{ .Values.cache.db }}
    auth:
      login_token_ttl: {{ .Values.platform.auth.loginTokenTTL | default "12h" }}
    bootstrap:
      username: {{ .Values.platform.bootstrap.username | default "admin" }}
{{- end }}
