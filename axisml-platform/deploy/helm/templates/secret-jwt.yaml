{{- if and .Values.platform.enabled (not .Values.platform.auth.jwt.privateKeySecret) }}
{{/*
RS256 private key for login JWTs. Rendered only when the operator hasn't pointed
`auth.jwt.privateKeySecret` at an externally-managed Secret. Resolution order:
  1. explicit inline PEM (`auth.jwt.privateKey`);
  2. the existing chart-managed Secret (reused via `lookup`, so `helm upgrade`
     does NOT rotate the key and live sessions survive);
  3. a freshly generated 2048-bit RSA key on first install.
*/}}
{{- $secretName := printf "%s-backend-jwt" (include "axisml.fullname" .) }}
{{- $pem := .Values.platform.auth.jwt.privateKey }}
{{- if not $pem }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "private-key.pem") }}
{{- $pem = index $existing.data "private-key.pem" | b64dec }}
{{- else }}
{{- $pem = genPrivateKey "rsa" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  private-key.pem: {{ $pem | quote }}
{{- end }}
