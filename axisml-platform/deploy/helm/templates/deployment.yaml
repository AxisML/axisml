{{- if .Values.platform.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axisml.fullname" . }}-backend
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.platform.replicaCount }}
  selector:
    matchLabels:
      {{- include "axisml.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axisml.componentLabels" (dict "context" . "component" "backend") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for Postgres, then migrate + seed admin/default tenant. The
        # default-tenant CR is best-effort (cluster-manager may still be coming
        # up); migrations + the system-admin always land.
        - name: bootstrap
          image: {{ include "axisml.image" (dict "imageRoot" .Values.platform.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          args: ["bootstrap"]
          volumeMounts:
            - name: config
              mountPath: /etc/axisml/config.yaml
              subPath: config.yaml
              readOnly: true
          env:
            - name: AXISML_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axisml.fullname" . }}-backend-db
                  key: password
            {{- with .Values.platform.bootstrap.passwordSecret }}
            - name: AXISML_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
      containers:
        - name: backend
          image: {{ include "axisml.image" (dict "imageRoot" .Values.platform.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.platform.service.port }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.platform.probesPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/axisml/config.yaml
              subPath: config.yaml
              readOnly: true
          env:
            - name: AXISML_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axisml.fullname" . }}-backend-db
                  key: password
            {{- if .Values.cache.enabled }}
            - name: AXISML_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axisml.fullname" . }}-backend-cache
                  key: password
            {{- end }}
            # Stable RS256 signing key so login tokens survive pod restarts and
            # stay consistent across replicas; the JWKS kid is derived from it.
            - name: AXISML_AUTH_JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  {{- with .Values.platform.auth.jwt.privateKeySecret }}
                  name: {{ .name }}
                  key: {{ .key }}
                  {{- else }}
                  name: {{ include "axisml.fullname" . }}-backend-jwt
                  key: private-key.pem
                  {{- end }}
            {{- range $key, $value := .Values.platform.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "axisml.fullname" . }}-backend
{{- end }}
