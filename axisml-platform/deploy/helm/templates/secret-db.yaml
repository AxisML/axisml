{{- if .Values.platform.enabled }}
{{/*
Platform renders its own copy of the shared DB password (Secrets are
namespace-scoped, so it can't reference the infra chart's secret directly).
database.auth.password must match the value the Infra chart installs.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axisml.fullname" . }}-db
  labels:
    {{- include "axisml.componentLabels" (dict "context" . "component" "platform") | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.auth.password | quote }}
{{- end }}
