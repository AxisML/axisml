# -- Global settings shared across all components
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# Downstream system-layer services
# =============================================================================
# Platform is the only externally-reachable layer; it orchestrates the
# system-layer domain services over cluster-internal DNS. Those services live
# in their own namespace (default `axisml-system`, release `axisml`), so the
# URLs are fully-qualified `<service>.<namespace>` rather than bare names.
system:
  namespace: axisml-system
  clusterManager:
    name: axisml-cluster-manager
    port: 8080
  computeService:
    name: axisml-compute-service
    port: 8080
  artifactHub:
    name: axisml-artifact-hub
    port: 8080

# =============================================================================
# Shared PostgreSQL (Infra layer, cross-namespace). Platform reads the same DB
# the System services use; the password must match the Infra chart's value.
# =============================================================================
database:
  host: axisml-database.axisml-infra
  port: 5432
  name: axisml
  user: axisml
  sslMode: disable
  auth:
    password: axisml

# =============================================================================
# Shared Redis (Infra layer, cross-namespace). Optional accelerator for the
# auth hot path (session validity + identity/RBAC); the backend degrades to
# direct PostgreSQL reads when it cannot reach Redis. The password must match
# the Infra chart's `cache.auth.password`. Set `enabled: false` to run with no
# cache at all (REDIS_ADDR stays unset).
# =============================================================================
cache:
  enabled: true
  host: axisml-redis-master.axisml-infra
  port: 6379
  db: 0
  auth:
    password: axisml

# =============================================================================
# AxisML Platform
# =============================================================================
platform:
  enabled: true
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: axisml/axisml-platform-backend
    # Defaults to the chart's appVersion when empty (the top-level Makefile
    # injects the system appVersion via --set for tag parity).
    tag: ""
    pullPolicy: IfNotPresent

  # Dedicated probes port (fixed in code; only wires containerPort/probes).
  probesPort: 8081

  log:
    level: info          # debug | info | warn | error
    format: json         # json | console

  bootstrap:
    # Initial system-admin. The default tenant is owned by the System chart's
    # seed.tenant and discovered by the backend via cluster-manager.
    username: admin
    # Optionally source the initial system-admin password from a Secret.
    # passwordSecret: { name: axisml-platform-bootstrap, key: password }
    passwordSecret: {}

  # RS256 signing key for login JWTs. The backend generates an ephemeral key when
  # none is provided, which invalidates every session on each pod restart and
  # breaks JWKS consistency across replicas. To keep tokens valid across restarts:
  #   - if `privateKeySecret` is set, that externally-managed Secret is used;
  #   - else if `privateKey` (inline PEM) is set, the chart renders a Secret from it;
  #   - else the chart generates a key ONCE and persists it in a chart-managed
  #     Secret, reusing it on subsequent upgrades via `lookup`.
  # The JWKS `kid` is derived from the key (RFC 7638 thumbprint), not configured.
  auth:
    loginTokenTTL: 12h   # login session token lifetime
    jwt:
      privateKeySecret: {} # { name: my-jwt-secret, key: private-key.pem }
      privateKey: "" # inline PEM (PKCS#1 or PKCS#8 RSA private key)

  service:
    type: ClusterIP
    port: 8080

  httpRoute:
    enabled: false
    gatewayName: axisml-gateway
    gatewayNamespace: axisml-infra
    sectionName: http
    host: axisml.local
    path: /

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env: {}
