# SPA server: serve static assets, fall back to index.html for client-side
# routes (react-router). API calls are proxied by the Envoy Gateway in
# production, so this server only owns the static bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
