          allOf:
          - $ref: '#/components/schemas/WorkspacePhase'
          description: Current workspace lifecycle phase.
        poolName:
          description: Resource pool the workspace is scheduled onto.
          maxLength: 40
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        readyReplicas:
          description: Pods that have passed readiness.
          minimum: 0
          type: integer
        replicas:
          description: Desired pod count (0 when stopped).
          minimum: 0
          type: integer
        resources:
          allOf:
          - $ref: '#/components/schemas/ResourceMap'
          description: Resources reserved by the workspace.
        tenantDisplayName:
          description: Human-readable tenant name.
          type: string
        tenantName:
          description: Tenant identifier owning the workspace.
          type: string
        unitName:
          description: Resource unit (shape) within the pool.
          maxLength: 40
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        updatedAt:
          description: Time the workspace was last updated.
          format: date-time
          type: string
        volumes:
          description: Data volumes mounted into the workspace.
          items:
            $ref: '#/components/schemas/WorkspaceVolume'
          type: array
      required:
      - containerPort
      - createdAt
      - id
      - image
      - name
      - namespace
      - owner
      - tenantName
      - updatedAt
      type: object
    WorkspaceCreateRequest:
      example:
        containerPort: 8888
        description: JupyterLab interactive development environment.
        displayName: Vision team dev environment
        image: registry.axisml.io/dev/jupyter:3.0.0
        lifecycle:
          idleTimeoutSeconds: 3600
        name: notebook-dev
        poolName: gpu-a100
        unitName: a100-1x
        volumes:
        - mountPath: /home/jovyan/work
          name: notebook-data
      properties:
        args:
          description: Container args override.
          items:
            type: string
          type: array
        command:
          description: Container entrypoint override.
          items:
            type: string
          type: array
        containerPort:
          description: Port the dev server listens on; defaults from the image when
            omitted.
          maximum: 65535
          minimum: 1
          type: integer
        description:
          description: Free-text workspace description.
          maxLength: 1000
          type: string
        displayName:
          description: Human-readable workspace label.
          maxLength: 100
          type: string
        env:
          description: Environment variables injected into the container.
          items:
            $ref: '#/components/schemas/EnvVar'
          type: array
        image:
          description: Container image for the dev environment.
          type: string
        lifecycle:
          allOf:
          - $ref: '#/components/schemas/WorkspaceLifecycle'
          description: Lifecycle policy (e.g. idle auto-stop).
        name:
          description: Workspace name (unique within the tenant).
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        poolName:
          description: Resource pool to schedule the workspace onto.
          maxLength: 40
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        unitName:
          description: Resource unit (shape) within the pool.
          maxLength: 40
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        volumes:
          description: Data volumes to mount into the workspace.
          items:
            $ref: '#/components/schemas/WorkspaceVolume'
          type: array
      required:
      - image
      - name
      - poolName
      - unitName
      type: object
    WorkspaceDesiredState:
      enum:
      - Running
      - Stopped
      type: string
    WorkspaceEndpoint:
      example:
        accessUrl: https://axisml.example.com/ws/team-vision/notebook-dev/
        internalDns: notebook-dev.axisml-team-vision.svc.cluster.local
        tools:
        - label: JupyterLab
          name: jupyter
          url: https://axisml.example.com/ws/team-vision/notebook-dev/lab
        - label: VS Code
          name: vscode
          url: https://axisml.example.com/ws/team-vision/notebook-dev/vscode/
        - label: Terminal
          name: terminal
          url: https://axisml.example.com/ws/team-vision/notebook-dev/terminals/1
      properties:
        accessUrl:
          description: Primary external URL for reaching the workspace UI.
          type: string
        internalDns:
          description: In-cluster DNS name for the workspace service.
          type: string
        tools:
          description: Per-tool launch URLs (Jupyter, VS Code, terminal, ...); the
            UI renders one launch button each.
          items:
            $ref: '#/components/schemas/WorkspaceTool'
          type: array
      type: object
    WorkspaceImage:
      example:
        defaultPort: 8888
        description: JupyterLab data-science environment (public).
        displayName: JupyterLab
        kind: jupyter
        public: true
        ref: registry.axisml.io/dev/jupyter:3.0.0
      properties:
        defaultPort:
          description: Default container port the dev server listens on.
          type: integer
        description:
          description: Short description of the environment.
          type: string
        displayName:
          description: Human-readable image label.
          type: string
        kind:
          description: Environment kind (jupyter, vscode, terminal, custom).
          type: string
        public:
          description: Whether the image is a public/shared base image.
          type: boolean
        ref:
          description: Container image reference.
          type: string
      required:
      - displayName
      - ref
      type: object
    WorkspaceImageList:
      example:
        count: 3
        items:
        - defaultPort: 8888
          description: JupyterLab data-science environment (public).
          displayName: JupyterLab
          kind: jupyter
          public: true
          ref: registry.axisml.io/dev/jupyter:3.0.0
        - defaultPort: 8888
          description: CUDA 12.1 + PyTorch 2.3 training image.
          displayName: PyTorch
          kind: jupyter
          public: true
          ref: registry.axisml.io/dev/pytorch:2.3.0
        - defaultPort: 8080
          description: VS Code (code-server) development environment (public).
          displayName: VS Code
          kind: vscode
          public: true
          ref: registry.axisml.io/dev/code-server:4.22
      properties:
        count:
          description: Number of images in the catalog.
          minimum: 0
          type: integer
        items:
          description: Selectable base images.
          items:
            $ref: '#/components/schemas/WorkspaceImage'
          type: array
      required:
      - count
      - items
      type: object
    WorkspaceLifecycle:
      example:
        idleTimeoutSeconds: 3600
      properties:
        idleTimeoutSeconds:
          description: Idle duration (seconds) after which the workspace is auto-stopped;
            0 disables auto-stop.
          minimum: 0
          type: integer
      type: object
    WorkspaceList:
      example:
        continueToken: ""
        count: 1
        items:
        - args:
          - --NotebookApp.token=
          command:
          - start-notebook.sh
          computeNamespace: axisml-team-vision
          containerPort: 8888
          createdAt: "2026-06-20T08:00:00Z"
          description: JupyterLab interactive development environment.
          desiredState: Running
          displayName: Vision team dev environment
          endpoint:
            accessUrl: https://axisml.example.com/ws/team-vision/notebook-dev/
            internalDns: notebook-dev.axisml-team-vision.svc.cluster.local
            tools:
            - label: JupyterLab
              name: jupyter
              url: https://axisml.example.com/ws/team-vision/notebook-dev/lab
            - label: VS Code
              name: vscode
              url: https://axisml.example.com/ws/team-vision/notebook-dev/vscode/
            - label: Terminal
              name: terminal
              url: https://axisml.example.com/ws/team-vision/notebook-dev/terminals/1
          env:
          - name: JUPYTER_ENABLE_LAB
            value: "yes"
          id: f1e2d3c4-5b6a-4798-8c0d-1e2f3a4b5c6d
          image: registry.axisml.io/dev/jupyter:3.0.0
          lastStartedAt: "2026-06-28T09:00:00Z"
          lifecycle:
            idleTimeoutSeconds: 3600
          message: Workspace is ready.
          name: notebook-dev
          namespace: team-vision
          owner: li.wei
          ownerId: 3a2b1c0d-4e5f-6789-abcd-ef0123456789
          phase: Running
          poolName: gpu-a100
          readyReplicas: 1
          replicas: 1
          resources:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          tenantDisplayName: Vision Team
          tenantName: team-vision
          unitName: a100-1x
          updatedAt: "2026-06-28T09:30:00Z"
          volumes:
          - mountPath: /home/jovyan/work
            name: notebook-data
            used: 12Gi
        partial: false
      properties:
        continueToken:
          description: Opaque token to fetch the next page.
          type: string
        count:
          description: Number of workspaces in this page.
          minimum: 0
          type: integer
        items:
          description: Workspaces in this page.
          items:
            $ref: '#/components/schemas/Workspace'
          type: array
        partial:
          description: True if the list was truncated by an upstream limit.
          type: boolean
      required:
      - count
      - items
      type: object
    WorkspacePatchRequest:
      example:
        description: Updated description.
        displayName: Vision team dev environment (v2)
        lifecycle:
          idleTimeoutSeconds: 7200
      properties:
        description:
          description: Updated free-text workspace description.
          maxLength: 1000
          type: string
        displayName:
          description: Updated human-readable workspace label.
          maxLength: 100
          type: string
        lifecycle:
          allOf:
          - $ref: '#/components/schemas/WorkspaceLifecycle'
          description: Replacement lifecycle policy.
      type: object
    WorkspacePhase:
      description: Derived from compute service phase + replicas. Hoisted to the top
        of Workspace for B-tree filtering.
      enum:
      - Creating
      - Starting
      - Running
      - Degraded
      - Failed
      - Stopped
      - Deleting
      - Deleted
      - Pending
      type: string
    WorkspaceTool:
      example:
        label: JupyterLab
        name: jupyter
        url: https://axisml.example.com/ws/team-vision/notebook-dev/lab
      properties:
        label:
          description: Human-readable tool label.
          type: string
        name:
          description: Tool identifier (jupyter, vscode, terminal, ...).
          type: string
        url:
          description: Launch URL for the tool.
          type: string
      required:
      - name
      - url
      type: object
    WorkspaceVolume:
      example:
        mountPath: /home/jovyan/work
        name: notebook-data
        used: 12Gi
      properties:
        mountPath:
          description: Path the volume is mounted at inside the container.
          type: string
        name:
          description: Existing data volume (claim) name to mount.
          maxLength: 40
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        used:
          description: Live consumed capacity of the volume (read-only).
          type: string
      required:
      - mountPath
      - name
      type: object
info:
  description: 'User-facing entrypoint to AxisML. Aggregates the internal services
    (cluster-manager / compute / artifacts) and adds platform-native features: identity,
    RBAC, workspace/job/experiment/service/traffic orchestration, the model/image
    artifact registry. All endpoints except POST /api/v1/auth/login require a bearer
    JWT issued by Platform; per-endpoint role requirements are noted in each operation.
    Errors use RFC 7807 application/problem+json bodies.'
  title: AxisML Platform API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Login succeeded; returns JWT and current user.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (invalid syntax, missing required fields,
            immutable field, etc.).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Semantically invalid request (e.g., cross-field violations).
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Exchange username + password for a bearer JWT
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session revoked.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Revoke the current bearer JWT
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: Current user view.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Get the current user, tenant role bindings, and permissions
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: New JWT issued.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Refresh the current bearer JWT
      tags:
      - Auth
  /api/v1/dashboard/activity:
    get:
      operationId: listActivity
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
        name: X-Axisml-Tenant
        schema:
          maxLength: 40
          minLength: 3
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      - description: Page size (default 50, max 200).
        in: query
        name: limit
        schema:
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
          description: A page of activity entries.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (invalid syntax, missing required fields,
            immutable field, etc.).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Recent-activity feed for the active tenant
      tags:
      - Dashboard
  /api/v1/dashboard/cluster-metrics:
    get:
      operationId: getClusterMetrics
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
        name: X-Axisml-Tenant
        schema:
          maxLength: 40
          minLength: 3
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      - description: Metric to query.
        in: query
        name: metric
        required: true
        schema:
          enum:
          - gpu_util
          - gpu_quota
          - cpu_util
          - mem_util
          type: string
      - description: ISO 8601 duration (1h, 24h, 7d).
        in: query
        name: range
        required: true
        schema:
          type: string
      - description: Sampling step between points.
        in: query
        name: step
        schema:
          type: string
      - description: Resource pool to query (the series is per (tenant, pool)).
        in: query
        name: pool
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
          description: Metric series.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (invalid syntax, missing required fields,
            immutable field, etc.).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
        "502":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Upstream service (cluster-manager / compute / artifacts / Prometheus)
            failed.
      summary: Per-pool cluster resource-utilisation time series for the active tenant
      tags:
      - Dashboard
  /api/v1/dashboard/cluster-usage:
    get:
      operationId: getClusterUsage
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
        name: X-Axisml-Tenant
        schema:
          maxLength: 40
          minLength: 3
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      - description: Restrict to a single resource pool; omit for every pool the tenant
          has quota in.
        in: query
        name: pool
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterUsage'
          description: Cluster usage snapshot.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
        "502":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Upstream service (cluster-manager / compute / artifacts / Prometheus)
            failed.
      summary: Per-pool cluster resource-usage snapshot for the active tenant
      tags:
      - Dashboard
  /api/v1/datavolumes:
    get:
      operationId: listDataVolumes
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
        name: X-Axisml-Tenant
        schema:
          maxLength: 40
          minLength: 3
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataVolumeList'
          description: A page of data volumes.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (invalid syntax, missing required fields,
            immutable field, etc.).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authenticated but insufficient role for the requested operation.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: List data volumes
      tags:
      - DataVolumes
    post:
      operationId: createDataVolume
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
        name: X-Axisml-Tenant
        schema:
          maxLength: 40
          minLength: 3
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataVolumeCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataVolume'
          description: Data volume created.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (invalid syntax, missing required fields,
            immutable field, etc.).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authenticated but insufficient role for the requested operation.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Resource not found, OR the caller cannot see it. Platform deliberately
            conflates these for non-admins to avoid information leak.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'Conflicts with a precondition: duplicate name, last-tenant-admin
            protection, in-use blocker, immutable transition, etc.'
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Semantically invalid request (e.g., cross-field violations).
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Create a data volume
      tags:
      - DataVolumes
  /api/v1/datavolumes/{name}:
    delete:
      operationId: deleteDataVolume
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
        name: X-Axisml-Tenant
        schema:
          maxLength: 40
          minLength: 3
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      - in: path
        name: name
        required: true
        schema:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      - description: Delete even when mounted by running workloads.
        in: query
        name: force
        schema:
          type: boolean
      responses:
        "204":
          description: Data volume deleted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (invalid syntax, missing required fields,
            immutable field, etc.).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authenticated but insufficient role for the requested operation.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Resource not found, OR the caller cannot see it. Platform deliberately
            conflates these for non-admins to avoid information leak.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'Conflicts with a precondition: duplicate name, last-tenant-admin
            protection, in-use blocker, immutable transition, etc.'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Delete a data volume
      tags:
      - DataVolumes
    get:
      operationId: getDataVolume
      parameters:
      - description: Active tenant for the request (fallback for the axisml.tenant
          cookie).
        in: header
