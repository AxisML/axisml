info:
  description: REST API for Tenant CRUD plus per-namespace Jobs and Services. ResourcePool/Unit
    live in the cluster-manager CRD; compute references them by name. RFC7807 Problem
    responses on errors.
  title: AxisML Compute Service API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/namespaces:
    get:
      operationId: listTenants
      parameters:
      - description: Page size (1–200, default 50).
        in: query
        name: limit
        schema:
          format: int32
          type: integer
      - description: Number of items to skip.
        in: query
        name: offset
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
          description: Page.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict.
        "412":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition failed.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Quota exceeded.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service unavailable.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected error.
      summary: List tenants
      tags:
      - tenants
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
          description: Created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict.
        "412":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition failed.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Quota exceeded.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service unavailable.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected error.
      summary: Create a tenant
      tags:
      - tenants
  /api/v1/namespaces/{namespace}:
    delete:
      operationId: deleteTenant
      parameters:
      - description: Tenant name (= jobs/services partition key).
        in: path
        name: namespace
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted (idempotent).
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden.
        "404":
