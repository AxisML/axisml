info:
  description: REST API for per-namespace Jobs, Services and traffic policies. Tenant/Quota
    and ResourcePool/Unit live in the cluster-manager CRDs; compute partitions on
    the bare namespace string (= tenant identifier) supplied by Platform. RFC7807
    Problem responses on errors.
  title: AxisML Compute Service API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/namespaces/{namespace}/mlruns:
    get:
      operationId: listMLRuns
      parameters:
      - description: Tenant name (= mlruns/mlservices partition key).
        in: path
        name: namespace
        required: true
        schema:
          type: string
      - description: Page size (1–200, default 50).
        in: query
        name: limit
        schema:
          format: int32
          type: integer
      - description: Opaque continuation token from a previous page.
        in: query
        name: continue
        schema:
          type: string
      - description: K8s-style label selector filtered against the row's labels jsonb.
        in: query
        name: labelSelector
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLRunList'
          description: Page.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict.
        "412":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition failed.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Quota exceeded.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service unavailable.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected error.
      summary: List MLRuns in a namespace
      tags:
      - mlruns
    post:
      operationId: createMLRun
      parameters:
      - description: Tenant name (= mlruns/mlservices partition key).
        in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        content:
