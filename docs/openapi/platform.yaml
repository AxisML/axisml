    (cluster-manager / compute / artifacts) and adds platform-native features: identity,
    RBAC, workspace/job/service orchestration, the model/image/dataset artifact registry,
    and Prometheus-backed dashboards. All endpoints except POST /api/v1/auth/login
    require a bearer JWT issued by Platform; per-endpoint role requirements are noted
    in each operation. Errors use RFC 7807 application/problem+json bodies.'
  title: AxisML Platform API
  version: 0.1.0
openapi: 3.0.3
