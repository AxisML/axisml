          type: string
      - in: query
        name: since
        schema:
          format: date-time
          type: string
      - in: query
        name: until
        schema:
          format: date-time
          type: string
      - description: Page size (default 50, max 200).
        in: query
        name: limit
        schema:
          maximum: 200
          minimum: 1
          type: integer
      - description: Opaque continue token from the previous response.
        in: query
        name: continue
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
          description: A page of audit logs.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid bearer JWT.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authenticated but insufficient role for the requested operation.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server error.
      summary: Query the audit log
      tags:
      - Audit
