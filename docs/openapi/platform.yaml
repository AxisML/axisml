servers:
- description: Same-origin (behind the AxisML Infra Envoy Gateway)
  url: /
tags:
- description: Login, logout, session refresh, and "who am I" endpoints.
  name: Auth
- description: Platform user accounts (the identities used for login).
  name: Users
- description: Tenant lifecycle. Proxies cluster-manager with RBAC.
  name: Tenants
- description: ElasticQuota sub-resources of a Tenant (per-pool, per-quota).
  name: Quotas
- description: Per-tenant user ↔ role bindings.
  name: Members
- description: Long-running interactive dev containers (jupyter / code-server / ...).
  name: Workspaces
- description: Reusable Job templates (Platform-owned definitions) and their Runs
    (compute MLRuns named <job>-<n>).
  name: Jobs
- description: Long-running online inference services.
  name: MLServices
- description: Model definitions (Platform-owned); versions proxy artifacts (kind=model).
  name: Models
- description: Image definitions (Platform-owned); versions proxy artifacts (kind=image).
  name: Images
- description: Dataset definitions (Platform-owned); versions proxy artifacts (kind=dataset).
  name: Datasets
- description: Cluster-scoped resource pools (admin-only writes; read by all).
  name: ResourcePools
- description: Per-pool resource unit specs (admin-only writes; read by all).
  name: ResourceUnits
- description: Aggregated overview and Prometheus-backed metrics.
  name: Dashboard
- description: Audit log queries (system-admin only).
  name: Audit
- description: Liveness and readiness probes.
  name: Health
