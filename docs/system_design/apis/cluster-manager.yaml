openapi: 3.0.3
info:
  title: AxisML Cluster Manager API
  version: v1
  description: |
    Cluster-level admin vocabulary service for AxisML.

    Persists ResourcePool and ResourceUnit metadata in PostgreSQL. The
    Cluster Manager performs no Kubernetes API calls and runs no reconciler /
    informer / leader election — it is a pure PG-backed REST service. Platform
    calls in before orchestrating Job / Service creation, expands Pool / Unit
    references into nodeSelector / tolerations / requests / limits primitives,
    then passes those primitives to compute.

    All `/api/v1/*` operations require the `X-Axisml-User` header injected by
    the AxisML Platform. The service is reachable only on the cluster-internal
    ClusterIP (port 8082) — there is no external ingress.

    Errors follow RFC 7807 `application/problem+json`.
servers:
  - url: http://axisml-cluster-manager.axisml-system.svc.cluster.local:8082
    description: In-cluster Service DNS

tags:
  - name: ResourcePools
    description: Resource pool management (admin vocabulary).
  - name: ResourceUnits
    description: Resource unit (spec template) management (admin vocabulary).
  - name: Health
    description: Liveness and readiness probes.

security:
  - AxismlUserHeader: []

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Liveness probe
      description: Returns 200 if the process is alive. No authentication required.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Readiness probe
      description: |
        Returns 200 when PostgreSQL is reachable. Used by the Kubernetes
        readiness probe.
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: PostgreSQL unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─────────────────────────────────────────────────────────────────────
  # ResourcePools
  # ─────────────────────────────────────────────────────────────────────
  /api/v1/resource-pools:
    post:
      operationId: createResourcePool
      tags: [ResourcePools]
      summary: Create a resource pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePoolCreateRequest'
      responses:
        '201':
          description: Resource pool created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePool'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listResourcePools
      tags: [ResourcePools]
      summary: List resource pools
      parameters:
        - $ref: '#/components/parameters/LabelSelector'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of resource pools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePoolList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/resource-pools/{pool}:
    parameters:
      - $ref: '#/components/parameters/PoolName'
    get:
      operationId: getResourcePool
      tags: [ResourcePools]
      summary: Get a resource pool
      responses:
        '200':
          description: Resource pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePool'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateResourcePool
      tags: [ResourcePools]
      summary: Update a resource pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePoolPatchRequest'
      responses:
        '200':
          description: Updated resource pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePool'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteResourcePool
      tags: [ResourcePools]
      summary: Soft-delete a resource pool
      description: |
        Marks the resource pool as deleted (soft delete). Idempotent: calling
        delete on an already-deleted pool returns 204. Returns `409 pool-in-use`
        if active ResourceUnits reference this pool.
      responses:
        '204':
          description: Pool soft-deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ─────────────────────────────────────────────────────────────────────
  # ResourceUnits
  # ─────────────────────────────────────────────────────────────────────
  /api/v1/resource-pools/{pool}/resource-units:
    parameters:
      - $ref: '#/components/parameters/PoolName'
    post:
      operationId: createResourceUnit
      tags: [ResourceUnits]
      summary: Create a resource unit inside a pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUnitCreateRequest'
      responses:
        '201':
          description: Resource unit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnit'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listResourceUnits
      tags: [ResourceUnits]
      summary: List resource units inside a pool
      parameters:
        - $ref: '#/components/parameters/LabelSelector'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of resource units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnitList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/resource-pools/{pool}/resource-units/{unit}:
    parameters:
      - $ref: '#/components/parameters/PoolName'
      - $ref: '#/components/parameters/UnitName'
    get:
      operationId: getResourceUnit
      tags: [ResourceUnits]
      summary: Get a resource unit
      responses:
        '200':
          description: Resource unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnit'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateResourceUnit
      tags: [ResourceUnits]
      summary: Update a resource unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUnitPatchRequest'
      responses:
        '200':
          description: Updated resource unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnit'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteResourceUnit
      tags: [ResourceUnits]
      summary: Soft-delete a resource unit
      responses:
        '204':
          description: Unit soft-deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    AxismlUserHeader:
      type: apiKey
      in: header
      name: X-Axisml-User
      description: |
        Identity of the calling end-user, injected by the AxisML Platform
        after authenticating the upstream request. Persisted in audit fields.
        Cluster Manager does NOT perform role-level authorization — that is
        the Platform's responsibility. Health probes (`/healthz`, `/readyz`)
        are exempt.

  parameters:
    PoolName:
      in: path
      name: pool
      required: true
      description: Resource pool name (DNS-1123, 3–40 chars).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    UnitName:
      in: path
      name: unit
      required: true
      description: Resource unit name (DNS-1123, 3–40 chars).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    LabelSelector:
      in: query
      name: labelSelector
      required: false
      description: |
        K8s-style label selector. Comma-separated AND of one or more terms:
        `key=value` / `key==value` / `key!=value` / `key in (a,b)` /
        `key notin (a,b)` / `key` (existence) / `!key` (absence).
      schema:
        type: string

    Limit:
      in: query
      name: limit
      required: false
      description: Maximum number of items returned in a single page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Continue:
      in: query
      name: continue
      required: false
      description: Opaque continuation token from a previous page.
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request (malformed body or query)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Caller identity (`X-Axisml-User`) missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Caller is not allowed to perform this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict with current state (e.g. duplicate name, in-use)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Request was syntactically valid but violates an invariant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        details:
          type: object
          description: Optional per-dependency notes when `status=degraded`.
          additionalProperties:
            type: string

    Problem:
      type: object
      description: RFC 7807 problem+json error envelope.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
            required: [field, message]
      required: [title, status]

    Quantity:
      type: string
      description: |
        Kubernetes resource.Quantity string (e.g. `100m`, `1`, `64Gi`, `1Mi`).
      example: 100m

    ResourceList:
      type: object
      description: |
        Map of Kubernetes resource name to Quantity, mirroring K8s
        `corev1.ResourceList`. Common keys are `cpu`, `memory`,
        `ephemeral-storage`, `nvidia.com/gpu`, etc.
      additionalProperties:
        $ref: '#/components/schemas/Quantity'
      example:
        cpu: "8"
        memory: 64Gi
        nvidia.com/gpu: "1"

    NodeSelector:
      type: object
      description: Map of node label key to value (K8s `nodeSelector` shape).
      additionalProperties:
        type: string

    Toleration:
      type: object
      description: |
        Kubernetes core/v1 Toleration. See
        https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/.
      properties:
        key:
          type: string
        operator:
          type: string
          enum: [Equal, Exists]
        value:
          type: string
        effect:
          type: string
          enum: [NoSchedule, PreferNoSchedule, NoExecute]
        tolerationSeconds:
          type: integer
          format: int64

    StringMap:
      type: object
      description: Flat string→string map; used for `labels` / `annotations` (see `database.md §1.6`).
      additionalProperties:
        type: string

    # ────────────────── ResourcePool ──────────────────
    ResourcePool:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 3
          maxLength: 40
        description:
          type: string
        nodeSelector:
          $ref: '#/components/schemas/NodeSelector'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, name, nodeSelector, tolerations, createdAt, updatedAt]

    ResourcePoolCreateRequest:
      type: object
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 3
          maxLength: 40
        description:
          type: string
        nodeSelector:
          $ref: '#/components/schemas/NodeSelector'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
      required: [name]

    ResourcePoolPatchRequest:
      type: object
      description: All fields optional; absent fields are left unchanged. `name` is immutable.
      properties:
        description:
          type: string
        nodeSelector:
          $ref: '#/components/schemas/NodeSelector'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ResourcePoolList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePool'
        count:
          type: integer
          minimum: 0
          description: Number of items in this page.
        continueToken:
          type: string
          description: Opaque token; pass back as `continue` to fetch the next page. Absent on the last page.
      required: [items, count]

    # ────────────────── ResourceUnit ──────────────────
    ResourceUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poolId:
          type: string
          format: uuid
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 3
          maxLength: 40
        description:
          type: string
        requests:
          $ref: '#/components/schemas/ResourceList'
        limits:
          $ref: '#/components/schemas/ResourceList'
        nodeSelector:
          $ref: '#/components/schemas/NodeSelector'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, poolId, name, requests, limits, nodeSelector, createdAt, updatedAt]

    ResourceUnitCreateRequest:
      type: object
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 3
          maxLength: 40
        description:
          type: string
        requests:
          $ref: '#/components/schemas/ResourceList'
        limits:
          $ref: '#/components/schemas/ResourceList'
        nodeSelector:
          $ref: '#/components/schemas/NodeSelector'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
      required: [name, requests]

    ResourceUnitPatchRequest:
      type: object
      description: All fields optional; absent fields are left unchanged. `pool` / `name` are immutable.
      properties:
        description:
          type: string
        requests:
          $ref: '#/components/schemas/ResourceList'
        limits:
          $ref: '#/components/schemas/ResourceList'
        nodeSelector:
          $ref: '#/components/schemas/NodeSelector'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ResourceUnitList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUnit'
        count:
          type: integer
          minimum: 0
          description: Number of items in this page.
        continueToken:
          type: string
          description: Opaque token; pass back as `continue` to fetch the next page. Absent on the last page.
      required: [items, count]
