openapi: 3.0.3

info:
  title: AxisML Artifact Hub API
  version: v1
  description: |
    Namespace-partitioned artifact registry for AxisML. Artifacts are addressed
    by the immutable tuple `(namespace, kind, name, version)`; the tuple is
    never reused (even after soft delete) to keep cross-component references
    stable. Writes follow a two-phase protocol: `initiate` (create an
    `Uploading` row and hand back short-lived upload credentials), then
    `complete` (server HEADs the storage backend and transitions the row to
    `Ready`). Consumers (operators, axisml-cli) call `resolve` to obtain the
    storage URI / digest / auth hint for fetching artifact bytes; bytes never
    flow through this service.

    Callers are AxisML Platform (on behalf of axisml-cli and the UI) and the
    in-cluster Operators. Authentication and namespace authorization are
    performed by Platform; this service treats `namespace` as an opaque
    partition key.

servers:
  - url: http://axisml-artifact-hub.axisml-system.svc.cluster.local:8082
    description: In-cluster ClusterIP service

tags:
  - name: Artifacts
    description: Artifact lifecycle (initiate / complete / resolve / list / get / delete)
  - name: Health
    description: Liveness and readiness probes

security:
  - AxismlUserHeader: []

paths:

  # ----- Health probes (no auth) --------------------------------------------
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 while the process is alive. Does not check PG.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns 200 when the service can serve traffic. Checks PostgreSQL
        connectivity. GC worker readiness is not part of this probe.
      operationId: readyz
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Not ready (e.g. PG unreachable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ----- Artifact lifecycle -------------------------------------------------

  /api/v1/namespaces/{namespace}/{kindPlural}:
    parameters:
      - $ref: '#/components/parameters/KindPluralPath'
      - $ref: '#/components/parameters/Namespace'
    get:
      tags: [Artifacts]
      summary: List all (name, version) tuples for a namespace + kind
      description: |
        Returns every artifact row in `(kind, namespace)`. Filterable by
        artifact name prefix and status. Pagination via opaque `continue`
        token.
      operationId: listArtifactsByKind
      parameters:
        - in: query
          name: name
          description: Filter by exact artifact name.
          required: false
          schema:
            $ref: '#/components/schemas/ArtifactName'
        - in: query
          name: status
          description: Filter by artifact status.
          required: false
          schema:
            $ref: '#/components/schemas/ArtifactStatus'
        - in: query
          name: labelSelector
          description: |
            K8s-style label selector. Comma-separated AND of one or more terms:
            `key=value` / `key==value` / `key!=value` / `key in (a,b)` /
            `key notin (a,b)` / `key` (existence) / `!key` (absence).
            Common keys include `axisml.io/project`, `axisml.io/experiment`.
          required: false
          schema:
            type: string
        - in: query
          name: limit
          description: Maximum number of items to return (1-200). Default 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: continue
          description: Opaque pagination cursor returned by a prior response.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of artifacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/namespaces/{namespace}/{kindPlural}/{name}:
    parameters:
      - $ref: '#/components/parameters/KindPluralPath'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/NamePath'
    get:
      tags: [Artifacts]
      summary: List versions of a single artifact name
      description: List every version under the `(namespace, kind, name)` triple.
      operationId: listArtifactVersions
      parameters:
        - in: query
          name: status
          description: Filter by artifact status.
          required: false
          schema:
            $ref: '#/components/schemas/ArtifactStatus'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: continue
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Artifacts]
      summary: Initiate a new artifact version (phase 1 of two-phase write)
      description: |
        Validates the `(namespace, kind, name, version)` tuple is fresh
        (never used before, even by a deleted row), validates the Kind-specific
        `spec`, inserts a new row in status `Uploading`, and returns short-lived
        upload credentials so the client can push bytes directly to the
        storage backend (zot for OCI Kinds, RustFS for S3 Kinds).

        After uploading, the client must call `/complete` with the
        backend-reported digest to transition the row to `Ready`.

        Re-initiating the same tuple returns 409 unless the existing row is
        `Uploading` and not yet expired, in which case the original
        credentials are returned (idempotent).
      operationId: initiateArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactInitiateRequest'
      responses:
        '201':
          description: Artifact row created in `Uploading`; upload credentials returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactInitiateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The `(namespace, kind, name, version)` tuple is already in use
            (any non-Uploading status, or an unexpired Uploading row with
            different content).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Spec failed Kind-specific validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/namespaces/{namespace}/{kindPlural}/{name}/{version}:
    parameters:
      - $ref: '#/components/parameters/KindPluralPath'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/VersionPath'
    get:
      tags: [Artifacts]
      summary: Get a single artifact version
      description: Returns the full Artifact DTO.
      operationId: getArtifact
      responses:
        '200':
          description: Artifact view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Artifacts]
      summary: Update mutable display metadata
      description: |
        Updates the mutable subset of an artifact row: `displayName`,
        `description`, `labels`, `annotations`. All other fields are
        immutable post-create (`name` / `version` / `kind` / `namespace` /
        `owner`) or frozen on transition to `Ready` (`spec` / `digest`).

        Body uses partial-replace semantics on the four supported keys: a
        key absent from the body is left untouched; a key present replaces
        the whole value (no per-entry deep merge inside `labels` /
        `annotations`).

        Allowed in any non-terminal state (`Uploading`, `Ready`, `Failed`);
        rejected for `Deleting` / `Deleted` with `409 ArtifactTerminal`.
        Submitting an immutable field returns `400 ImmutableField` with the
        offending path. PATCH is a PG-only mutation: it does not touch the
        storage backend and does not affect `updatedAt` ordering for GC.
      operationId: updateArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpdateRequest'
      responses:
        '200':
          description: Artifact updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Artifact is in a terminal state (`Deleting` / `Deleted`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Artifacts]
      summary: Delete an artifact version (soft delete + async backend GC)
      description: |
        Transitions the row to `Deleting`; the GC worker asynchronously
        removes the backend blob and finally sets `Deleted`. The
        `(namespace, kind, name, version)` tuple is **never reused** after
        deletion. Idempotent: deleting an already-`Deleting`/`Deleted` row
        returns 200.
      operationId: deleteArtifact
      responses:
        '200':
          description: Delete accepted; row moved to `Deleting` (or already terminal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/namespaces/{namespace}/{kindPlural}/{name}/{version}/complete:
    parameters:
      - $ref: '#/components/parameters/KindPluralPath'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/VersionPath'
    post:
      tags: [Artifacts]
      summary: Complete an upload (phase 2 of two-phase write)
      description: |
        Client submits the digest reported by the storage backend (OCI manifest
        digest for OCI Kinds; canonical-JSON SHA256 of `artifact-manifest.json`
        for S3 Kinds). The server independently HEADs/GETs the backend to
        confirm presence and digest equality; on success the row transitions
        to `Ready`, `digest` is locked in, and `readyAt` is stamped.

        Re-calling complete on an already-`Ready` row with the same digest
        returns 200; mismatched digest returns 409 with `DigestMismatch`.
      operationId: completeArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCompleteRequest'
      responses:
        '200':
          description: Artifact transitioned to `Ready` (or was already Ready with the same digest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Digest mismatch, status not `Uploading`, or backend-reported
            digest disagrees with prior `Ready` row.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Backend manifest missing or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/namespaces/{namespace}/{kindPlural}/{name}/{version}/resolve:
    parameters:
      - $ref: '#/components/parameters/KindPluralPath'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/VersionPath'
    get:
      tags: [Artifacts]
      summary: Resolve an artifact reference to a storage URI
      description: |
        Returns the storage URI, content digest (if `Ready`), and an
        auth hint or short-lived pull credentials depending on `usage`.

        * `usage=inspect` (default) is for in-cluster operators (mljob /
          mlservice handlers). Returns `authHint` pointing at a tenant-local
          Secret that the workload namespace already carries (provisioned by
          tenant-operator). No plaintext credentials are returned.
        * `usage=download` is for `axisml-cli pull` and similar
          end-user flows. Returns short-lived pull credentials (OCI bearer
          token or S3 STS) that allow direct GETs against the backend.

        Returns 410 Gone when the artifact has been soft-deleted; because
        tuples are never reused, 410 is permanent.
      operationId: resolveArtifact
      parameters:
        - in: query
          name: usage
          description: Consumer profile. Defaults to `inspect`.
          required: false
          schema:
            type: string
            enum: [inspect, download]
            default: inspect
        - in: query
          name: workloadNamespace
          description: |
            Workload namespace from which `authHint.secretRef` should be
            resolved. Required for `usage=inspect`. Platform supplies the
            mapping between the artifact namespace and the workload
            namespace; Artifacts does not look it up.
          required: false
          schema:
            $ref: '#/components/schemas/Namespace'
        - in: query
          name: secretPrefix
          description: |
            Optional Secret-name prefix that overrides the default tenant
            Secret naming convention used to build `authHint.secretRef.name`.
          required: false
          schema:
            type: string
            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
            maxLength: 63
      responses:
        '200':
          description: Resolved reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:

  # ----- Security ----------------------------------------------------------
  securitySchemes:
    AxismlUserHeader:
      type: apiKey
      in: header
      name: X-Axisml-User
      description: |
        Caller identity, injected by AxisML Platform / Gateway upstream.
        Artifacts does not authenticate the value; it is used for audit
        (`owner`) and ownership stamping. Operators connecting directly
        carry the controller service identity. Health endpoints are exempt.

  # ----- Reusable parameters ----------------------------------------------
  parameters:
    Namespace:
      in: path
      name: namespace
      required: true
      description: DNS-1123 namespace (bare partition key).
      schema:
        $ref: '#/components/schemas/Namespace'
    KindPluralPath:
      in: path
      name: kindPlural
      required: true
      description: |
        URL-path plural form of artifact kind. Stable mapping:
        `model` ↔ `models`, `dataset` ↔ `datasets`, `image` ↔ `images`.
      schema:
        $ref: '#/components/schemas/ArtifactKindPlural'
    NamePath:
      in: path
      name: name
      required: true
      description: Artifact name (OCI-repo-safe).
      schema:
        $ref: '#/components/schemas/ArtifactName'
    VersionPath:
      in: path
      name: version
      required: true
      description: Artifact version (OCI-tag-safe).
      schema:
        $ref: '#/components/schemas/ArtifactVersion'

  # ----- Reusable responses -----------------------------------------------
  responses:
    BadRequest:
      description: Malformed request (invalid path, body, or query).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid `X-Axisml-User`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Caller is not allowed to access this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict (tuple in use, state machine, digest mismatch).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Artifact has been deleted; tuples are never reused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Spec failed Kind-specific validation or backend manifest missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  # ----- Schemas ----------------------------------------------------------
  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        details:
          type: object
          description: Optional per-dependency notes when `status=degraded`.
          additionalProperties:
            type: string

    # --- Primitive / shared ---
    Namespace:
      type: string
      description: |
        Tenant identifier (= compute `tenants.name`). Used as the artifact
        partition key. Artifacts treats it as an opaque string; tenant
        existence is not validated here.
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      minLength: 3
      maxLength: 40
      example: team-a

    ArtifactName:
      type: string
      description: |
        OCI-repository-safe charset: lower-case alphanumerics with `-`, `_`,
        `.`. Must be DNS-1123 compatible.
      pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
      minLength: 1
      maxLength: 128
      example: llama-7b

    ArtifactVersion:
      type: string
      description: |
        OCI tag-safe subset (no `/`). Safe to map to OCI tags and S3 prefixes.
      pattern: '^[A-Za-z0-9_.-]{1,128}$'
      minLength: 1
      maxLength: 128
      example: v3

    ArtifactKind:
      type: string
      description: Artifact kind (registered ArtifactHandler key).
      enum: [model, dataset, image]

    ArtifactKindPlural:
      type: string
      description: |
        URL-path plural form of `ArtifactKind`. Stable mapping:
        `model` ↔ `models`, `dataset` ↔ `datasets`, `image` ↔ `images`.
        Used only as a path segment; DTO `kind` field carries the singular form.
      enum: [models, datasets, images]

    ArtifactStatus:
      type: string
      description: Artifact lifecycle state.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    StringMap:
      type: object
      description: String-keyed string map (labels / annotations).
      additionalProperties:
        type: string

    Digest:
      type: string
      description: |
        Content digest of the artifact bytes. Written by `complete` after
        backend HEAD verification. Empty until the row reaches `Ready`.
        OCI: manifest digest (e.g. `sha256:...`). S3: canonical-JSON SHA256
        of `artifact-manifest.json`.
      pattern: '^[a-z0-9]+:[A-Fa-f0-9]{16,128}$'
      example: 'sha256:9b74c9897bac770ffc029102a200c5de3a8aaae9b54a5c98a3e3a3a3e3a3e3a3'

    # --- Kind-specific specs ---
    ModelSpec:
      type: object
      description: |
        Spec for `kind=model`. Stored as the `spec` JSONB column; frozen once
        the artifact reaches `Ready`.
      required: [framework, format]
      properties:
        framework:
          type: string
          enum: [pytorch, tensorflow, onnx, safetensors, gguf, custom]
        format:
          type: string
          description: OCI artifact media type carried by the manifest's `artifactType`.
          example: application/vnd.axisml.model.safetensors.v1+json
        task:
          type: string
          description: Free-form task descriptor (e.g. `text-generation`, `image-classification`).
        parameters:
          type: number
          format: double
          minimum: 0
          description: Parameter count (e.g. 7e9 for 7B).

    DatasetSpec:
      type: object
      description: Spec for `kind=dataset`. Stored on S3 (RustFS).
      required: [format]
      properties:
        format:
          type: string
          enum: [parquet, jsonl, csv, webdataset, tfrecord, custom]
        schema:
          type: object
          description: Free-form schema descriptor (column names, types, etc.).
          additionalProperties: true
        numRecords:
          type: integer
          format: int64
          minimum: 0
        totalSize:
          type: integer
          format: int64
          minimum: 0
          description: Total dataset size in bytes (informational).
        license:
          type: string
        splits:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                example: train
              numRecords:
                type: integer
                format: int64
                minimum: 0
              uri:
                type: string
                description: Optional sub-prefix or file path inside the artifact root.

    ImageSpec:
      type: object
      description: Spec for `kind=image`. Stored as OCI image manifests in zot.
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [training, inference, dev]
        baseImage:
          type: string
          description: Base image reference (free form, informational).
          example: nvcr.io/nvidia/pytorch:24.05-py3
        platforms:
          type: array
          description: OCI platforms covered by the manifest list (e.g. `linux/amd64`).
          items:
            type: string
            example: linux/amd64
        entrypoint:
          type: array
          items:
            type: string
        notes:
          type: string

    ArtifactSpec:
      description: |
        Kind-specific spec. The runtime shape matches one of `ModelSpec`,
        `DatasetSpec`, or `ImageSpec`; clients must pick the shape consistent
        with the outer `kind` field of the artifact.

        OpenAPI 3.0 discriminators on `oneOf` require the discriminator to
        live inside each branch; here the discriminator lives on the parent
        Artifact's `kind` field. Consumers should branch on `kind` to decode
        `spec`.
      oneOf:
        - $ref: '#/components/schemas/ModelSpec'
        - $ref: '#/components/schemas/DatasetSpec'
        - $ref: '#/components/schemas/ImageSpec'

    # --- Artifact DTO (matches database.md §4.1) ---
    Artifact:
      type: object
      description: |
        Full Artifact view. Matches the `artifacts` PG table schema
        (database.md §4.1). The `(namespace, kind, name, version)` tuple is
        immutable once created and is never reused even after delete.
        `spec` is frozen once `status=Ready`. `displayName`, `description`,
        `labels`, and `annotations` are mutable in any state (no PATCH
        endpoint is exposed in v1 — use a new version to change spec).
      required:
        - id
        - namespace
        - kind
        - name
        - version
        - labels
        - annotations
        - spec
        - status
        - createdAt
        - updatedAt
      properties:
        # metadata
        id:
          type: string
          format: uuid
          description: Server-assigned primary key.
        namespace:
          $ref: '#/components/schemas/Namespace'
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        name:
          $ref: '#/components/schemas/ArtifactName'
        version:
          $ref: '#/components/schemas/ArtifactVersion'
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          description: Version-specific description / changelog.
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        owner:
          type: string
          description: User from `X-Axisml-User` at create time. Immutable.
        # spec
        spec:
          $ref: '#/components/schemas/ArtifactSpec'
        # observed
        status:
          $ref: '#/components/schemas/ArtifactStatus'
        message:
          type: string
          description: Human-readable status message (Failed reason, etc.).
        digest:
          $ref: '#/components/schemas/Digest'
        readyAt:
          type: string
          format: date-time
          description: Timestamp when the artifact transitioned to `Ready`.
        # timestamps
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          description: Soft-delete timestamp; set when the row enters `Deleting`.

    ArtifactList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        count:
          type: integer
          minimum: 0
          description: Number of items in this page.
        continueToken:
          type: string
          description: |
            Opaque cursor; pass back as `continue` query param to fetch the
            next page. Absent on the last page.

    # --- Initiate / Complete / Upload ---
    ArtifactInitiateRequest:
      type: object
      description: |
        Body for `POST /api/v1/namespaces/{ns}/{kindPlural}/{name}`.
        The `kind` (derived from `kindPlural`) and `name` come from the path;
        the caller specifies the `version` and the Kind-specific `spec`.
      required: [version, spec]
      properties:
        version:
          $ref: '#/components/schemas/ArtifactVersion'
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/ArtifactSpec'

    ArtifactInitiateResponse:
      type: object
      required: [artifact, upload]
      properties:
        artifact:
          $ref: '#/components/schemas/Artifact'
        upload:
          $ref: '#/components/schemas/UploadCredentials'

    UploadCredentials:
      description: |
        Short-lived credentials the client uses to push artifact bytes
        directly to the storage backend. `kind=oci` for OCI Distribution
        backends (zot); `kind=s3` for prefix-scoped S3 STS against RustFS.
      oneOf:
        - $ref: '#/components/schemas/OciUploadCredentials'
        - $ref: '#/components/schemas/S3UploadCredentials'
      discriminator:
        propertyName: kind
        mapping:
          oci: '#/components/schemas/OciUploadCredentials'
          s3: '#/components/schemas/S3UploadCredentials'

    OciUploadCredentials:
      type: object
      required: [kind, registry, repository, scope, token, expiresAt]
      properties:
        kind:
          type: string
          enum: [oci]
        registry:
          type: string
          description: OCI registry host (e.g. `zot.axisml-infra.svc:5000`).
        repository:
          type: string
          description: |
            Fully-qualified OCI repository, e.g.
            `namespaces/<ns>/models/<name>`.
        scope:
          type: string
          description: |
            OAuth2 scope string for the bearer token, e.g.
            `repository:namespaces/<ns>/models/<name>:push,pull`.
        token:
          type: string
          description: "Bearer token to send as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time

    S3UploadCredentials:
      type: object
      required:
        - kind
        - bucket
        - prefix
        - accessKeyId
        - secretAccessKey
        - sessionToken
        - region
        - endpoint
        - expiresAt
      properties:
        kind:
          type: string
          enum: [s3]
        bucket:
          type: string
          example: axisml-artifact-hub
        prefix:
          type: string
          description: |
            Object-key prefix the STS is scoped to (writes outside this
            prefix will be denied), e.g.
            `namespaces/<ns>/datasets/<name>/<version>/`.
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        sessionToken:
          type: string
        region:
          type: string
          example: us-east-1
        endpoint:
          type: string
          description: S3 endpoint URL (RustFS).
          example: http://rustfs.axisml-infra.svc:9000
        expiresAt:
          type: string
          format: date-time

    ArtifactUpdateRequest:
      type: object
      description: |
        Body for `PATCH /api/v1/namespaces/{ns}/{kindPlural}/{name}/{version}`.
        Partial-replace semantics on the four supported keys. Omitting a key
        leaves the stored value untouched; setting a key to `{}` clears
        `labels` / `annotations`. Submitting any other field returns
        `400 ImmutableField`.
      properties:
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ArtifactCompleteRequest:
      type: object
      description: |
        Body for `POST /api/v1/namespaces/{ns}/{kindPlural}/{name}/{version}/complete`.
        The client submits the digest reported by the storage backend; the
        server independently HEADs the backend to verify.
      required: [digest]
      properties:
        digest:
          $ref: '#/components/schemas/Digest'
        claim:
          type: object
          description: |
            Optional Kind-specific completion claim (e.g. OCI manifest size,
            S3 manifest summary). Interpreted by the matching ArtifactHandler.
          additionalProperties: true

    # --- Resolve ---
    ResolveResponse:
      type: object
      description: |
        Resolved storage reference. `uri` is always present. `digest` is
        present once the artifact is `Ready`. Exactly one of `authHint` or
        `pullCredentials` is populated depending on `usage`.
      required: [uri, storageKind]
      properties:
        storageKind:
          type: string
          enum: [oci, s3]
          description: Backend storage class, derived from the artifact `kind`.
        uri:
          type: string
          description: |
            Backend URI. OCI:
            `<oci-host>/namespaces/<ns>/<kind-prefix>/<name>:<version>`
            (or `...@sha256:<digest>` when pinning). S3:
            `s3://<bucket>/namespaces/<ns>/<kind-prefix>/<name>/<version>/`.
          example: zot.axisml-infra.svc:5000/namespaces/team-a/models/llama-7b:v3
        digest:
          $ref: '#/components/schemas/Digest'
        authHint:
          $ref: '#/components/schemas/AuthHint'
        pullCredentials:
          description: |
            Short-lived pull credentials for `usage=download`. Same shape as
            `UploadCredentials` but with read-only scopes (OCI `pull` scope /
            S3 read-only STS).
          oneOf:
            - $ref: '#/components/schemas/OciUploadCredentials'
            - $ref: '#/components/schemas/S3UploadCredentials'
          discriminator:
            propertyName: kind
            mapping:
              oci: '#/components/schemas/OciUploadCredentials'
              s3: '#/components/schemas/S3UploadCredentials'

    AuthHint:
      type: object
      description: |
        Pointer to a tenant-local Secret that the workload namespace already
        carries (provisioned by tenant-operator from `Tenant.spec.initResources`,
        see tenant-operator.md §4.6). Artifacts never returns plaintext
        credentials on the `inspect` path and does not verify that the Secret
        exists; the consumer is responsible for reading it.
      required: [kind, secretRef]
      properties:
        kind:
          type: string
          enum: [oci, s3]
        secretRef:
          type: object
          required: [namespace, name]
          properties:
            namespace:
              $ref: '#/components/schemas/Namespace'
            name:
              type: string
              description: |
                Tenant-local Secret name, rendered from a Platform-supplied
                template (default `axisml-tenant-<tenant>-zot-pull` for OCI
                and `axisml-tenant-<tenant>-rustfs` for S3).
              pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
              maxLength: 253
            usernameKey:
              type: string
              description: Secret data key carrying the username (OCI).
            passwordKey:
              type: string
              description: Secret data key carrying the password / token (OCI).
        scope:
          type: string
          description: Optional capability scope string (e.g. OCI `pull`).

    # --- RFC 7807 Problem Details ---
    Problem:
      type: object
      description: RFC 7807 problem details document.
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: |
            Stable machine-readable error code (e.g. `AlreadyExists`,
            `DigestMismatch`, `SpecFrozen`, `NotInRegistry`, `BackendUnavailable`).
        errors:
          type: array
          description: Optional list of field-level validation errors.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
