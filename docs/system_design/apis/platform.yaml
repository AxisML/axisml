components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by Platform itself on `POST /api/v1/auth/login` or
        `POST /api/v1/auth/refresh`. The `aud` claim is `axisml-platform`
        for ordinary API access; the workspace / service access endpoints
        issue separate JWTs with `aud=axisml-workspace` / `aud=axisml-inference`
        intended for the data-plane (network gateway), not this API.

  parameters:
    ActiveTenantHeader:
      name: X-Axisml-Tenant
      in: header
      required: true
      description: |
        Active tenant for this request. See `info.description` ("Active
        tenant"). Required on tenant-implicit list/create/name-keyed-detail
        endpoints; if absent, non-admin callers receive
        `400 active-tenant-required` and `system-admin` falls back to
        cross-tenant behavior on list endpoints only.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    ActiveTenantHeaderOptional:
      name: X-Axisml-Tenant
      in: header
      required: false
      description: |
        Optional active-tenant override. On UUID-keyed detail endpoints the
        UUID is self-sufficient; this header is only used as a consistency
        cross-check. On list endpoints it scopes the query; if omitted,
        `system-admin` receives the cross-tenant view and non-admins receive
        `400 active-tenant-required`.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    Limit:
      name: limit
      in: query
      description: Page size (default 50, max 200).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Continue:
      name: continue
      in: query
      description: Opaque continue token from the previous response.
      required: false
      schema:
        type: string

    TenantName:
      name: name
      in: path
      required: true
      description: Tenant name (DNS-1123, immutable).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    TenantPathParam:
      name: tenant
      in: path
      required: true
      description: Tenant name (DNS-1123, immutable).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    QuotaPoolPathParam:
      name: pool
      in: path
      required: true
      description: ResourcePool name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    QuotaNamePathParam:
      name: quotaName
      in: path
      required: true
      description: Quota name (unique within `(tenant, pool)`).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    UserId:
      name: id
      in: path
      required: true
      description: Platform user id.
      schema:
        type: string
        format: uuid

    MemberUserId:
      name: userId
      in: path
      required: true
      description: Platform user id of the member.
      schema:
        type: string
        format: uuid

    WorkspaceId:
      name: id
      in: path
      required: true
      description: Compute `services.id` of the workspace (uuid).
      schema:
        type: string
        format: uuid

    ServiceId:
      name: id
      in: path
      required: true
      description: Compute `services.id` of the service (uuid).
      schema:
        type: string
        format: uuid

    JobName:
      name: name
      in: path
      required: true
      description: Job name (DNS-1123, unique within the tenant namespace).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    ArtifactName:
      name: name
      in: path
      required: true
      description: |
        Artifact name (OCI-repo-safe). Combined with `{tenant}` + `{version}`
        forms the immutable addressing tuple consumed by the downstream
        artifacts service.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
        minLength: 1
        maxLength: 128

    ArtifactVersion:
      name: version
      in: path
      required: true
      description: |
        Artifact version (OCI tag-safe). Immutable; never reused even after
        soft-delete.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{1,128}$'
        minLength: 1
        maxLength: 128

    PoolName:
      name: pool
      in: path
      required: true
      description: ResourcePool name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    UnitName:
      name: unit
      in: path
      required: true
      description: ResourceUnit name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    PodName:
      name: pod
      in: path
      required: true
      description: Pod name (the canonical K8s pod identity, as listed by `/pods`).
      schema:
        type: string
        minLength: 1
        maxLength: 253

    LogContainer:
      name: container
      in: query
      required: false
      schema:
        type: string

    LogTailLines:
      name: tailLines
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1000

    LogFollow:
      name: follow
      in: query
      required: false
      description: Stream logs as SSE.
      schema:
        type: boolean
        default: false

    LogPrevious:
      name: previous
      in: query
      required: false
      description: Read logs from the previous (crashed) container instance.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Malformed request (invalid syntax, missing required fields, immutable field, etc.).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer JWT.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but insufficient role for the requested operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        Resource not found, OR the caller cannot see it. Platform deliberately
        conflates these for non-admins to avoid information leak.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Conflicts with a precondition: duplicate name, last-tenant-admin
        protection, in-use blocker, immutable transition, etc.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Semantically invalid request (e.g., cross-field violations).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Target resource (e.g., a Pod log) is no longer retained.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Upstream service (cluster-manager / compute / artifacts / Prometheus) failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: Endpoint is reserved but not yet implemented (e.g., MVP placeholder).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------------
    # Common
    # ------------------------------------------------------------------

    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: Canonical error type URI.
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Short machine-readable error code (e.g., `immutable-field`, `last-tenant-admin`, `pool-in-use`).
        errors:
          type: array
          description: Field-level validation issues, when applicable.
          items:
            $ref: '#/components/schemas/ProblemFieldError'

    ProblemFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        components:
          type: object
          additionalProperties:
            type: string
          description: |
            Per-dependency status keyed by name (`db`, `clusterManager`,
            `compute`, `artifacts`, `prometheus`).

    StringMap:
      type: object
      additionalProperties:
        type: string

    ResourceMap:
      type: object
      description: |
        Kubernetes-style resource quantity map (e.g., `{ "cpu": "100",
        "memory": "1Ti", "nvidia.com/gpu": "8" }`).
      additionalProperties:
        type: string

    EnvVar:
      type: object
      required: [name]
      properties:
        name:
          type: string
        value:
          type: string
        valueFrom:
          type: object
          additionalProperties: true
          description: |
            Optional Kubernetes-style `valueFrom` selector (`configMapKeyRef`,
            `secretKeyRef`, ...). Passed through to compute.

    Condition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
        status:
          type: string
          enum: ["True", "False", "Unknown"]
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time

    Toleration:
      type: object
      additionalProperties: true
      description: Mirrors a Kubernetes `corev1.Toleration`.

    # ------------------------------------------------------------------
    # Auth / Users
    # ------------------------------------------------------------------

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password

    LoginResponse:
      type: object
      required: [jwt, user, tenantRoles]
      properties:
        jwt:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        tenantRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserTenantRole'

    RefreshResponse:
      type: object
      required: [jwt]
      properties:
        jwt:
          type: string
        expiresAt:
          type: string
          format: date-time

    UserTenantRole:
      type: object
      required: [tenantName, roleName]
      properties:
        tenantName:
          type: string
        roleName:
          $ref: '#/components/schemas/RoleName'

    RoleName:
      type: string
      enum:
        - system-admin
        - tenant-admin
        - user

    MeResponse:
      type: object
      required: [user, tenantRoles, permissions, isSystemAdmin]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenantRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserTenantRole'
        permissions:
          type: array
          description: Flat list of permission strings resolved from role bindings.
          items:
            type: string
        isSystemAdmin:
          type: boolean

    User:
      type: object
      required: [id, username, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        disabled:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email

    UserSummaryList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    UserPatchRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        disabled:
          type: boolean

    SetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: Required for self-change; omitted by system-admin reset.
        newPassword:
          type: string
          minLength: 8
          format: password

    # ------------------------------------------------------------------
    # Tenants
    # ------------------------------------------------------------------

    TenantPhase:
      type: string
      enum: [Pending, Active, Suspended, Failed, Deleting, Deleted]

    Quota:
      type: object
      required: [pool, name, max]
      properties:
        pool:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        min:
          $ref: '#/components/schemas/ResourceMap'
        max:
          $ref: '#/components/schemas/ResourceMap'

    QuotaStatus:
      type: object
      required: [pool, name]
      properties:
        pool:
          type: string
        name:
          type: string
        used:
          $ref: '#/components/schemas/ResourceMap'
        elasticQuotaName:
          type: string
          description: |
            Rendered ElasticQuota CR name, e.g.,
            `axisml-<tenant>-<pool>-<quota>`.

    QuotaList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quota'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/QuotaStatus'
        count:
          type: integer
          minimum: 0

    QuotaCreateRequest:
      type: object
      required: [pool, name, max]
      properties:
        pool:
          type: string
        name:
          type: string
        min:
          $ref: '#/components/schemas/ResourceMap'
        max:
          $ref: '#/components/schemas/ResourceMap'

    QuotaPatchRequest:
      type: object
      description: Only `min` / `max` may be patched.
      properties:
        min:
          $ref: '#/components/schemas/ResourceMap'
        max:
          $ref: '#/components/schemas/ResourceMap'

    Namespace:
      type: object
      description: Tenant-owned Kubernetes Namespace declaration.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    SecretSourceRef:
      type: object
      required: [namespace, name]
      properties:
        namespace:
          type: string
        name:
          type: string

    ConfigMapSourceRef:
      type: object
      required: [namespace, name]
      properties:
        namespace:
          type: string
        name:
          type: string

    ImagePullSecretInit:
      type: object
      required: [name, sourceSecretRef]
      properties:
        name:
          type: string
        sourceSecretRef:
          $ref: '#/components/schemas/SecretSourceRef'

    SecretInit:
      type: object
      required: [name, sourceSecretRef]
      properties:
        name:
          type: string
        type:
          type: string
          default: Opaque
        sourceSecretRef:
          $ref: '#/components/schemas/SecretSourceRef'

    ConfigMapInit:
      type: object
      required: [name, sourceConfigMapRef]
      properties:
        name:
          type: string
        sourceConfigMapRef:
          $ref: '#/components/schemas/ConfigMapSourceRef'

    ServiceAccountInit:
      type: object
      required: [name]
      properties:
        name:
          type: string
        imagePullSecrets:
          type: array
          items:
            type: string
        rbac:
          type: object
          additionalProperties: true

    InitResources:
      type: object
      properties:
        imagePullSecrets:
          type: array
          items:
            $ref: '#/components/schemas/ImagePullSecretInit'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretInit'
        configMaps:
          type: array
          items:
            $ref: '#/components/schemas/ConfigMapInit'
        serviceAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountInit'

    Tenant:
      type: object
      description: |
        Platform-facing Tenant DTO. Top-level `namespace` is the
        organizational grouping; the K8s namespace lives at
        `spec.namespace.name`.
      required:
        - name
        - namespace
        - displayName
        - spec
        - phase
        - generation
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
          description: Tenant name; DNS-1123, immutable after creation. URL key.
        namespace:
          type: string
          description: |
            Organizational grouping (e.g. `ai-team`). Mutable. Distinct
            from `spec.namespace.name`.
          maxLength: 100
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
          description: Creator; immutable.
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/TenantSpec'
        generation:
          type: integer
          format: int64
          minimum: 1
        observedGeneration:
          type: integer
          format: int64
          minimum: 0
        phase:
          $ref: '#/components/schemas/TenantPhase'
        status:
          $ref: '#/components/schemas/TenantStatus'
        computeNamespace:
          type: string
          description: |
            Convenience flat copy of `spec.namespace.name`, surfaced so the
            frontend can build downstream Compute calls without re-parsing
            `spec`.
        artifactsNamespace:
          type: string
          description: |
            Same value as `computeNamespace` in the current design; kept as
            a separate field so future deployments can split the two without
            an API break.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    TenantSpec:
      type: object
      required: [namespace]
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: K8s namespace metadata. `name` immutable; `labels` / `annotations` mutable.
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/Quota'
        initResources:
          $ref: '#/components/schemas/InitResources'
        suspended:
          type: boolean
          default: false

    TenantStatus:
      type: object
      description: Status sub-object excluding `phase` (which lives at the top level of `Tenant`).
      properties:
        message:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/QuotaStatus'

    TenantList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    TenantCreateRequest:
      type: object
      required: [name, namespace, displayName, spec]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 3
          maxLength: 40
        namespace:
          type: string
          description: Organizational grouping. Mutable post-create.
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/TenantSpec'

    TenantPatchRequest:
      type: object
      description: |
        JSON Merge Patch body. Mutable Platform fields:
        top-level `namespace` (organizational grouping), `displayName`,
        `description`, `labels`, `annotations`, and the patchable subset of
        `spec.*` (`spec.namespace.labels`, `spec.namespace.annotations`,
        `spec.initResources`, `spec.suspended`, `spec.quotas[]`).
      properties:
        namespace:
          type: string
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          type: object
          properties:
            namespace:
              type: object
              properties:
                labels:
                  $ref: '#/components/schemas/StringMap'
                annotations:
                  $ref: '#/components/schemas/StringMap'
            quotas:
              type: array
              items:
                $ref: '#/components/schemas/Quota'
            initResources:
              $ref: '#/components/schemas/InitResources'
            suspended:
              type: boolean

    # ------------------------------------------------------------------
    # Members
    # ------------------------------------------------------------------

    Member:
      type: object
      required: [userId, username, roleName, addedAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        roleName:
          $ref: '#/components/schemas/RoleName'
        addedAt:
          type: string
          format: date-time

    MemberList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    MemberCreateRequest:
      type: object
      required: [userId, roleName]
      properties:
        userId:
          type: string
          format: uuid
        roleName:
          type: string
          enum: [tenant-admin, user]
          description: |
            `system-admin` cannot be bound through this endpoint; use the
            user management menu.

    MemberPatchRequest:
      type: object
      required: [roleName]
      properties:
        roleName:
          type: string
          enum: [tenant-admin, user]

    # ------------------------------------------------------------------
    # Workspaces
    # ------------------------------------------------------------------

    WorkspacePhase:
      type: string
      description: Derived from compute service phase + replicas. Hoisted to the top of `Workspace` for B-tree filtering.
      enum:
        - Creating
        - Starting
        - Running
        - Degraded
        - Failed
        - Stopped
        - Deleting
        - Deleted
        - Pending

    WorkspaceDesiredState:
      type: string
      enum: [Running, Stopped]

    WorkspaceLifecycle:
      type: object
      description: Workspace lifecycle policy.
      properties:
        idleTimeoutSeconds:
          type: integer
          minimum: 0
          description: |
            Auto-stop after this many seconds of inactivity. Phase-two; MVP
            ignores the value but accepts it for forward compatibility.

    WorkspacePersistentVolume:
      type: object
      description: PVC settings for the `/workspace` mount.
      properties:
        size:
          type: string
          description: Capacity quantity (e.g., `20Gi`).
          default: 20Gi
        storageClassName:
          type: string

    WorkspaceEndpoint:
      type: object
      properties:
        accessUrl:
          type: string
          description: |
            User-facing URL behind Envoy Gateway. Pattern:
            `https://<gateway>/workspaces/<tenant>/<service.name>/`.
        internalDns:
          type: string
          description: In-cluster DNS, e.g., `<service.name>.<ns>.svc.cluster.local:<port>`.

    Workspace:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - owner
        - image
        - containerPort
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Compute `services.id` (uuid).
        namespace:
          type: string
          description: Compute namespace == `Tenant.spec.namespace.name`.
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        computeNamespace:
          type: string
          description: Same as `namespace`; surfaced explicitly for clarity.
        name:
          type: string
          description: |
            MLService CR name (Platform-generated `ws-<crockford32-rand40>`).
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
          description: Username of the creator.
        ownerId:
          type: string
          format: uuid
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        resourcePoolId:
          type: string
          format: uuid
        resourcePoolName:
          type: string
        resourceUnitId:
          type: string
          format: uuid
        resourceUnitName:
