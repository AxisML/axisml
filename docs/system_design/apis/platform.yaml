              type: string
            audience:
              type: string
            jwksUri:
              type: string
        apiKey:
          type: object
          properties:
            secretRef:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                key:
                  type: string

    ServiceRouteRateLimit:
      type: object
