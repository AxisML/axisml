        requestsPerSecond:
          type: integer
          minimum: 1
        burst:
          type: integer
          minimum: 1

    ServiceRoute:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        path:
          type: string
        hostname:
          type: string
        auth:
          $ref: '#/components/schemas/ServiceRouteAuth'
        rateLimit:
          $ref: '#/components/schemas/ServiceRouteRateLimit'
        timeout:
          type: string
          description: ISO 8601 duration (e.g., `30s`).

    ModelRef:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string

    Service:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - owner
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        computeNamespace:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        modelRef:
          $ref: '#/components/schemas/ModelRef'
        backend:
          $ref: '#/components/schemas/Backend'
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        resourcePoolId:
          type: string
          format: uuid
        resourcePoolName:
          type: string
        resourceUnitId:
          type: string
          format: uuid
        resourceUnitName:
          type: string
        quota:
          type: string
        resources:
          $ref: '#/components/schemas/ResourceMap'
        replicas:
          type: integer
          minimum: 0
        readyReplicas:
          type: integer
          minimum: 0
        endpoint:
          type: string
        route:
          $ref: '#/components/schemas/ServiceRoute'
        accessUrl:
          type: string
        phase:
          $ref: '#/components/schemas/ServicePhase'
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    ServiceCreateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required:
        - name
        - modelRef
        - backend
        - image
        - containerPort
        - resourcePoolId
        - resourceUnitId
