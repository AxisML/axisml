openapi: 3.0.3
info:
  title: AxisML Platform API
  version: v1
  description: |
    AxisML Platform is the user-facing entrypoint to the AxisML system. It
    aggregates the three internal services (`cluster-manager`, `compute`,
    `artifacts`) and adds platform-native features: identity, RBAC,
    workspace/job/service orchestration, model artifact registry views, and
    Prometheus-backed dashboards.

    ## Auth model

    Platform sits behind the AxisML Infra Envoy Gateway. The Gateway forwards
    bearer JWTs to Platform; Platform authenticates the user itself (it is the
    issuer of these JWTs) and resolves the caller's identity and RBAC role
    bindings. Unlike the downstream services (`cluster-manager` / `compute` /
    `artifacts`), Platform endpoints do **not** require an `X-Axisml-User`
    header on the inbound side — Platform injects that header on its
    outbound calls to the internal services.

    The `POST /api/v1/auth/login` endpoint is the only authenticated entrypoint
    that does not itself require a bearer JWT; all other endpoints in this
    document require a valid bearer JWT. Per-endpoint role requirements are
    annotated in the operation description (e.g., "Requires `system-admin`",
    "Requires `tenant-admin@self`", "Requires `user@self`+", etc.).

    Persona ↔ RBAC role mapping (see `components/platform.md §2`):

    | Persona | RBAC role | Scope |
    | --- | --- | --- |
    | system admin | `system-admin` | global |
    | tenant admin | `tenant-admin` | single tenant |
    | user | `user` | single tenant |

    `@self` means "in the active tenant" — the tenant referenced by the URL
    path (`/api/v1/tenants/{name}/...` for tenant-management endpoints) **or**
    by the `X-Axisml-Tenant` request header (for all other tenant-scoped
    endpoints). `@owner` means "the resource's `owner` equals the current
    user".

    ## Active tenant (`X-Axisml-Tenant`)

    A single user can hold role bindings in multiple tenants
    (`user_tenant_roles` is many-to-many). For day-to-day, tenant-implicit
    endpoints — `/api/v1/jobs`, `/api/v1/workspaces`, `/api/v1/mlservices`,
    `/api/v1/models`, `/api/v1/images`, `/api/v1/datasets` — the caller
    declares the active tenant via the `X-Axisml-Tenant` request header. The
    frontend's tenant selector is the canonical source; switching tenants
    only updates the header on subsequent requests (no JWT re-issue).

    Server contract:

    - **List endpoints**: scope to `X-Axisml-Tenant` when present. If absent:
      `system-admin` gets the cross-tenant view; non-admins receive
      `400 active-tenant-required`.
    - **Create endpoints**: `X-Axisml-Tenant` is required; otherwise
      `400 active-tenant-required`.
    - **Name-keyed detail endpoints** (e.g., `/api/v1/jobs/{name}`,
      `/api/v1/mlservices/{name}`, `/api/v1/workspaces/{name}`): the header
      disambiguates the name and is required; otherwise
      `400 active-tenant-required`. Mirrors compute-service's
      `(namespace, name)` addressing convention.
    - **Tuple-keyed artifact endpoints**
      (`/api/v1/models/{tenant}/{name}` definitions and their
      `/versions/{version}` sub-resources; image / dataset analogues): the
      tuple already carries the tenant, so the header is ignored. URLs remain
      copy-paste shareable across contexts.
    - **Tenant-management endpoints** (`/api/v1/tenants/{name}/quotas`,
      `/api/v1/tenants/{name}/members`, `/api/v1/tenants/{name}` itself):
      tenant lives in the URL path; the header is ignored.

    If `X-Axisml-Tenant` names a tenant the caller has no binding in (and the
    caller is not `system-admin`), the response is `404 Not Found` — Platform
    deliberately conflates "tenant does not exist" with "tenant exists but
    you can't see it".

    ## Errors

    All non-2xx responses follow RFC 7807 `application/problem+json`. Platform
    deliberately conflates 404 (not found) with insufficient visibility for
    non-admins to avoid leaking the existence of resources the caller cannot
    see.
servers:
  - url: https://gateway.axisml.example.com
    description: Envoy Gateway external host (TLS, JWT auth, rate limiting)
  - url: http://axisml-platform-platform.axisml-platform.svc.cluster.local:8080
    description: In-cluster Service DNS (intra-cluster development)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login, logout, session refresh, and "who am I" endpoints.
  - name: Users
    description: Platform user accounts (the identities used for login).
  - name: Tenants
    description: Tenant lifecycle. Proxies cluster-manager with RBAC.
  - name: Quotas
    description: ElasticQuota sub-resources of a Tenant (per-pool, per-quota).
  - name: Members
    description: Per-tenant user ↔ role bindings.
  - name: Workspaces
    description: Long-running interactive dev containers (jupyter / code-server / ...).
  - name: Jobs
    description: |
      Reusable Job templates (Platform-owned definitions) and their Runs.
      Each Run is a compute `MLRun` named `<job>-<n>`, listed/triggered live.
  - name: MLServices
    description: Long-running online inference services.
  - name: Models
    description: Model definitions (Platform-owned); versions proxy artifacts (`kind=model`).
  - name: Images
    description: Image definitions (Platform-owned); versions proxy artifacts (`kind=image`).
  - name: Datasets
    description: Dataset definitions (Platform-owned); versions proxy artifacts (`kind=dataset`).
  - name: ResourcePools
    description: Cluster-scoped resource pools (admin-only writes; read by all).
  - name: ResourceUnits
    description: Per-pool resource unit specs (admin-only writes; read by all).
  - name: Dashboard
    description: Aggregated overview and Prometheus-backed metrics.
  - name: Audit
    description: Audit log queries (system-admin only).
  - name: Health
    description: Liveness and readiness probes.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 if the process is alive. No authentication required.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Returns 200 only when PostgreSQL connectivity, the cluster-manager
        service, the compute service, and the artifacts service are all
        reachable. Used by the Kubernetes readiness probe.
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ============================================================================
  # Auth
  # ============================================================================

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange username + password for a bearer JWT
      description: |
        Authenticates the user against the internal `users` table (bcrypt) and
        issues a fresh bearer JWT for use on all subsequent requests. Does
        **not** require an existing bearer JWT. Documented at
        `components/platform.md §8`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded; returns JWT and current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current bearer JWT
      description: |
        Writes the current JWT's `jti` claim to the `sessions` blacklist
        table. Subsequent requests carrying the same JWT will be rejected
        with 401. Documented at `components/platform.md §8`.
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user, tenant role bindings, and permissions
      description: |
        Returns the authenticated user's profile, the list of `(tenantName,
        roleName)` bindings from `user_tenant_roles`, and the resolved set of
        permission strings. Used by the frontend to render the menu visibility
        matrix.
      responses:
        '200':
          description: Current user view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh the current bearer JWT
      description: |
        Returns a fresh JWT with the same identity claims but extended `exp`.
        The previous JWT is not revoked (clients should switch over and let
        the old one expire). Documented at `components/platform.md §8`.
      responses:
        '200':
          description: New JWT issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Users
  # ============================================================================

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Search Platform users
      description: |
        Fuzzy-search across `username`, `displayName`, and `email`. Primarily
        used by the "add member" picker on the tenant detail page; returns
        only the minimal set of fields (`id`, `username`, `displayName`,
        `email`). Any authenticated user may call this endpoint. Documented
        at `components/platform.md §7.4`.
      parameters:
        - name: q
          in: query
          description: Fuzzy keyword.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of user summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Users]
      operationId: createUser
      summary: Create a Platform user
      description: |
        Creates a new internal user (bcrypt password hash, `disabled=false`).
        Requires `system-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user by id
      description: |
        Any authenticated user may fetch any other user's basic profile (it is
        already exposed by member lists). For self lookup the `email` field is
        always returned; for others it may be redacted depending on policy.
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user's profile or disabled flag
      description: |
        Self-update is allowed for `displayName` and `email`. `disabled` may
        only be flipped by `system-admin`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete (or disable) a user
      description: |
        Soft-deletes the user record and cascades cleanup of their
        `user_tenant_roles` rows. Requires `system-admin`.
      responses:
        '204':
          description: User deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'

    post:
      tags: [Users]
      operationId: setUserPassword
      summary: Set a user's password
      description: |
        Self-update is allowed (must supply `currentPassword`). `system-admin`
        may reset any user's password without `currentPassword`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Tenants
  # ============================================================================

  /api/v1/tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create a tenant
      description: |
        Forwards the request to compute. Requires `system-admin`.
        Documented at `components/platform.md §4.1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List visible tenants
      description: |
        Any authenticated user may call. For `system-admin`, returns all
        tenants (subject to query filters); otherwise returns only tenants in
        which the caller has any binding in `user_tenant_roles`. Documented
        at `components/platform.md §7.1`.
      parameters:
        - name: q
          in: query
          description: Fuzzy keyword on `name` / `displayName`.
          required: false
          schema:
            type: string
        - name: namespace
          in: query
          description: |
            Exact-match organizational grouping filter (top-level
            `tenants.namespace`). **Not** the K8s namespace
            (`spec.namespace.name`).
          required: false
          schema:
            type: string
        - name: phase
          in: query
          description: Filter by tenant `status.phase`.
          required: false
          schema:
            $ref: '#/components/schemas/TenantPhase'
        - name: includeArchived
          in: query
          description: Include soft-deleted tenants.
          required: false
          schema:
            type: boolean
            default: false
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, updated_at]
            default: created_at
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of visible tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tenants/{name}:
    parameters:
      - $ref: '#/components/parameters/TenantName'

    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get a tenant
      description: |
        Requires `system-admin` OR `user@self`+ on `{name}`. When
        `?includeArchived=true`, the lookup also returns soft-deleted tenants.
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tenant detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Tenants]
      operationId: updateTenant
      summary: Update tenant display metadata
      description: |
        JSON Merge Patch on mutable fields: top-level `namespace`
        (organizational grouping), `displayName`, `description`, `labels`,
        `annotations`, plus `spec.namespace.labels` / `spec.namespace.annotations`
        (PG-only display metadata, do not bump generation),
        `spec.initResources`, and `spec.quotas[]`. Requires `system-admin`.
        Immutable fields (`name`, `owner`, `spec.namespace.name`,
        `spec.quotas[].pool`, `spec.quotas[].name`) are rejected at the
        request layer with `400 immutable-field`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TenantPatchRequest'
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Tenants]
      operationId: deleteTenant
      summary: Soft-delete a tenant
      description: |
        Requires `system-admin`. Returns 409 if `user_tenant_roles` is
        non-empty for this tenant. The cluster-manager retains soft-deleted
        rows for the configured retention window; use `POST /restore` to
        bring one back.
      responses:
        '204':
          description: Tenant soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tenants/{name}/restore:
    parameters:
      - $ref: '#/components/parameters/TenantName'
    post:
      tags: [Tenants]
      operationId: restoreTenant
      summary: Restore a soft-deleted tenant
      description: |
        Requires `system-admin`. Clears `deleted_at` on the cluster-manager
        side and re-triggers the reconciler. Member bindings are not restored
        automatically.
      responses:
        '200':
          description: Restored tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Quotas (sub-resource of Tenant)
  # ============================================================================

  /api/v1/tenants/{name}/quotas:
    parameters:
      - $ref: '#/components/parameters/TenantName'

    get:
      tags: [Quotas]
      operationId: listTenantQuotas
      summary: List quotas for a tenant
      description: |
        Requires `system-admin` OR `user@self`+ on `{name}`. Returns
        `spec.quotas[]` plus `status.quotas[].used` (informer-fed).
      responses:
        '200':
          description: Quota list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Quotas]
      operationId: createTenantQuota
      summary: Add a new quota to a tenant
      description: |
        Requires `system-admin` OR `tenant-admin@self`. `(pool, name)` is
        immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaCreateRequest'
      responses:
        '201':
          description: Quota added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tenants/{name}/quotas/{pool}/{quotaName}:
    parameters:
      - $ref: '#/components/parameters/TenantName'
      - $ref: '#/components/parameters/QuotaPoolPathParam'
      - $ref: '#/components/parameters/QuotaNamePathParam'

    patch:
      tags: [Quotas]
      operationId: updateTenantQuota
      summary: Update a quota's `min` / `max`
      description: Requires `system-admin` OR `tenant-admin@self`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/QuotaPatchRequest'
      responses:
        '200':
          description: Quota updated; returns the updated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Quotas]
      operationId: deleteTenantQuota
      summary: Remove a quota from a tenant
      description: Requires `system-admin` OR `tenant-admin@self`.
      responses:
        '204':
          description: Quota removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Members (sub-resource of Tenant)
  # ============================================================================

  /api/v1/tenants/{name}/members:
    parameters:
      - $ref: '#/components/parameters/TenantName'

    get:
      tags: [Members]
      operationId: listTenantMembers
      summary: List members of a tenant
      description: Requires `system-admin` OR `tenant-admin@self`.
      responses:
        '200':
          description: Member list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Members]
      operationId: addTenantMember
      summary: Add a member to a tenant
      description: |
        Requires `system-admin` OR `tenant-admin@self`. `roleName` must be
        `tenant-admin` or `user`; binding `system-admin` via this endpoint is
        rejected with `400 role-not-bindable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tenants/{name}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TenantName'
      - $ref: '#/components/parameters/MemberUserId'

    patch:
      tags: [Members]
      operationId: updateTenantMember
      summary: Change a member's role
      description: |
        Requires `system-admin` OR `tenant-admin@self`. Cannot demote oneself
        out of the last `tenant-admin` slot; returns `409 last-tenant-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatchRequest'
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Members]
      operationId: removeTenantMember
      summary: Remove a member from a tenant
      description: |
        Requires `system-admin` OR `tenant-admin@self`. Self-protection:
        cannot remove oneself from the last `tenant-admin` slot — returns
        `409 last-tenant-admin`.
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Workspaces
  # ============================================================================

  /api/v1/workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace (`MLService(native, deployment)` with
        `kind=workspace`) and a dedicated PVC for `/workspace` data in the
        active tenant (`X-Axisml-Tenant`). Requires `user@self`+. Documented
        at `components/platform.md §7.1`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
      responses:
        '201':
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces
      description: |
        With `X-Axisml-Tenant`: scoped to that tenant. `tenant-admin@self`
        sees the whole tenant; `user` sees only their own (`owner` pushed
        down to compute). Without the header: `system-admin` gets the
        cross-tenant view; non-admin callers receive
        `400 active-tenant-required`. Documented at
        `components/platform.md §7.1`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeaderOptional'
        - name: owner
          in: query
          description: Admin-only filter.
          required: false
          schema:
            type: string
        - name: phase
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WorkspacePhase'
        - name: q
          in: query
          description: Keyword (matches `displayName` / `image`).
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'

    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get a workspace
      description: |
        Requires `system-admin` OR `tenant-admin@self` OR
        `user@self & @owner`.
      responses:
        '200':
          description: Workspace detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update workspace display metadata
      description: |
        Only `displayName` and `description` are mutable; all other fields
        require delete + recreate. Requires owner OR `tenant-admin@self` OR
        `system-admin`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WorkspacePatchRequest'
      responses:
        '200':
          description: Updated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: |
        Requires owner OR `tenant-admin@self` OR `system-admin`. Idempotent.
        Body controls PVC retention; default deletes the PVC.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDeleteRequest'
      responses:
        '204':
          description: Workspace deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/start:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
    post:
      tags: [Workspaces]
      operationId: startWorkspace
      summary: Start a workspace (scale to 1 replica)
      description: |
        Translates to `compute.ScaleService(replicas=1)`. Idempotent.
        Requires owner OR `tenant-admin@self` OR `system-admin`.
      responses:
        '200':
          description: Workspace started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/stop:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
    post:
      tags: [Workspaces]
      operationId: stopWorkspace
      summary: Stop a workspace (scale to 0 replicas)
      description: |
        Translates to `compute.ScaleService(replicas=0)`. Idempotent.
        Requires owner OR `tenant-admin@self` OR `system-admin`.
      responses:
        '200':
          description: Workspace stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/access:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceAccess
      summary: Get a short-TTL JWT for IDE access
      description: |
        Returns `{ url, jwt, headerName, expiresAt }` for opening the IDE
        through Envoy Gateway. Requires owner OR `tenant-admin@self` OR
        `system-admin`. Documented at `components/platform.md §7.3`.
      responses:
        '200':
          description: Workspace access credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceEvents
      summary: List service-level Kubernetes events for the workspace
      description: |
        Proxies `compute.ListServiceEvents`. Returns events whose
        `involvedObject` references the MLService CR, its derived workload,
        or its HTTPRoute. Pod-level events are NOT included; use
        `/workspaces/{id}/pods/{pod}/events` for those.
      responses:
        '200':
          description: Service-level event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/pods:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
    get:
      tags: [Workspaces]
      operationId: listWorkspacePods
      summary: List Pods backing the workspace
      description: |
        Proxies `compute.ListServicePods`. Each Pod carries `replicaIndex`
        and `role` when the backend produces them.
      responses:
        '200':
          description: Pod list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/pods/{pod}/logs:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
      - $ref: '#/components/parameters/PodName'
    get:
      tags: [Workspaces]
      operationId: getWorkspacePodLogs
      summary: Fetch or stream a workspace pod's logs
      description: |
        Proxies `compute.GetServicePodLogs`. `text/plain` for `follow=false`,
        `text/event-stream` for `follow=true`. 410 Gone if the Pod has been
        garbage-collected.
      parameters:
        - $ref: '#/components/parameters/LogContainer'
        - $ref: '#/components/parameters/LogTailLines'
        - $ref: '#/components/parameters/LogFollow'
        - $ref: '#/components/parameters/LogPrevious'
      responses:
        '200':
          description: |
            Log stream. `text/plain` for `follow=false`; `text/event-stream`
            for `follow=true`.
          content:
            text/plain:
              schema:
                type: string
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/workspaces/{name}/pods/{pod}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceName'
      - $ref: '#/components/parameters/PodName'
    get:
      tags: [Workspaces]
      operationId: listWorkspacePodEvents
      summary: List K8s events for one pod of the workspace
      description: |
        Proxies `compute.ListServicePodEvents`. Returns events whose
        `involvedObject` references the named pod only.
      responses:
        '200':
          description: Pod-scoped events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Jobs
  # ============================================================================

  /api/v1/jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a Job (reusable template)
      description: |
        Creates a Job definition in the active tenant (`X-Axisml-Tenant`).
        The definition holds a reusable template; no run is started. Requires
        `user@self`+. Documented at `components/platform.md §4.2`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateInput'
      responses:
        '201':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List Jobs
      description: |
        With `X-Axisml-Tenant`: scoped to that tenant; `user` callers are
        restricted to their own jobs (server-side `owner` filter);
        `tenant-admin@self` and `system-admin` see all jobs in the tenant.
        Without the header: `system-admin` gets the cross-tenant view
        (optionally narrowed by `?owner=`); non-admin callers receive
        `400 active-tenant-required`. Documented at `components/platform.md §4.2`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeaderOptional'
        - name: owner
          in: query
          description: Admin-only filter.
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of Jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'

    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a Job
      description: |
        Resolves `{name}` within the active tenant (`X-Axisml-Tenant`).
        Requires `system-admin` OR `tenant-admin@self` OR
        `user@self & @owner`.
      responses:
        '200':
          description: Job detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Jobs]
      operationId: updateJob
      summary: Edit a Job template / metadata
      description: |
        Updates the reusable template `spec` and/or display metadata. All fields
        optional; provided fields replace. Editing `spec` affects only runs
        triggered afterwards (existing runs are snapshots). Requires owner OR
        `tenant-admin@self` OR `system-admin`. Documented at
        `components/platform.md §4.2`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatchInput'
      responses:
        '200':
          description: Job updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: Delete a Job (cascade)
      description: |
        If any Run is in an active (non-terminal) phase the request is rejected
        with `409 job-has-active-runs`; otherwise all (terminal) Runs are cascade
        soft-deleted, then the definition. Requires owner OR `tenant-admin@self` OR
        `system-admin`. Documented at `components/platform.md §4.2`.
      responses:
        '204':
          description: Job (and its terminal Runs) deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'

    post:
      tags: [Jobs]
      operationId: triggerRun
      summary: Trigger a Run from a Job
      description: |
        Snapshots the Job template (⊕ optional overrides) into a new compute
        `MLRun` named `<job>-<n>` (n = max existing run number + 1, with 409
        retry) labelled `axisml.io/job=<job>`. Referenced artifact versions are
        pre-checked `Ready` (else `400`). Omit the body for a plain re-run.
        Requires `user@self`+. Documented at `components/platform.md §4.2`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTriggerInput'
      responses:
        '201':
          description: Run triggered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Jobs]
      operationId: listRuns
      summary: List Runs of a Job (live)
      description: |
        Lists the Job's Runs live from compute
        (`ListMLRuns(labelSelector=axisml.io/job=<job>)`). Requires same role as
        GET Job detail. Documented at `components/platform.md §4.2`.
      parameters:
        - name: phase
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunPhase'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of Runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs/{run}:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/RunName'

    get:
      tags: [Jobs]
      operationId: getRun
      summary: Get a Run
      description: |
        Proxies `compute.GetMLRun(<job>-<n>)`. Requires same role as GET Job
        detail.
      responses:
        '200':
          description: Run detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Jobs]
      operationId: deleteRun
      summary: Delete a Run
      description: |
        Proxies `compute.DeleteMLRun(<job>-<n>)`. The MLRun spec is immutable;
        deletion is terminal. Requires owner OR `tenant-admin@self` OR
        `system-admin`. Idempotent.
      responses:
        '204':
          description: Run deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs/{run}/cancel:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/RunName'
    post:
      tags: [Jobs]
      operationId: cancelRun
      summary: Cancel a running Run
      description: |
        Proxies `compute.CancelMLRun(<job>-<n>)`. Requires owner OR
        `tenant-admin@self` OR `system-admin`. Cannot cancel runs in `Creating`
        (compute returns 409). Documented at `components/platform.md §4.2`.
      responses:
        '200':
          description: Cancel request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs/{run}/pods:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/RunName'
    get:
      tags: [Jobs]
      operationId: listRunPods
      summary: List Pods belonging to a Run
      description: |
        Proxies `compute.ListMLRunPods(<job>-<n>)`. Each Pod carries
        `replicaIndex` and `role` when the backend produces them. Requires same
        role as GET Run detail.
      responses:
        '200':
          description: Pod list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs/{run}/events:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/RunName'
    get:
      tags: [Jobs]
      operationId: listRunEvents
      summary: List Run-level Kubernetes events
      description: |
        Proxies `compute.ListMLRunEvents(<job>-<n>)`. Returns events whose
        `involvedObject` references the MLRun CR itself or any derived PodGroup.
        Pod-level events are NOT included; use
        `/api/v1/jobs/{name}/runs/{run}/pods/{pod}/events`. Requires same role as
        GET Run detail.
      responses:
        '200':
          description: Job-level event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs/{run}/pods/{pod}/logs:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/RunName'
      - $ref: '#/components/parameters/PodName'
    get:
      tags: [Jobs]
      operationId: getRunPodLogs
      summary: Fetch or stream a Run pod's logs
      description: |
        Proxies `compute.GetMLRunPodLogs(<job>-<n>)`. When `follow=true`, response
        is an SSE `text/event-stream` of log lines. Otherwise a chunked
        `text/plain` stream. Requires same role as GET Run detail.
      parameters:
        - $ref: '#/components/parameters/LogContainer'
        - $ref: '#/components/parameters/LogTailLines'
        - $ref: '#/components/parameters/LogFollow'
        - $ref: '#/components/parameters/LogPrevious'
      responses:
        '200':
          description: Log stream.
          content:
            text/plain:
              schema:
                type: string
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/jobs/{name}/runs/{run}/pods/{pod}/events:
    parameters:
      - $ref: '#/components/parameters/ActiveTenantHeader'
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/RunName'
      - $ref: '#/components/parameters/PodName'
    get:
      tags: [Jobs]
      operationId: listRunPodEvents
      summary: List K8s events for one pod of a Run
      description: |
        Proxies `compute.ListMLRunPodEvents(<job>-<n>)`. Returns events whose
        `involvedObject` references the named pod only.
      responses:
        '200':
          description: Pod-scoped events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Services
  # ============================================================================

  /api/v1/mlservices:
    post:
      tags: [MLServices]
      operationId: createMLService
      summary: Deploy a new online inference service
      description: |
        Deploys a service in the active tenant (`X-Axisml-Tenant`). Requires
        `user@self`+. Documented at `components/platform.md §7.1`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLServiceCreateRequest'
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [MLServices]
      operationId: listMLServices
      summary: List services
      description: |
        With `X-Axisml-Tenant`: scoped to that tenant; `tenant-admin@self`
        sees the whole tenant; `user` sees only their own. Without the
        header: `system-admin` gets the cross-tenant view; non-admin callers
        receive `400 active-tenant-required`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeaderOptional'
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: phase
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MLServicePhase'
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: backendName
          in: query
          required: false
          schema:
            type: string
        - name: backendEngine
          in: query
          required: false
          schema:
            type: string
        - name: modelName
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLServiceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'

    get:
      tags: [MLServices]
      operationId: getMLService
      summary: Get a service
      description: |
        Requires `system-admin` OR `tenant-admin@self` OR
        `user@self & @owner`.
      responses:
        '200':
          description: Service detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [MLServices]
      operationId: updateMLService
      summary: Update service display metadata
      description: |
        Only `displayName` / `description` / `labels` / `annotations` are
        mutable; all other fields require creating a new service version.
        Requires owner OR `tenant-admin@self` OR `system-admin`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MLServicePatchRequest'
      responses:
        '200':
          description: Updated service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [MLServices]
      operationId: deleteMLService
      summary: Delete a service
      description: |
        Idempotent. Defensive: returns 404 if the target is `kind=workspace`
        (use the workspaces endpoint). Requires owner OR `tenant-admin@self`
        OR `system-admin`.
      responses:
        '204':
          description: Service deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/scale:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
    post:
      tags: [MLServices]
      operationId: scaleMLService
      summary: Set the replica count for a service
      description: |
        Requires owner OR `tenant-admin@self` OR `system-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLServiceScaleRequest'
      responses:
        '200':
          description: Scale request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/start:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
    post:
      tags: [MLServices]
      operationId: startMLService
      summary: Start a stopped service
      description: |
        Convenience for "scale to last-known positive replicas, or 1 if
        unknown". Requires owner OR `tenant-admin@self` OR `system-admin`.
      responses:
        '200':
          description: Start request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/stop:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
    post:
      tags: [MLServices]
      operationId: stopMLService
      summary: Stop a service (scale to 0)
      description: |
        Convenience for "scale 0". Requires owner OR `tenant-admin@self` OR
        `system-admin`.
      responses:
        '200':
          description: Stop request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/metrics:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
    get:
      tags: [MLServices]
      operationId: getMLServiceMetrics
      summary: Query Prometheus for service-level metrics
      description: |
        Documented at `components/platform.md §7.4`. Requires same role as GET
        detail.
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MLServiceMetricName'
        - name: range
          in: query
          required: true
          description: ISO 8601 duration (`5m`, `15m`, `1h`, `6h`, `24h`).
          schema:
            type: string
        - name: step
          in: query
          required: false
          schema:
            type: string
        - name: percentile
          in: query
          required: false
          description: Only for `metric=latency`.
          schema:
            type: string
            enum: [p50, p95, p99]
            default: p95
      responses:
        '200':
          description: Metric series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/pods:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
    get:
      tags: [MLServices]
      operationId: listMLServicePods
      summary: List Pods backing a service
      description: |
        Proxies `compute.ListServicePods`. Each Pod carries `replicaIndex` and
        `role` when the backend produces them.
      responses:
        '200':
          description: Pod list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/events:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
    get:
      tags: [MLServices]
      operationId: getMLServiceEvents
      summary: List service-level Kubernetes events
      description: |
        Proxies `compute.ListServiceEvents`. Returns events whose
        `involvedObject` references the MLService CR, its derived workload,
        or its HTTPRoute. Pod-level events are NOT included; use
        `/mlservices/{id}/pods/{pod}/events` for those.
      responses:
        '200':
          description: Service-level event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/pods/{pod}/logs:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
      - $ref: '#/components/parameters/PodName'
    get:
      tags: [MLServices]
      operationId: getMLServicePodLogs
      summary: Fetch or stream a service pod's logs
      description: |
        Proxies `compute.GetServicePodLogs`. `text/plain` for `follow=false`,
        `text/event-stream` for `follow=true`. 410 Gone if the Pod has been
        garbage-collected.
      parameters:
        - $ref: '#/components/parameters/LogContainer'
        - $ref: '#/components/parameters/LogTailLines'
        - $ref: '#/components/parameters/LogFollow'
        - $ref: '#/components/parameters/LogPrevious'
      responses:
        '200':
          description: Log stream.
          content:
            text/plain:
              schema:
                type: string
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mlservices/{name}/pods/{pod}/events:
    parameters:
      - $ref: '#/components/parameters/MLServiceName'
      - $ref: '#/components/parameters/PodName'
    get:
      tags: [MLServices]
      operationId: listMLServicePodEvents
      summary: List K8s events for one pod of a service
      description: |
        Proxies `compute.ListServicePodEvents`. Returns events whose
        `involvedObject` references the named pod only.
      responses:
        '200':
          description: Pod-scoped events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Models
  # ============================================================================

  /api/v1/models:
    get:
      tags: [Models]
      operationId: listModelDefinitions
      summary: List model definitions
      description: |
        Lists model definitions (Platform-owned). With `X-Axisml-Tenant`:
        scoped to that tenant. Without the header: `system-admin` gets the
        cross-tenant view (merged with `axisml-system` public definitions); non-admin
        callers receive `400 active-tenant-required`. Documented at
        `components/platform.md §4.5`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeaderOptional'
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of model definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDefinitionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/models/{tenant}/{name}:
    parameters:
      - $ref: '#/components/parameters/TenantPathParam'
      - $ref: '#/components/parameters/ArtifactName'

    post:
      tags: [Models]
      operationId: createModelDefinition
      summary: Create a model definition
      description: |
        Creates a model definition (name-level); no version is uploaded.
        Requires `user@self`+. Documented at `components/platform.md §4.5.1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactDefinitionCreateInput'
      responses:
        '201':
          description: Model definition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDefinitionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Models]
      operationId: getModelDefinition
      summary: Get a model definition
      description: Resolves the model definition `(tenant, name)`.
      responses:
        '200':
          description: Model definition detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDefinitionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Models]
      operationId: updateModelDefinition
      summary: Edit model definition metadata
      description: |
        Updates `displayName` / `description` / `labels` / `annotations` / definition
        `spec` (name-level business metadata). Requires owner OR
        `tenant-admin@self` OR `system-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactDefinitionPatchInput'
      responses:
        '200':
          description: Model definition updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDefinitionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Models]
      operationId: deleteModelDefinition
      summary: Delete a model definition (cascade)
      description: |
        Cascade soft-deletes all versions of the definition (proxying
        `artifacts.DeleteArtifact` per version), then the definition. Requires owner
        OR `tenant-admin@self` OR `system-admin`. Documented at
        `components/platform.md §4.5.1`.
      responses:
        '204':
          description: Model definition and its versions deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/models/{tenant}/{name}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantPathParam'
      - $ref: '#/components/parameters/ArtifactName'

    get:
      tags: [Models]
      operationId: listModelVersions
      summary: List versions of a model definition (live)
      description: |
        Lists versions live from artifacts
        (`ListArtifactsByKind(kind=model, name)`). Documented at
        `components/platform.md §4.5.1`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ModelStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of model versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Models]
      operationId: initiateModel
      summary: Initiate a model version upload
      description: |
        Proxies `artifacts.InitiateUpload(kind=model, name)` against the active
        tenant. Requires `user@self`+. Documented at `components/platform.md §4.5.1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInitiateRequest'
      responses:
        '202':
          description: Upload initiated; returns credentials and a model handle.
          content:
            application/json:
              schema:
