      - $ref: '#/components/parameters/ArtifactVersion'

    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get a dataset artifact
      description: |
        Resolves the artifact via the artifacts service. Requires the caller
        to have visibility into the dataset's owning tenant. Addressing uses
        the immutable `(tenant, name, version)` tuple.
      responses:
        '200':
          description: Dataset detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Artifact has been soft-deleted; the tuple is permanently gone.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Datasets]
      operationId: updateDataset
      summary: Update mutable dataset metadata
      description: |
        Updates `displayName` / `description` / `labels` / `annotations`.
        All other fields immutable post-create or frozen on `Ready`.
        Requires owner OR `tenant-admin@self` OR `system-admin`. Proxies
        `artifacts.UpdateArtifact`. Documented at
        `components/platform.md §4.5.1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpdateRequest'
      responses:
        '200':
          description: Dataset updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Datasets]
      operationId: deleteDataset
      summary: Soft-delete a dataset artifact
      description: |
        Requires owner OR `tenant-admin@self` OR `system-admin`. Proxies
        `artifacts.DeleteArtifact`.
      responses:
        '204':
          description: Dataset deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/datasets/{tenant}/{name}/versions/{version}/complete:
    parameters:
      - $ref: '#/components/parameters/TenantPathParam'
      - $ref: '#/components/parameters/ArtifactName'
      - $ref: '#/components/parameters/ArtifactVersion'
    post:
      tags: [Datasets]
      operationId: completeDataset
      summary: Mark a dataset upload complete
      description: |
        Proxies `artifacts.CompleteUpload`. Body carries the canonical-JSON
        SHA256 of `artifact-manifest.json`. Documented at
        `components/platform.md §4.5.1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCompleteRequest'
      responses:
        '200':
          description: Dataset finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/datasets/{tenant}/{name}/versions/{version}/resolve:
    parameters:
      - $ref: '#/components/parameters/TenantPathParam'
      - $ref: '#/components/parameters/ArtifactName'
      - $ref: '#/components/parameters/ArtifactVersion'
    get:
      tags: [Datasets]
      operationId: resolveDataset
      summary: Resolve download credentials for a dataset version
      description: |
        Proxies `artifacts.Resolve(usage=download)`. Returns the storage URI and
        short-TTL S3 STS credentials. Requires `user@self`+. Documented at
        `components/platform.md §4.5.1`.
      responses:
        '200':
          description: Resolved download target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResolveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # ResourcePools / ResourceUnits
  # ============================================================================

  /api/v1/resource-pools:
    post:
      tags: [ResourcePools]
      operationId: createResourcePool
      summary: Create a resource pool
      description: Requires `system-admin`. Documented at `components/platform.md §7.1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePoolCreateRequest'
      responses:
        '201':
          description: Resource pool created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [ResourcePools]
      operationId: listResourcePools
      summary: List resource pools
      description: |
        Any authenticated user. Each item carries an aggregated
        `resourceUnitCount`. Documented at `components/platform.md §7.1`.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePoolList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/resource-pools/{pool}:
    parameters:
      - $ref: '#/components/parameters/PoolName'

    get:
      tags: [ResourcePools]
      operationId: getResourcePool
      summary: Get a resource pool
      description: Any authenticated user.
      responses:
        '200':
          description: Pool detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePool'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [ResourcePools]
      operationId: updateResourcePool
      summary: Update a resource pool
      description: |
        Requires `system-admin`. Mutable fields: `description`,
        `nodeSelector`, `tolerations`, `metadata`. `name` is immutable.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ResourcePoolPatchRequest'
      responses:
        '200':
          description: Updated pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [ResourcePools]
      operationId: deleteResourcePool
      summary: Delete a resource pool
      description: |
        Requires `system-admin`. Returns 409 if any resource units, active
        jobs, or active services still reference the pool. Documented at
        `components/platform.md §7.1`.
      responses:
        '204':
          description: Pool deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/resource-pools/{pool}/units:
    parameters:
      - $ref: '#/components/parameters/PoolName'

    get:
      tags: [ResourceUnits]
      operationId: listResourceUnits
      summary: List resource units in a pool
      description: Any authenticated user. Documented at `components/platform.md §7.2`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of resource units.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnitList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [ResourceUnits]
      operationId: createResourceUnit
      summary: Create a resource unit in a pool
      description: Requires `system-admin`. Documented at `components/platform.md §7.2`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUnitCreateRequest'
      responses:
        '201':
          description: Resource unit created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/resource-pools/{pool}/units/{unit}:
    parameters:
      - $ref: '#/components/parameters/PoolName'
      - $ref: '#/components/parameters/UnitName'

    get:
      tags: [ResourceUnits]
      operationId: getResourceUnit
      summary: Get a resource unit
      description: Any authenticated user.
      responses:
        '200':
          description: Resource unit detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [ResourceUnits]
      operationId: updateResourceUnit
      summary: Update a resource unit
      description: |
        Requires `system-admin`. Mutable fields: `description`, `requests`,
        `limits`, `nodeSelector`. `name` and `pool` are immutable.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ResourceUnitPatchRequest'
      responses:
        '200':
          description: Updated resource unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [ResourceUnits]
      operationId: deleteResourceUnit
      summary: Delete a resource unit
      description: |
        Requires `system-admin`. Returns 409 if any active jobs / services
        still reference the unit. Documented at `components/platform.md
        §7.2`.
      responses:
        '204':
          description: Resource unit deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Dashboard
  # ============================================================================

  /api/v1/dashboard/overview:
    get:
      tags: [Dashboard]
      operationId: getDashboardOverview
      summary: Get the dashboard summary
      description: |
        Aggregated counts of tenants, jobs, services, workspaces, and GPU
        utilization. With `X-Axisml-Tenant`: scoped to that tenant. Without
        the header: `system-admin` gets the cross-tenant aggregate; non-admin
        callers receive `400 active-tenant-required`. Documented at
        `components/platform.md §4 / §6`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeaderOptional'
      responses:
        '200':
          description: Dashboard overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/dashboard/metrics:
    get:
      tags: [Dashboard]
      operationId: getDashboardMetrics
      summary: Query Prometheus through Platform
      description: |
        Thin proxy for the dashboard UI. With `X-Axisml-Tenant`: queries are
        constrained to the tenant (label selectors auto-injected). Without
        the header: only `system-admin` may issue cross-tenant queries.
        Documented at `components/platform.md §4 / §6`.
      parameters:
        - $ref: '#/components/parameters/ActiveTenantHeaderOptional'
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: true
          schema:
            type: string
        - name: step
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Metric series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # Audit
  # ============================================================================

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Query the audit log
      description: |
        Requires `system-admin`. Documented at `components/platform.md §7.4 /
        §11`.
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: A page of audit logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by Platform itself on `POST /api/v1/auth/login` or
        `POST /api/v1/auth/refresh`. The `aud` claim is `axisml-platform`
        for ordinary API access; the workspace access endpoint issues a
        separate JWT with `aud=axisml-workspace` (carried as a Cookie)
        intended for the data-plane (network gateway), not this API.

  parameters:
    ActiveTenantHeader:
      name: X-Axisml-Tenant
      in: header
      required: true
      description: |
        Active tenant for this request. See `info.description` ("Active
        tenant"). Required on tenant-implicit list/create/name-keyed-detail
        endpoints; if absent, non-admin callers receive
        `400 active-tenant-required` and `system-admin` falls back to
        cross-tenant behavior on list endpoints only.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    ActiveTenantHeaderOptional:
      name: X-Axisml-Tenant
      in: header
      required: false
      description: |
        Optional active-tenant override. On UUID-keyed detail endpoints the
        UUID is self-sufficient; this header is only used as a consistency
        cross-check. On list endpoints it scopes the query; if omitted,
        `system-admin` receives the cross-tenant view and non-admins receive
        `400 active-tenant-required`.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    Limit:
      name: limit
      in: query
      description: Page size (default 50, max 200).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Continue:
      name: continue
      in: query
      description: Opaque continue token from the previous response.
      required: false
      schema:
        type: string

    TenantName:
      name: name
      in: path
      required: true
      description: Tenant name (DNS-1123, immutable).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    TenantPathParam:
      name: tenant
      in: path
      required: true
      description: Tenant name (DNS-1123, immutable).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 3
        maxLength: 40

    QuotaPoolPathParam:
      name: pool
      in: path
      required: true
      description: ResourcePool name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    QuotaNamePathParam:
      name: quotaName
      in: path
      required: true
      description: Quota name (unique within `(tenant, pool)`).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    UserId:
      name: id
      in: path
      required: true
      description: Platform user id.
      schema:
        type: string
        format: uuid

    MemberUserId:
      name: userId
      in: path
      required: true
      description: Platform user id of the member.
      schema:
        type: string
        format: uuid

    WorkspaceName:
      name: name
      in: path
      required: true
      description: Workspace name within the active tenant (DNS-1123).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    MLServiceName:
      name: name
      in: path
      required: true
      description: Service name within the active tenant (DNS-1123).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    JobName:
      name: name
      in: path
      required: true
      description: Job name (DNS-1123, unique within the tenant).
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    RunName:
      name: run
      in: path
      required: true
      description: |
        Run name, of the form `<job>-<n>` — the underlying compute MLRun name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    ArtifactName:
      name: name
      in: path
      required: true
      description: |
        Artifact name (OCI-repo-safe). Combined with `{tenant}` + `{version}`
        forms the immutable addressing tuple consumed by the downstream
        artifacts service.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
        minLength: 1
        maxLength: 128

    ArtifactVersion:
      name: version
      in: path
      required: true
      description: |
        Artifact version (OCI tag-safe). Immutable; never reused even after
        soft-delete.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{1,128}$'
        minLength: 1
        maxLength: 128

    PoolName:
      name: pool
      in: path
      required: true
      description: ResourcePool name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    UnitName:
      name: unit
      in: path
      required: true
      description: ResourceUnit name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        minLength: 1
        maxLength: 63

    PodName:
      name: pod
      in: path
      required: true
      description: Pod name (the canonical K8s pod identity, as listed by `/pods`).
      schema:
        type: string
        minLength: 1
        maxLength: 253

    LogContainer:
      name: container
      in: query
      required: false
      schema:
        type: string

    LogTailLines:
      name: tailLines
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1000

    LogFollow:
      name: follow
      in: query
      required: false
      description: Stream logs as SSE.
      schema:
        type: boolean
        default: false

    LogPrevious:
      name: previous
      in: query
      required: false
      description: Read logs from the previous (crashed) container instance.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Malformed request (invalid syntax, missing required fields, immutable field, etc.).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer JWT.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but insufficient role for the requested operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        Resource not found, OR the caller cannot see it. Platform deliberately
        conflates these for non-admins to avoid information leak.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Conflicts with a precondition: duplicate name, last-tenant-admin
        protection, in-use blocker, immutable transition, etc.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Semantically invalid request (e.g., cross-field violations).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Target resource (e.g., a Pod log) is no longer retained.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Upstream service (cluster-manager / compute / artifacts / Prometheus) failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: Endpoint is reserved but not yet implemented (e.g., MVP placeholder).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------------
    # Common
    # ------------------------------------------------------------------

    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: Canonical error type URI.
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Short machine-readable error code (e.g., `immutable-field`, `last-tenant-admin`, `pool-in-use`).
        errors:
          type: array
          description: Field-level validation issues, when applicable.
          items:
            $ref: '#/components/schemas/ProblemFieldError'

    ProblemFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        components:
          type: object
          additionalProperties:
            type: string
          description: |
            Per-dependency status keyed by name (`db`, `clusterManager`,
            `compute`, `artifacts`, `prometheus`).

    StringMap:
      type: object
      additionalProperties:
        type: string

    ResourceMap:
      type: object
      description: |
        Kubernetes-style resource quantity map (e.g., `{ "cpu": "100",
        "memory": "1Ti", "nvidia.com/gpu": "8" }`).
      additionalProperties:
        type: string

    EnvVar:
      type: object
      required: [name]
      properties:
        name:
          type: string
        value:
          type: string
        valueFrom:
          type: object
          additionalProperties: true
          description: |
            Optional Kubernetes-style `valueFrom` selector (`configMapKeyRef`,
            `secretKeyRef`, ...). Passed through to compute.

    Condition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
        status:
          type: string
          enum: ["True", "False", "Unknown"]
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time

    Toleration:
      type: object
      additionalProperties: true
      description: Mirrors a Kubernetes `corev1.Toleration`.

    # ------------------------------------------------------------------
    # Auth / Users
    # ------------------------------------------------------------------

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password

    LoginResponse:
      type: object
      required: [jwt, user, tenantRoles]
      properties:
        jwt:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        tenantRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserTenantRole'

    RefreshResponse:
      type: object
      required: [jwt]
      properties:
        jwt:
          type: string
        expiresAt:
          type: string
          format: date-time

    UserTenantRole:
      type: object
      required: [tenantName, roleName]
      properties:
        tenantName:
          type: string
        roleName:
          $ref: '#/components/schemas/RoleName'

    RoleName:
      type: string
      enum:
        - system-admin
        - tenant-admin
        - user

    MeResponse:
      type: object
      required: [user, tenantRoles, permissions, isSystemAdmin]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenantRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserTenantRole'
        permissions:
          type: array
          description: Flat list of permission strings resolved from role bindings.
          items:
            type: string
        isSystemAdmin:
          type: boolean

    User:
      type: object
      required: [id, username, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        disabled:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email

    UserSummaryList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    UserPatchRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        disabled:
          type: boolean

    SetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: Required for self-change; omitted by system-admin reset.
        newPassword:
          type: string
          minLength: 8
          format: password

    # ------------------------------------------------------------------
    # Tenants
    # ------------------------------------------------------------------

    TenantPhase:
      type: string
      enum: [Creating, Active, Failed, Deleting, Deleted]

    Quota:
      type: object
      required: [pool, name, max]
      properties:
        pool:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        min:
          $ref: '#/components/schemas/ResourceMap'
        max:
          $ref: '#/components/schemas/ResourceMap'

    QuotaStatus:
      type: object
      description: |
        Per-quota status. `used` is ephemeral (live from compute's Tenant
        Informer cache, not persisted in PG); omitted on cache cold-start or
        stale-watch windows, in which case the response carries a `Warning`
        header. See `components/compute-service.md §5.3`.
      required: [pool, name]
      properties:
        pool:
          type: string
        name:
          type: string
        used:
          $ref: '#/components/schemas/ResourceMap'
        elasticQuotaName:
          type: string
          description: |
            Rendered ElasticQuota CR name, e.g.,
            `axisml-<tenant>-<pool>-<quota>`.

    QuotaList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quota'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/QuotaStatus'
        count:
          type: integer
          minimum: 0

    QuotaCreateRequest:
      type: object
      required: [pool, name, max]
      properties:
        pool:
          type: string
        name:
          type: string
        min:
          $ref: '#/components/schemas/ResourceMap'
        max:
          $ref: '#/components/schemas/ResourceMap'

    QuotaPatchRequest:
      type: object
      description: Only `min` / `max` may be patched.
      properties:
        min:
          $ref: '#/components/schemas/ResourceMap'
        max:
          $ref: '#/components/schemas/ResourceMap'

    Namespace:
      type: object
      description: Tenant-owned Kubernetes Namespace declaration.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    SecretSourceRef:
      type: object
      required: [namespace, name]
      properties:
        namespace:
          type: string
        name:
          type: string

    ConfigMapSourceRef:
      type: object
      required: [namespace, name]
      properties:
        namespace:
          type: string
        name:
          type: string

    ImagePullSecretInit:
      type: object
      required: [name, sourceSecretRef]
      properties:
        name:
          type: string
        sourceSecretRef:
          $ref: '#/components/schemas/SecretSourceRef'

    SecretInit:
      type: object
      required: [name, sourceSecretRef]
      properties:
        name:
          type: string
        type:
          type: string
          default: Opaque
        sourceSecretRef:
          $ref: '#/components/schemas/SecretSourceRef'

    ConfigMapInit:
      type: object
      required: [name, sourceConfigMapRef]
      properties:
        name:
          type: string
        sourceConfigMapRef:
          $ref: '#/components/schemas/ConfigMapSourceRef'

    ServiceAccountInit:
      type: object
      required: [name]
      properties:
        name:
          type: string
        imagePullSecrets:
          type: array
          items:
            type: string
        rbac:
          type: object
          additionalProperties: true

    InitResources:
      type: object
      properties:
        imagePullSecrets:
          type: array
          items:
            $ref: '#/components/schemas/ImagePullSecretInit'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretInit'
        configMaps:
          type: array
          items:
            $ref: '#/components/schemas/ConfigMapInit'
        serviceAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountInit'

    Tenant:
      type: object
      description: |
        Platform-facing Tenant DTO. Top-level `namespace` is the
        organizational grouping; the K8s namespace lives at
        `spec.namespace.name`.
      required:
        - name
        - namespace
        - displayName
        - spec
        - phase
        - generation
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
          description: Tenant name; DNS-1123, immutable after creation. URL key.
        namespace:
          type: string
          description: |
            Organizational grouping (e.g. `ai-team`). Mutable. Distinct
            from `spec.namespace.name`.
          maxLength: 100
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
          description: Creator; immutable.
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/TenantSpec'
        generation:
          type: integer
          format: int64
          minimum: 1
        observedGeneration:
          type: integer
          format: int64
          minimum: 0
        phase:
          $ref: '#/components/schemas/TenantPhase'
        status:
          $ref: '#/components/schemas/TenantStatus'
        computeNamespace:
          type: string
          description: |
            Convenience flat copy of `spec.namespace.name`, surfaced so the
            frontend can build downstream Compute calls without re-parsing
            `spec`.
        artifactsNamespace:
          type: string
          description: |
            Same value as `computeNamespace` in the current design; kept as
            a separate field so future deployments can split the two without
            an API break.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    TenantSpec:
      type: object
      required: [namespace]
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: K8s namespace metadata. `name` immutable; `labels` / `annotations` mutable.
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/Quota'
        initResources:
          $ref: '#/components/schemas/InitResources'

    TenantStatus:
      type: object
      description: Status sub-object excluding `phase` (which lives at the top level of `Tenant`).
      properties:
        message:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/QuotaStatus'

    TenantList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    TenantCreateRequest:
      type: object
      required: [name, namespace, displayName, spec]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 3
          maxLength: 40
        namespace:
          type: string
          description: Organizational grouping. Mutable post-create.
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/TenantSpec'

    TenantPatchRequest:
      type: object
      description: |
        JSON Merge Patch body. Mutable Platform fields:
        top-level `namespace` (organizational grouping), `displayName`,
        `description`, `labels`, `annotations`, plus `spec.namespace.labels`
        / `spec.namespace.annotations` (PG-only display metadata, do not bump
        generation), `spec.initResources`, and `spec.quotas[]`.
      properties:
        namespace:
          type: string
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          type: object
          properties:
            namespace:
              type: object
              properties:
                labels:
                  $ref: '#/components/schemas/StringMap'
                annotations:
                  $ref: '#/components/schemas/StringMap'
            quotas:
              type: array
              items:
                $ref: '#/components/schemas/Quota'
            initResources:
              $ref: '#/components/schemas/InitResources'

    # ------------------------------------------------------------------
    # Members
    # ------------------------------------------------------------------

    Member:
      type: object
      required: [userId, username, roleName, addedAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        roleName:
          $ref: '#/components/schemas/RoleName'
        addedAt:
          type: string
          format: date-time

    MemberList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    MemberCreateRequest:
      type: object
      required: [userId, roleName]
      properties:
        userId:
          type: string
          format: uuid
        roleName:
          type: string
          enum: [tenant-admin, user]
          description: |
            `system-admin` cannot be bound through this endpoint; use the
            user management menu.

    MemberPatchRequest:
      type: object
      required: [roleName]
      properties:
        roleName:
          type: string
          enum: [tenant-admin, user]

    # ------------------------------------------------------------------
    # Workspaces
    # ------------------------------------------------------------------

    WorkspacePhase:
      type: string
      description: Derived from compute service phase + replicas. Hoisted to the top of `Workspace` for B-tree filtering.
      enum:
        - Creating
        - Starting
        - Running
        - Degraded
        - Failed
        - Stopped
        - Deleting
        - Deleted
        - Pending

    WorkspaceDesiredState:
      type: string
      enum: [Running, Stopped]

    WorkspaceLifecycle:
      type: object
      description: Workspace lifecycle policy.
      properties:
        idleTimeoutSeconds:
          type: integer
          minimum: 0
          description: |
            Auto-stop after this many seconds of inactivity. Phase-two; MVP
            ignores the value but accepts it for forward compatibility.

    WorkspacePersistentVolume:
      type: object
      description: PVC settings for the `/workspace` mount.
      properties:
        size:
          type: string
          description: Capacity quantity (e.g., `20Gi`).
          default: 20Gi
        storageClassName:
          type: string

    WorkspaceEndpoint:
      type: object
      properties:
        accessUrl:
          type: string
          description: |
            User-facing URL behind Envoy Gateway. Pattern:
            `https://<gateway>/workspaces/<tenant>/<service.name>/`.
        internalDns:
          type: string
          description: In-cluster DNS, e.g., `<service.name>.<ns>.svc.cluster.local:<port>`.

    Workspace:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - owner
        - image
        - containerPort
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Compute `services.id` (uuid).
        namespace:
          type: string
          description: Compute namespace == `Tenant.spec.namespace.name`.
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        computeNamespace:
          type: string
          description: Same as `namespace`; surfaced explicitly for clarity.
        name:
          type: string
          description: |
            MLService CR name (Platform-generated `ws-<crockford32-rand40>`).
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
          description: Username of the creator.
        ownerId:
          type: string
          format: uuid
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        poolName:
          type: string
          description: ResourcePool name (CR `metadata.name`). compute looks it up via Informer cache and expands.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        resourcePoolName:
          type: string
        unitName:
          type: string
          description: Unit name inside the chosen pool's `spec.units[]`. compute expands `(poolName, unitName)` at create time.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        resourceUnitName:
          type: string
        quota:
          type: string
          description: Rendered ElasticQuota CR name.
        resources:
          $ref: '#/components/schemas/ResourceMap'
        persistentVolume:
          $ref: '#/components/schemas/WorkspacePersistentVolume'
        pvcName:
          type: string
          description: Derived PVC name (`axisml-ws-<id8>-data`).
        pvcSize:
          type: string
        pvcUsed:
          type: string
        lifecycle:
          $ref: '#/components/schemas/WorkspaceLifecycle'
        replicas:
          type: integer
          minimum: 0
        readyReplicas:
          type: integer
          minimum: 0
        desiredState:
          $ref: '#/components/schemas/WorkspaceDesiredState'
        phase:
          $ref: '#/components/schemas/WorkspacePhase'
        message:
          type: string
        endpoint:
          $ref: '#/components/schemas/WorkspaceEndpoint'
        lastStartedAt:
          type: string
          format: date-time
          nullable: true
        lastStoppedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    WorkspaceCreateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required:
        - image
        - containerPort
        - poolName
        - unitName
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        image:
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        poolName:
          type: string
          description: ResourcePool name (CR `metadata.name`). compute looks it up via Informer cache and expands.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        unitName:
          type: string
          description: Unit name inside the chosen pool's `spec.units[]`. compute expands `(poolName, unitName)` at create time.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        quota:
          type: string
          description: |
            Quota name within the tenant's `(poolName)` slot. Platform
            renders `axisml-<tenant>-<pool>-<quota>` before forwarding.
        persistentVolume:
          $ref: '#/components/schemas/WorkspacePersistentVolume'
        lifecycle:
          $ref: '#/components/schemas/WorkspaceLifecycle'

    WorkspacePatchRequest:
      type: object
      description: Only `displayName` / `description` / `lifecycle` are mutable.
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        lifecycle:
          $ref: '#/components/schemas/WorkspaceLifecycle'

    WorkspaceDeleteRequest:
      type: object
      properties:
        deletePvc:
          type: boolean
          default: true

    WorkspaceAccess:
      type: object
      required: [url, jwt, headerName, expiresAt]
      properties:
        url:
          type: string
        jwt:
          type: string
        headerName:
          type: string
          default: Authorization
        expiresAt:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # Jobs
    # ------------------------------------------------------------------

    RunPhase:
      type: string
      description: |
        Run (compute MLRun) phase. The active (non-terminal) phases —
        Creating / Pending / Running / Canceling — block Job-definition deletion.
      enum:
        - Creating
        - Pending
        - Running
        - Succeeded
        - Failed
        - Canceling
        - Cancelled
        - Deleting
        - Deleted

    Backend:
      type: object
      required: [name, engine]
      properties:
        name:
          type: string
          enum: [native, kubeflow-trainer, kserve, custom]
        engine:
          type: string
          description: |
            Engine within the backend (e.g., `job`, `podgroup`, `pytorchjob`,
            `tfjob`, `mpijob`, `deployment`, `statefulset`, `inference`,
            `llminference`).
        config:
          type: object
          additionalProperties: true

    RoleTemplate:
      type: object
      properties:
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        ports:
          type: array
          items:
            type: object
            additionalProperties: true
        resources:
          $ref: '#/components/schemas/ResourceMap'
        volumes:
          type: array
          description: |
            Pod volumes (shape matches K8s `PodSpec.volumes[]`). Pass-through
            from compute. Surfaced on the Platform DTO so Workspace / Job edit
            UIs can display mounts. Authoritative shape lives in
            `apis/compute-service.yaml`.
          items:
            type: object
            additionalProperties: true
        volumeMounts:
          type: array
          description: |
            Per-container volume mounts (shape matches K8s
            `PodSpec.containers[0].volumeMounts[]`). Pass-through from compute.
          items:
            type: object
            additionalProperties: true

    MLRunRole:
      type: object
      required: [name, template]
      properties:
        name:
          type: string
          description: Role label (e.g., `worker`, `master`, `chief`, `ps`, `launcher`).
        replicas:
          type: integer
          minimum: 1
          default: 1
        restartPolicy:
          type: string
          enum: [Never, OnFailure, Always]
        template:
          $ref: '#/components/schemas/RoleTemplate'

    MLRunRoleStatus:
      type: object
      properties:
        name:
          type: string
        replicas:
          type: integer
        activeReplicas:
          type: integer
        readyReplicas:
          type: integer
        succeededReplicas:
          type: integer
        failedReplicas:
          type: integer
        template:
          $ref: '#/components/schemas/RoleTemplate'
        restartPolicy:
          type: string

    RunPolicy:
      type: object
      properties:
        activeDeadlineSeconds:
          type: integer
          minimum: 1
        ttlSecondsAfterFinished:
          type: integer
          minimum: 0
        backoffLimit:
          type: integer
          minimum: 0
        progressDeadlineSeconds:
          type: integer
          minimum: 1

    RunView:
      type: object
      description: |
        A single Run = the compute `MLRun` produced by triggering a Job
        (`<job>-<n>`). Surfaced read-only; phase / status are live from compute.
      required:
        - namespace
        - tenantName
        - name
        - owner
        - backend
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Compute `mlruns.id` (uuid) when available.
        namespace:
          type: string
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        computeNamespace:
          type: string
        name:
          type: string
        jobName:
          type: string
          description: Parent Job name; the run is named `<jobName>-<runNumber>`.
        runNumber:
          type: integer
          description: Sequence number within the parent Job.
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        backend:
          $ref: '#/components/schemas/Backend'
        poolName:
          type: string
          description: ResourcePool name (CR `metadata.name`). compute looks it up via Informer cache and expands.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        resourcePoolName:
          type: string
        unitName:
          type: string
          description: Unit name inside the chosen pool's `spec.units[]`. compute expands `(poolName, unitName)` at create time.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        resourceUnitName:
          type: string
        quota:
          type: string
          description: Rendered ElasticQuota CR name.
        resources:
          $ref: '#/components/schemas/ResourceMap'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MLRunRoleStatus'
        runPolicy:
          $ref: '#/components/schemas/RunPolicy'
        spec:
          $ref: '#/components/schemas/MLRunSpec'
        phase:
          $ref: '#/components/schemas/RunPhase'
        message:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MLRunSpec:
      type: object
      description: |
        Mirror of `apis/compute-service.yaml#/components/schemas/MLRunSpec`
        (pass-through from compute). Surfaced on `RunView` so the UI can render
        a complete YAML view of a run. The authoritative shape and validation
        rules live in `components/compute-operator.md §4.1.1` and
        `apis/compute-service.yaml`.
      properties:
        backend:
          $ref: '#/components/schemas/Backend'
        scheduling:
          type: object
          additionalProperties: true
          description: |
            Pass-through scheduling block (quota / priorityClass / nodeSelector
            / tolerations). Shape matches compute `Scheduling`.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MLRunRole'
        runPolicy:
          $ref: '#/components/schemas/RunPolicy'

    RunList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunView'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    # ------------------------------------------------------------------
    # Jobs (Platform-owned definitions) + Run trigger
    # ------------------------------------------------------------------

    ArtifactRef:
      type: object
      description: Reference to an artifact version consumed by a run.
      required: [kind, name, version]
      properties:
        kind:
          type: string
          enum: [image, model, dataset]
        name:
          type: string
        version:
          type: string

    JobSpec:
      type: object
      description: |
        Reusable Job template. A run snapshots this (⊕ trigger-time overrides)
        into a compute MLRun. `scheduling` carries names only — compute expands
        pool/unit and assembles the ElasticQuota name. Authoritative MLRun spec
        shape lives in `components/compute-operator.md §4.1.1`.
      required: [backend, roles]
      properties:
        backend:
          $ref: '#/components/schemas/Backend'
        poolName:
          type: string
          description: ResourcePool name (CR `metadata.name`). compute looks it up via Informer cache and expands.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        unitName:
          type: string
          description: Unit name inside the chosen pool's `spec.units[]`. compute expands `(poolName, unitName)` at trigger time.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        quota:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MLRunRole'
        runPolicy:
          $ref: '#/components/schemas/RunPolicy'
        artifacts:
          type: array
          description: Artifact references (image / model / dataset) by name+version.
          items:
            $ref: '#/components/schemas/ArtifactRef'

    JobView:
      type: object
      description: A reusable Job template (Platform-owned).
      required:
        - id
        - namespace
        - tenantName
        - name
        - owner
        - spec
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Platform `jobs.id`.
        namespace:
          type: string
          description: Tenant name (= partition key).
        tenantName:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/JobSpec'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobView'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    JobCreateInput:
      type: object
      required: [name, spec]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/JobSpec'

    JobPatchInput:
      type: object
      description: |
        All fields optional; provided fields replace. Editing `spec` affects only
        runs triggered afterwards (existing runs are immutable snapshots).
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          $ref: '#/components/schemas/JobSpec'

    RunTriggerInput:
      type: object
      description: |
        Optional overrides applied on top of the Job template when triggering a
        run. Omit the body (or all fields) for a plain re-run. The whitelist is
        deliberately narrow: `backend.{name,engine}` and role topology cannot be
        overridden — edit the Job template instead.
      properties:
        displayName:
          type: string
          maxLength: 100
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        poolName:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        unitName:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        quota:
          type: string
        resources:
          $ref: '#/components/schemas/ResourceMap'
        artifacts:
          type: array
          description: Swap artifact versions referenced by the template.
          items:
            $ref: '#/components/schemas/ArtifactRef'
        roles:
          type: array
          description: Per-role hyperparameter overrides (args / env only).
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              args:
                type: array
                items:
                  type: string
              env:
                type: array
                items:
                  $ref: '#/components/schemas/EnvVar'

    # ------------------------------------------------------------------
    # Services
    # ------------------------------------------------------------------

    MLServicePhase:
      type: string
      enum:
        - Creating
        - Pending
        - Ready
        - Degraded
        - Failed
        - Stopped
        - Deleting
        - Deleted

    MLServiceRouteAuthType:
      type: string
      enum: [none, jwt, apiKey]

    MLServiceRouteAuth:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/MLServiceRouteAuthType'
        jwt:
          type: object
          properties:
            issuer:
              type: string
            audience:
              type: string
            jwksUri:
              type: string
        apiKey:
          type: object
          properties:
            secretRef:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                key:
                  type: string

    MLServiceRouteRateLimit:
      type: object
      properties:
        requestsPerSecond:
          type: integer
          minimum: 1
        burst:
          type: integer
          minimum: 1

    MLServiceRoute:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        path:
          type: string
        hostname:
          type: string
        auth:
          $ref: '#/components/schemas/MLServiceRouteAuth'
        rateLimit:
          $ref: '#/components/schemas/MLServiceRouteRateLimit'
        timeout:
          type: string
          description: ISO 8601 duration (e.g., `30s`).

    MLService:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - owner
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        computeNamespace:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        backend:
          $ref: '#/components/schemas/Backend'
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        poolName:
          type: string
          description: ResourcePool name (CR `metadata.name`). compute looks it up via Informer cache and expands.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        resourcePoolName:
          type: string
        unitName:
          type: string
          description: Unit name inside the chosen pool's `spec.units[]`. compute expands `(poolName, unitName)` at create time.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        resourceUnitName:
          type: string
        quota:
          type: string
        resources:
          $ref: '#/components/schemas/ResourceMap'
        replicas:
          type: integer
          minimum: 0
        readyReplicas:
          type: integer
          minimum: 0
        endpoint:
          type: string
        route:
          $ref: '#/components/schemas/MLServiceRoute'
        accessUrl:
          type: string
        phase:
          $ref: '#/components/schemas/MLServicePhase'
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MLServiceList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MLService'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    MLServiceCreateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required:
        - name
        - backend
        - image
        - containerPort
        - poolName
        - unitName
        - replicas
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 40
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        backend:
          $ref: '#/components/schemas/Backend'
        image:
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        poolName:
          type: string
          description: ResourcePool name (CR `metadata.name`). compute looks it up via Informer cache and expands.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        unitName:
          type: string
          description: Unit name inside the chosen pool's `spec.units[]`. compute expands `(poolName, unitName)` at create time.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        quota:
          type: string
        replicas:
          type: integer
          minimum: 0
        progressDeadlineSeconds:
          type: integer
          minimum: 1
        route:
          $ref: '#/components/schemas/MLServiceRoute'

    MLServicePatchRequest:
      type: object
      description: Only `displayName` / `description` are mutable.
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000

    MLServiceScaleRequest:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0

    MLServiceMetricName:
      type: string
      enum:
        - request_rate
        - latency
        - error_rate
        - cpu_util
        - mem_util
        - gpu_util

    MetricPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number

    MetricSeries:
      type: object
      required: [metric, range, series]
      properties:
        metric:
          type: string
        range:
          type: string
        step:
          type: string
        percentile:
          type: string
        unit:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'

    # ------------------------------------------------------------------
    # Models
    # ------------------------------------------------------------------

    ModelStatus:
      type: string
      description: Mirrors artifacts `ArtifactStatus` for `kind=model`.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    ModelSpec:
      type: object
      description: Artifact-side spec; pass-through.
      additionalProperties: true

    Model:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - version
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ModelStatus'
        digest:
          type: string
          description: OCI manifest digest once `complete` is called.
        spec:
          $ref: '#/components/schemas/ModelSpec'
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        uri:
          type: string
          description: Resolved storage URI (zot reference).
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ModelList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean
          description: |
            `true` when one or more upstream tenants failed during the
            cross-tenant merge (see `components/platform.md §5.3`). Returned
            items are still valid; missing tenants are listed in `error.detail`.

    ModelInitiateRequest:
      type: object
      description: |
        Target tenant and artifact name come from the URL path
        (`/{tenant}/{name}/versions`).
      required: [version]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ModelSpec'

    ModelInitiateResponse:
      type: object
      required: [id, uri]
      properties:
        id:
          type: string
          format: uuid
        uri:
          type: string
          description: Target push URI.
        storageKind:
          type: string
          enum: [oci, s3]
        uploadCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    ModelCompleteRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          description: OCI manifest digest (e.g., `sha256:...`).

    # ------------------------------------------------------------------
    # Artifacts — shared
    # ------------------------------------------------------------------

    ArtifactUpdateRequest:
      type: object
      description: |
        Body for the per-Kind PATCH endpoints (`updateModel` / `updateImage`
        / `updateDataset`). Partial-replace semantics on the four supported
        keys: a key omitted leaves the stored value untouched; a key set to
        `{}` clears `labels` / `annotations`. Submitting any other field
        returns `400 ImmutableField`. Mirrors `apis/artifact-hub.yaml#/components/schemas/ArtifactUpdateRequest`.
      properties:
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    # ------------------------------------------------------------------
    # Artifact definitions (Platform-owned definitions; shared across kinds)
    # ------------------------------------------------------------------

    ArtifactDefinitionCreateInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          type: object
          additionalProperties: true
          description: |
            Name-level business metadata (e.g. model `framework`/`format`, image
            `purpose`, dataset `format`). Version-level hard validation stays in
            the artifacts service.

    ArtifactDefinitionPatchInput:
      type: object
      description: All fields optional; provided fields replace.
      properties:
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          type: object
          additionalProperties: true

    ArtifactDefinitionView:
      type: object
      description: |
        A Platform-owned artifact definition (name-level). Versions live in
        the artifacts service and are listed live (see the `/versions` sub-resource).
      required: [id, namespace, tenantName, name, kind, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
          description: Tenant name (= partition key).
        tenantName:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [model, image, dataset]
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        spec:
          type: object
          additionalProperties: true
        visibility:
          type: string
          enum: [tenant, public]
          description: Public definitions live under the `axisml-system` tenant.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArtifactDefinitionList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactDefinitionView'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    ArtifactResolveResponse:
      type: object
      required: [storageKind, uri]
      properties:
        storageKind:
          type: string
          enum: [oci, s3]
        uri:
          type: string
        digest:
          type: string
        pullCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific download credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # Images
    # ------------------------------------------------------------------

    ImageStatus:
      type: string
      description: Mirrors artifacts `ArtifactStatus` for `kind=image`.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    ImageSpec:
      type: object
      description: |
        Artifact-side spec for `kind=image`; pass-through to artifacts. The
        canonical field shape lives in `apis/artifact-hub.yaml#/components/schemas/ImageSpec`
        (`purpose` required; `baseImage` / `platforms` / `entrypoint` / `notes` optional).
      additionalProperties: true

    Image:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - version
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ImageStatus'
        digest:
          type: string
          description: OCI manifest digest once `complete` is called.
        spec:
          $ref: '#/components/schemas/ImageSpec'
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        uri:
          type: string
          description: Resolved storage URI (zot reference).
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ImageList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean
          description: |
            `true` when one or more upstream tenants failed during the
            cross-tenant merge (see `components/platform.md §5.3`).

    ImageInitiateRequest:
      type: object
      description: |
        Target tenant and artifact name come from the URL path
        (`/{tenant}/{name}/versions`).
      required: [version, spec]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ImageSpec'

    ImageInitiateResponse:
      type: object
      required: [id, uri]
      properties:
        id:
          type: string
          format: uuid
        uri:
          type: string
          description: Target push URI.
        storageKind:
          type: string
          enum: [oci, s3]
        uploadCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    ImageCompleteRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          description: OCI manifest digest (e.g., `sha256:...`).

    # ------------------------------------------------------------------
    # Datasets
    # ------------------------------------------------------------------

    DatasetStatus:
      type: string
      description: Mirrors artifacts `ArtifactStatus` for `kind=dataset`.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    DatasetSpec:
      type: object
      description: |
        Artifact-side spec for `kind=dataset`; pass-through to artifacts. The
        canonical field shape lives in `apis/artifact-hub.yaml#/components/schemas/DatasetSpec`
        (`format` required; `schema` / `numRecords` / `totalSize` / `license` /
        `splits[]` optional).
      additionalProperties: true

    Dataset:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - version
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/DatasetStatus'
        digest:
          type: string
          description: |
            Canonical-JSON SHA256 of `artifact-manifest.json` once `complete`
            is called.
        spec:
          $ref: '#/components/schemas/DatasetSpec'
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        uri:
          type: string
          description: Resolved storage URI (RustFS S3 prefix).
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    DatasetList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean
          description: |
            `true` when one or more upstream tenants failed during the
            cross-tenant merge (see `components/platform.md §5.3`).

    DatasetInitiateRequest:
      type: object
      description: |
        Target tenant and artifact name come from the URL path
        (`/{tenant}/{name}/versions`).
      required: [version, spec]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/DatasetSpec'

    DatasetInitiateResponse:
      type: object
      required: [id, uri]
      properties:
        id:
          type: string
          format: uuid
        uri:
          type: string
          description: Target push URI (S3 prefix).
        storageKind:
          type: string
          enum: [oci, s3]
        uploadCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    DatasetCompleteRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          description: Canonical-JSON SHA256 of `artifact-manifest.json`.

    # ------------------------------------------------------------------
    # ResourcePools / ResourceUnits
    # ------------------------------------------------------------------

    ResourcePool:
      type: object
      description: |
        Pass-through of cluster-manager's `ResourcePool` (mirrors the K8s
        `ResourcePool` CR). `units` is the embedded `spec.units[]` array,
        not a separate REST resource.
      required: [name, createdAt]
      properties:
        name:
          type: string
        description:
          type: string
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        units:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUnit'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        nodeCount:
          type: integer
          description: |
            Optional; populated when Platform has access to the node matcher
            preview. Phase-two field — may be omitted in MVP responses.
        resourceVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourcePoolList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePool'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    ResourcePoolCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 40
        description:
          type: string
          maxLength: 1000
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        units:
          type: array
          description: Optional initial `spec.units[]`; can also be managed later via /units subroutes.
          items:
            $ref: '#/components/schemas/ResourceUnitCreateRequest'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ResourcePoolPatchRequest:
      type: object
      description: Pool-level fields only; use /units subroutes to manage individual units.
      properties:
        description:
          type: string
          maxLength: 1000
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ResourceUnit:
      type: object
      description: Embedded entry of `ResourcePool.spec.units[]`. Identified by `(poolName, name)`.
      required: [name, requests, limits]
      properties:
        name:
          type: string
        description:
          type: string
        requests:
          $ref: '#/components/schemas/ResourceMap'
        limits:
          $ref: '#/components/schemas/ResourceMap'
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ResourceUnitList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUnit'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    ResourceUnitCreateRequest:
      type: object
      required: [name, requests, limits]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 40
        description:
          type: string
          maxLength: 1000
        requests:
          $ref: '#/components/schemas/ResourceMap'
        limits:
          $ref: '#/components/schemas/ResourceMap'
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    ResourceUnitPatchRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
        requests:
          $ref: '#/components/schemas/ResourceMap'
        limits:
          $ref: '#/components/schemas/ResourceMap'
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    # ------------------------------------------------------------------
    # Proxy DTOs (events, logs, pods)
    # ------------------------------------------------------------------

    Pod:
      type: object
      required: [name, phase]
      properties:
        name:
          type: string
          description: Pod name; canonical identity (matches `kubectl get pods`).
        role:
          type: string
          description: Role name (`master` / `worker` / `ps`, `predictor` / `transformer` / `explainer`, ...).
        replicaIndex:
          type: integer
          minimum: 0
          description: 0-based replica index (from `axisml.io/replica-index`); absent when the backend does not produce stable identities.
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Unknown]
        nodeName:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        restartCount:
          type: integer
          minimum: 0

    PodList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pod'
        count:
          type: integer
          minimum: 0

    Event:
      type: object
      required: [type, reason, message, lastTimestamp]
      properties:
        type:
          type: string
          enum: [Normal, Warning]
        reason:
          type: string
        message:
          type: string
        source:
          type: string
        firstTimestamp:
          type: string
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
        involvedObject:
          type: object
          properties:
            kind:
              type: string
            name:
              type: string
            namespace:
              type: string

    EventList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        count:
          type: integer
          minimum: 0

    # ------------------------------------------------------------------
    # Dashboard
    # ------------------------------------------------------------------

    DashboardOverview:
      type: object
      properties:
        tenantCount:
          type: integer
        activeTenantCount:
          type: integer
        activeJobCount:
          type: integer
        runningServiceCount:
          type: integer
        runningWorkspaceCount:
          type: integer
        gpuTotal:
          type: number
        gpuUsed:
          type: number
        cpuTotalCores:
          type: number
        cpuUsedCores:
          type: number
        memoryTotalGiB:
          type: number
        memoryUsedGiB:
          type: number
        modelCount:
          type: integer

    # ------------------------------------------------------------------
    # Audit
    # ------------------------------------------------------------------

    AuditLog:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
        action:
          type: string
          description: |
            Dotted action name (e.g., `tenant.create`, `job.cancel`,
            `service.scale`, `workspace.delete`).
        target:
          type: string
          description: |
            Stable resource handle (e.g., `tenant:team-a`,
            `job:team-a/train-bert-base-01`, `service:<uuid>`,
            `workspace:<uuid>`).
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
        userAgent:
          type: string
        result:
          type: string
          enum: [success, failure]
        createdAt:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
