        partial:
          type: boolean

    WorkspaceCreateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required:
        - image
        - containerPort
        - resourcePoolId
        - resourceUnitId
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        image:
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        resourcePoolId:
          type: string
          format: uuid
        resourceUnitId:
          type: string
          format: uuid
        quota:
          type: string
          description: |
            Quota name within the tenant's `(resourcePoolId)` slot. Platform
            renders `axisml-<tenant>-<pool>-<quota>` before forwarding.
