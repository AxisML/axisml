    # ------------------------------------------------------------------
    # Jobs
    # ------------------------------------------------------------------

    JobPhase:
      type: string
      enum:
        - Creating
        - Pending
        - Running
        - Succeeded
        - Failed
        - Cancelled
        - Deleting
        - Deleted

    Backend:
      type: object
      required: [name, engine]
      properties:
        name:
          type: string
          enum: [native, kubeflow-trainer, kserve, custom]
        engine:
          type: string
          description: |
            Engine within the backend (e.g., `job`, `podgroup`, `pytorchjob`,
            `tfjob`, `mpijob`, `deployment`, `statefulset`, `inference`,
            `llminference`).
        config:
          type: object
          additionalProperties: true

    RoleTemplate:
      type: object
      properties:
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        ports:
          type: array
          items:
            type: object
            additionalProperties: true
        resources:
          $ref: '#/components/schemas/ResourceMap'
        volumes:
          type: array
          description: |
            Pod volumes (shape matches K8s `PodSpec.volumes[]`). Pass-through
            from compute. Surfaced on the Platform DTO so the register-model
            modal can offer a PVC dropdown and Workspace / Job edit UIs can
            display mounts. Authoritative shape lives in `apis/compute.yaml`.
          items:
            type: object
            additionalProperties: true
        volumeMounts:
          type: array
          description: |
            Per-container volume mounts (shape matches K8s
            `PodSpec.containers[0].volumeMounts[]`). Pass-through from compute.
          items:
            type: object
            additionalProperties: true

    JobRole:
      type: object
      required: [name, template]
      properties:
        name:
          type: string
          description: Role label (e.g., `worker`, `master`, `chief`, `ps`, `launcher`).
        replicas:
          type: integer
          minimum: 1
          default: 1
        restartPolicy:
          type: string
          enum: [Never, OnFailure, Always]
        template:
          $ref: '#/components/schemas/RoleTemplate'

    JobRoleStatus:
      type: object
      properties:
        name:
          type: string
        replicas:
          type: integer
        activeReplicas:
          type: integer
        readyReplicas:
          type: integer
        succeededReplicas:
          type: integer
        failedReplicas:
          type: integer
        template:
          $ref: '#/components/schemas/RoleTemplate'
        restartPolicy:
          type: string

    RunPolicy:
      type: object
      properties:
        activeDeadlineSeconds:
          type: integer
          minimum: 1
        ttlSecondsAfterFinished:
          type: integer
          minimum: 0
        backoffLimit:
          type: integer
          minimum: 0
        progressDeadlineSeconds:
          type: integer
          minimum: 1

    Job:
      type: object
      required:
        - namespace
        - tenantName
        - name
        - owner
        - backend
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Compute `jobs.id` (uuid) when available.
        namespace:
          type: string
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        computeNamespace:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        backend:
          $ref: '#/components/schemas/Backend'
        resourcePoolId:
          type: string
          format: uuid
        resourcePoolName:
          type: string
        resourceUnitId:
          type: string
          format: uuid
        resourceUnitName:
          type: string
        quota:
          type: string
          description: Rendered ElasticQuota CR name.
        resources:
          $ref: '#/components/schemas/ResourceMap'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/JobRoleStatus'
        runPolicy:
          $ref: '#/components/schemas/RunPolicy'
        spec:
          $ref: '#/components/schemas/MLJobSpec'
        phase:
          $ref: '#/components/schemas/JobPhase'
        message:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MLJobSpec:
      type: object
      description: |
        Mirror of `apis/compute.yaml#/components/schemas/MLJobSpec`
        (pass-through from compute). Surfaced on `Job` so the UI can
        drive `register-model` (read `outputs[]` + `roles[*].template.volumes[]`),
        prefill the "resubmit" form, and render a complete YAML view. The
        authoritative shape and validation rules live in
        `components/compute-operator.md §4.1.1` and `apis/compute.yaml`.
      properties:
        backend:
          $ref: '#/components/schemas/Backend'
        scheduling:
          type: object
          additionalProperties: true
          description: |
            Pass-through scheduling block (quota / priorityClass / nodeSelector
            / tolerations). Shape matches compute `Scheduling`.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/JobRole'
        runPolicy:
          $ref: '#/components/schemas/RunPolicy'
        outputs:
          type: array
          description: |
            Declarative output descriptors. See `JobOutput`. Read by the
            UI's register-model modal; the operator does not consume
            `outputs` at runtime.
          items:
            $ref: '#/components/schemas/JobOutput'

    JobOutput:
      type: object
      description: |
        Declaration of a single Job output. Mirror of
        `apis/compute.yaml#/components/schemas/JobOutput`.
      required: [name, kind, volumeName, sourcePath]
      properties:
        name:
          type: string
          description: Unique handle within the Job (DNS-1123).
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
        kind:
          type: string
          description: Artifact kind this output produces. Only `model` is supported initially.
          enum: [model]
        volumeName:
          type: string
          description: |
            Name of the volume in `roles[*].template.volumes[]` that holds
            the output bytes. Must be a PVC-backed volume.
          minLength: 1
          maxLength: 253
        sourcePath:
          type: string
          description: Relative path inside `volumeName` containing the artifact bytes.
          minLength: 1
          maxLength: 1024

    JobList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean

    JobCreateRequest:
      type: object
      required:
        - name
        - backend
        - resourcePoolId
        - resourceUnitId
        - roles
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        backend:
          $ref: '#/components/schemas/Backend'
        resourcePoolId:
          type: string
          format: uuid
        resourceUnitId:
          type: string
          format: uuid
        quota:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JobRole'
        runPolicy:
          $ref: '#/components/schemas/RunPolicy'
        outputs:
          type: array
          description: |
            Optional declarative output descriptors (`MLJob.spec.outputs[]`).
            Filling these at submit time enables the register-model modal
            to offer a typed dropdown instead of ad-hoc `outputPath` entry.
          items:
            $ref: '#/components/schemas/JobOutput'

    JobRegisterModelRequest:
      type: object
      description: |
        Body for `POST /api/v1/jobs/{name}/register-model`. Two addressing
        modes — exactly one must be supplied:

        - **Declared** (preferred): set `outputName` to reference an entry
          in `MLJob.spec.outputs[]` (must have `kind=model`). The referenced
          entry's `volumeName` + `sourcePath` are used.
        - **Ad-hoc**: omit `outputName` and provide BOTH `outputPath` AND
          `volumeName`. Used for jobs submitted without declared outputs.

        Mixing the two modes (e.g. `outputName` + `outputPath`) or
        partially populating ad-hoc (e.g. only `outputPath`, no
        `volumeName`) returns `400 InvalidOutputSelector`.

        `spec.trainingDatasetRef` is auto-filled by Platform when the Job's
        roles' container envs include `AXISML_DATASET_URI` pointing at a
        resolvable dataset artifact; users can override or supply it
        manually.
      required: [modelName, modelVersion, spec]
      properties:
        outputName:
          type: string
          description: |
            Name of the `MLJob.spec.outputs[]` entry whose `(volumeName,
            sourcePath)` Platform should bridge to artifacts. Mutually
            exclusive with `outputPath` + `volumeName`. When set the
            referenced output must have `kind=model`.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        outputPath:
          type: string
          description: |
            Ad-hoc relative path inside `volumeName` containing the model
            bytes. Used only when `outputName` is omitted; must be paired
            with `volumeName`.
          minLength: 1
          maxLength: 1024
        volumeName:
          type: string
          description: |
            Ad-hoc volume name in `roles[*].template.volumes[]` (must be a
            PVC-backed volume). Used only when `outputName` is omitted;
            must be paired with `outputPath`.
          minLength: 1
          maxLength: 253
        modelName:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
          minLength: 1
          maxLength: 100
        modelVersion:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ModelSpec'

    JobRegisterModelResponse:
      type: object
      description: |
        Envelope returned by `registerJobModel`. `artifact` + `upload`
        mirror the standard initiate response; `provenance` records which
        PVC / path the bytes live on so the user can find them. Bytes are
        pushed out-of-band by the caller (the cli flow is intentionally
        outside the Platform contract).
      required: [artifact, upload, provenance]
      properties:
        artifact:
          $ref: '#/components/schemas/Model'
        upload:
          type: object
          additionalProperties: true
          description: |
            Upload credentials envelope (same shape as
            `ModelInitiateResponse.uploadCredentials`).
        provenance:
          type: object
          required: [jobId, jobName, pvc, sourcePath]
          properties:
            jobId:
              type: string
              format: uuid
              description: Source job uuid (mirrored into the artifact's labels).
            jobName:
              type: string
              description: Source job name within the tenant.
            outputName:
              type: string
              description: Source `MLJob.spec.outputs[].name`; absent for ad-hoc registrations.
            pvc:
              type: string
              description: PVC name resolved from the chosen volume.
            sourcePath:
              type: string
              description: Path inside the PVC.

    # ------------------------------------------------------------------
    # Services
    # ------------------------------------------------------------------

    ServicePhase:
      type: string
      enum:
