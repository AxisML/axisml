      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 40
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        modelRef:
          $ref: '#/components/schemas/ModelRef'
        backend:
          $ref: '#/components/schemas/Backend'
        image:
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        resourcePoolId:
          type: string
          format: uuid
        resourceUnitId:
          type: string
          format: uuid
        quota:
          type: string
        replicas:
          type: integer
          minimum: 0
        progressDeadlineSeconds:
          type: integer
          minimum: 1
