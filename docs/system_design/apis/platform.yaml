    # ------------------------------------------------------------------
    # Models
    # ------------------------------------------------------------------

    ModelStatus:
      type: string
      description: Mirrors artifacts `ArtifactStatus` for `kind=model`.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    ModelSpec:
      type: object
      description: Artifact-side spec; pass-through.
      additionalProperties: true

    Model:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - version
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ModelStatus'
        digest:
          type: string
          description: OCI manifest digest once `complete` is called.
        spec:
          $ref: '#/components/schemas/ModelSpec'
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        uri:
          type: string
          description: Resolved storage URI (zot reference).
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ModelList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean
          description: |
            `true` when one or more upstream tenants failed during the
            cross-tenant merge (see `components/platform.md §5.3`). Returned
            items are still valid; missing tenants are listed in `error.detail`.

    ModelInitiateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required: [name, version]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ModelSpec'

    ModelInitiateResponse:
      type: object
      required: [id, uri]
      properties:
        id:
          type: string
          format: uuid
        uri:
          type: string
          description: Target push URI.
        storageKind:
          type: string
          enum: [oci, s3]
        uploadCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    ModelCompleteRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          description: OCI manifest digest (e.g., `sha256:...`).

    # ------------------------------------------------------------------
    # Artifacts — shared
    # ------------------------------------------------------------------

    ArtifactRef:
      type: string
      description: |
        Cross-artifact reference in the form `<namespace>/<kind>/<name>@<version>`,
        e.g. `team-a-models/model/llama-7b@v3`. Mirrors the shape used by
        the artifacts service.
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/(model|dataset|image)/[a-z0-9]([-a-z0-9._]*[a-z0-9])?@[A-Za-z0-9_.-]{1,128}$'
      example: team-a/dataset/mmlu@v1

    ArtifactUpdateRequest:
      type: object
      description: |
        Body for the per-Kind PATCH endpoints (`updateModel` / `updateImage`
        / `updateDataset`). Partial-replace semantics on the four supported
        keys: a key omitted leaves the stored value untouched; a key set to
        `{}` clears `labels` / `annotations`. Submitting any other field
        returns `400 ImmutableField`. Mirrors `apis/artifacts.yaml#/components/schemas/ArtifactUpdateRequest`.
      properties:
        displayName:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'

    # ------------------------------------------------------------------
    # Images
    # ------------------------------------------------------------------

    ImageStatus:
      type: string
      description: Mirrors artifacts `ArtifactStatus` for `kind=image`.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    ImageSpec:
      type: object
      description: |
        Artifact-side spec for `kind=image`; pass-through to artifacts. The
        canonical field shape lives in `apis/artifacts.yaml#/components/schemas/ImageSpec`
        (`purpose` required; `baseImage` / `platforms` / `entrypoint` / `notes` optional).
      additionalProperties: true

    Image:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - version
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ImageStatus'
        digest:
          type: string
          description: OCI manifest digest once `complete` is called.
        spec:
          $ref: '#/components/schemas/ImageSpec'
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        uri:
          type: string
          description: Resolved storage URI (zot reference).
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ImageList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean
          description: |
            `true` when one or more upstream tenants failed during the
            cross-tenant merge (see `components/platform.md §5.3`).

    ImageInitiateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required: [name, version, spec]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ImageSpec'

    ImageInitiateResponse:
      type: object
      required: [id, uri]
      properties:
        id:
          type: string
          format: uuid
        uri:
          type: string
          description: Target push URI.
        storageKind:
          type: string
          enum: [oci, s3]
        uploadCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    ImageCompleteRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          description: OCI manifest digest (e.g., `sha256:...`).

    # ------------------------------------------------------------------
    # Datasets
    # ------------------------------------------------------------------

    DatasetStatus:
      type: string
      description: Mirrors artifacts `ArtifactStatus` for `kind=dataset`.
      enum: [Uploading, Ready, Failed, Deleting, Deleted]

    DatasetSpec:
      type: object
      description: |
        Artifact-side spec for `kind=dataset`; pass-through to artifacts. The
        canonical field shape lives in `apis/artifacts.yaml#/components/schemas/DatasetSpec`
        (`format` required; `schema` / `numRecords` / `totalSize` / `license` /
        `splits[]` optional).
      additionalProperties: true

    Dataset:
      type: object
      required:
        - id
        - namespace
        - tenantName
        - name
        - version
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        tenantName:
          type: string
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/DatasetStatus'
        digest:
          type: string
          description: |
            Canonical-JSON SHA256 of `artifact-manifest.json` once `complete`
            is called.
        spec:
          $ref: '#/components/schemas/DatasetSpec'
        owner:
          type: string
        ownerId:
          type: string
          format: uuid
        uri:
          type: string
          description: Resolved storage URI (RustFS S3 prefix).
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    DatasetList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
        partial:
          type: boolean
          description: |
            `true` when one or more upstream tenants failed during the
            cross-tenant merge (see `components/platform.md §5.3`).

    DatasetInitiateRequest:
      type: object
      description: |
        Target tenant comes from the `X-Axisml-Tenant` request header (see
        `info.description` "Active tenant").
      required: [name, version, spec]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$'
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/DatasetSpec'

    DatasetInitiateResponse:
      type: object
      required: [id, uri]
      properties:
        id:
          type: string
          format: uuid
        uri:
          type: string
          description: Target push URI (S3 prefix).
        storageKind:
          type: string
          enum: [oci, s3]
        uploadCredentials:
          type: object
          additionalProperties: true
          description: Provider-specific credentials, pass-through from artifacts.
        expiresAt:
          type: string
          format: date-time

    DatasetCompleteRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          description: Canonical-JSON SHA256 of `artifact-manifest.json`.

    # ------------------------------------------------------------------
    # ResourcePools / ResourceUnits
    # ------------------------------------------------------------------

    ResourcePool:
      type: object
      required: [name, createdAt, updatedAt]
      properties:
        name:
          type: string
        description:
          type: string
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        metadata:
          type: object
          additionalProperties: true
        resourceUnitCount:
          type: integer
          description: |
            Aggregated count of `resource_units` in this pool. `-1` when the
            aggregation call failed (see `components/platform.md §4.3`).
        nodeCount:
          type: integer
          description: |
            Optional; populated when Platform has access to the node matcher
            preview. Phase-two field — may be omitted in MVP responses.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourcePoolList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePool'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    ResourcePoolCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 40
        description:
          type: string
          maxLength: 1000
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        metadata:
          type: object
          additionalProperties: true

    ResourcePoolPatchRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
        metadata:
          type: object
          additionalProperties: true

    ResourceUnit:
      type: object
      required: [name, pool, requests, limits, createdAt, updatedAt]
      properties:
        name:
          type: string
        pool:
          type: string
        description:
          type: string
        requests:
          $ref: '#/components/schemas/ResourceMap'
        limits:
          $ref: '#/components/schemas/ResourceMap'
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourceUnitList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUnit'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string

    ResourceUnitCreateRequest:
      type: object
      required: [name, requests, limits]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
        description:
          type: string
          maxLength: 1000
        requests:
          $ref: '#/components/schemas/ResourceMap'
        limits:
          $ref: '#/components/schemas/ResourceMap'
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        metadata:
          type: object
          additionalProperties: true

    ResourceUnitPatchRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
        requests:
          $ref: '#/components/schemas/ResourceMap'
        limits:
          $ref: '#/components/schemas/ResourceMap'
        nodeSelector:
          $ref: '#/components/schemas/StringMap'
        metadata:
          type: object
          additionalProperties: true

    # ------------------------------------------------------------------
    # Proxy DTOs (events, logs, pods)
    # ------------------------------------------------------------------

    Pod:
      type: object
      required: [name, phase]
      properties:
        name:
          type: string
          description: Pod name; canonical identity (matches `kubectl get pods`).
        role:
          type: string
          description: Role name (`master` / `worker` / `ps`, `predictor` / `transformer` / `explainer`, ...).
        replicaIndex:
          type: integer
          minimum: 0
          description: 0-based replica index (from `axisml.io/replica-index`); absent when the backend does not produce stable identities.
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Unknown]
        nodeName:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        restartCount:
          type: integer
          minimum: 0

    PodList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pod'
        count:
          type: integer
          minimum: 0

    Event:
      type: object
      required: [type, reason, message, lastTimestamp]
      properties:
        type:
          type: string
          enum: [Normal, Warning]
        reason:
          type: string
        message:
          type: string
        source:
          type: string
        firstTimestamp:
          type: string
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
        involvedObject:
          type: object
          properties:
            kind:
              type: string
            name:
              type: string
            namespace:
              type: string

    EventList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        count:
          type: integer
          minimum: 0

    # ------------------------------------------------------------------
    # Dashboard
    # ------------------------------------------------------------------

    DashboardOverview:
      type: object
      properties:
        tenantCount:
          type: integer
        activeTenantCount:
          type: integer
        activeJobCount:
          type: integer
        runningServiceCount:
          type: integer
        runningWorkspaceCount:
          type: integer
        gpuTotal:
          type: number
        gpuUsed:
          type: number
        cpuTotalCores:
          type: number
        cpuUsedCores:
          type: number
        memoryTotalGiB:
          type: number
        memoryUsedGiB:
          type: number
        modelCount:
          type: integer

    # ------------------------------------------------------------------
    # Audit
    # ------------------------------------------------------------------

    AuditLog:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
        action:
          type: string
          description: |
            Dotted action name (e.g., `tenant.create`, `job.cancel`,
            `service.scale`, `workspace.delete`).
        target:
          type: string
          description: |
            Stable resource handle (e.g., `tenant:team-a`,
            `job:team-a/train-bert-base-01`, `service:<uuid>`,
            `workspace:<uuid>`).
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
        userAgent:
          type: string
        result:
          type: string
          enum: [success, failure]
        createdAt:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        count:
          type: integer
          minimum: 0
        continueToken:
          type: string
