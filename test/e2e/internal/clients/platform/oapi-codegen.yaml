# oapi-codegen config for the e2e suite's platform-backend typed client.
# Generated from axisml-platform/docs/apis/platform.yaml — run `make e2e-client-gen`.
package: platform
output: internal/clients/platform/platform.gen.go
generate:
  models: true
  client: true
output-options:
  skip-prune: false
  # The platform spec has a component schema named `LoginResponse`, which would
  # collide with the client wrapper generated for the `login` operation. Suffix
  # the operation response wrappers to keep both.
  response-type-suffix: HTTPResp
