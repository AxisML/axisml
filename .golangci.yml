# Shared lint config for every Go module in the repo. Each module is a
# distinct golangci-lint invocation (see .github/workflows/ci.yml matrix);
# this file is the single source of truth for which linters and build tags
# they share.
version: "2"

run:
  build-tags:
    - integration
    # e2e-tagged files live only under test/e2e (a real-cluster suite excluded
    # from `go test`/CI runs). Listing the tag here is a no-op for every other
    # module but makes lint type-check the e2e sources, so a repo reorg that
    # breaks their imports/replace paths fails the lint job instead of silently
    # rotting until someone runs `make e2e-test`.
    - e2e

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  exclusions:
    paths:
      - bin
      - deploy
    rules:
      # kubebuilder-generated scheme registration follows the canonical
      # pattern that still uses the (deprecated) controller-runtime
      # scheme.Builder helper; no replacement is recommended upstream.
      - path: api/v1alpha1/groupversion_info\.go
        text: "SA1019: scheme.Builder is deprecated"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - bin
      - deploy
