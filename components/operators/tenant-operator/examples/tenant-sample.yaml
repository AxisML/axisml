# Example Tenant CR for local e2e testing.
#
# Prerequisites in the cluster (axisml-system namespace):
#   * Secret    "registry-source" of type kubernetes.io/dockerconfigjson
#   * ConfigMap "envs-source" with a couple of key/value entries
#
# Apply with:  kubectl apply -f examples/tenant-sample.yaml
# Inspect:     kubectl get tenant sample -o yaml
#              kubectl get ns,elasticquota,secret,sa,role,rolebinding \
#                       -A -l axisml.io/tenant-id=11111111-2222-3333-4444-555555555555
---
apiVersion: axisml.io/v1alpha1
kind: Tenant
metadata:
  name: sample
  labels:
    axisml.io/tenant-id: "11111111-2222-3333-4444-555555555555"
spec:
  displayName: "Sample Tenant"
  namespace:
    name: sample-ns
    labels:
      team: sample
  quotas:
    - pool: gpu
      name: default
      min:
        cpu: "2"
        memory: 4Gi
      max:
        cpu: "8"
        memory: 16Gi
        nvidia.com/gpu: "2"
  initResources:
    imagePullSecrets:
      - name: registry
        sourceSecretRef:
          namespace: axisml-system
          name: registry-source
    configMaps:
      - name: envs
        sourceConfigMapRef:
          namespace: axisml-system
          name: envs-source
    serviceAccounts:
      - name: default
        imagePullSecrets:
          - registry
        rbac:
          rules:
            - apiGroups: [""]
              resources: ["pods", "pods/log"]
              verbs: ["get", "list", "watch"]
  suspended: false
